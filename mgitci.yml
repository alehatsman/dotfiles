# dotfiles CI — validates all machine configs and runs static plan dry-runs on every push.
#
# Schema (moongit internal/ci/ci.go): version "1"; `on.push.branches` gates
# which refs trigger a run; `jobs` is a DAG wired by `needs`. Each job runs in a
# throwaway container off `image:`.
#
# Two-stage gate:
#   validate — `provision validate ./<machine>.yml` on all five machine
#              configs. Pure YAML/schema check; no system state needed.
#   plan     — `provision plan --plan-no-probe ./<machine>.yml` on all five.
#              Static template expansion: catches undefined vars, bad imports,
#              template render errors. --plan-no-probe skips the unless:/when:
#              checks that need the real target machine.
#
# NOTE: image: provision-ci:latest is currently unbuildable — it and its
# mooncake-ci:latest base were removed along with mooncake
# (components/mooncake, components/provision). moongitd's runner still execs
# every CI step as `mooncake step '<yaml>'` inside the container, a contract
# in moongit's own source (separate repo), not this file. This CI job will
# not run until that runner stops requiring mooncake.
version: "1"
on:
  push:
    branches:
      [
        main,
        "feat/*",
        "fix/*",
        "chore/*",
        "docs/*",
        "refactor/*",
        "test/*",
        "build/*",
        "ci/*",
        "perf/*",
      ]
jobs:
  validate:
    image: provision-ci:latest
    steps:
      - run: provision validate ./main_pc.yml
      - run: provision validate ./mini_pc.yml
      - run: provision validate ./x1.yml
      - run: provision validate ./mac.yml
      - run: provision validate ./work_mac.yml

  plan:
    image: provision-ci:latest
    needs: [validate]
    steps:
      - run: provision plan --plan-no-probe ./main_pc.yml
      - run: provision plan --plan-no-probe ./mini_pc.yml
      - run: provision plan --plan-no-probe ./x1.yml
      - run: provision plan --plan-no-probe ./mac.yml
      - run: provision plan --plan-no-probe ./work_mac.yml
