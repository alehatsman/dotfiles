---
# WSL-side provisioning. Runs INSIDE the WSL Ubuntu distro.
#
# Host-side bits (.wslconfig, firewall rule, scheduled task) are owned by
# platforms/windows/bootstrap.yml — those run on the Windows host, not here.

- import: ./packages.yml
  tags: [wsl, packages]

# Deploy /etc/wsl.conf — enables systemd so services survive WSL restarts.
# Note: changes take effect after 'wsl --shutdown' + reconnect.
- name: Deploy /etc/wsl.conf
  file.template:
    src: ./templates/wsl.conf.j2
    dest: /etc/wsl.conf
  as_user: root

# Just the WSL-only piece — the SSH server that lets the Windows host reach
# this guest. Everything else common (git, tmux, htop, ...) comes from
# packages/ubuntu_packages.yml.
- name: Install openssh-server
  pkg:
    name: openssh-server
    state: present
  as_user: root
  timeout: 10m
  retry:
    attempts: 3
    delay: 10s

# Drop-in config avoids clobbering the base sshd_config
- name: Configure SSH server (config dir)
  file.write:
    path: /etc/ssh/sshd_config.d
    state: directory
  as_user: root

- name: Deploy SSH server config
  file.template:
    src: ./templates/sshd_config.j2
    dest: /etc/ssh/sshd_config.d/wsl.conf
  as_user: root

# WSL2 mirrored networking shares the Windows host's port 22 binding (the
# host's OpenSSH listens there for cross-machine SSH). Ubuntu's default
# ssh.socket also wants 0.0.0.0:22, so the bind collides and ssh.service
# fails its socket dependency. Disable ssh.socket and let ssh.service own
# the listener on port 2222 (from our drop-in above).
- name: Disable ssh.socket (conflicts with port 22 under mirrored networking)
  os.service:
    name: ssh.socket
    state: stopped
    enabled: false
  as_user: root
  # Skip when systemd isn't running (first-apply on fresh WSL) and
  # skip when ssh.socket isn't a known unit (already-fresh distros).
  unless_command: |
    [ "$(ps -p 1 -o comm= 2>/dev/null)" != systemd ] || ! systemctl list-unit-files ssh.socket >/dev/null 2>&1

# Ubuntu's stock ssh.service is Restart=on-failure, which only covers
# crashes — clean exits and signal-kills aren't restarted. Bump it to
# Restart=always with a 2s respawn. The Windows-side WSL2-SSH-Keepalive
# task still handles the VM-down case (idle-shutdown or `wsl --shutdown`);
# this drop-in handles sshd-down-but-VM-up.
- name: Ensure /etc/systemd/system/ssh.service.d exists
  file.write:
    path: /etc/systemd/system/ssh.service.d
    state: directory
  as_user: root

- name: Deploy ssh.service Restart=always drop-in
  file.template:
    src: ./templates/ssh-restart.conf.j2
    dest: /etc/systemd/system/ssh.service.d/restart.conf
  as_user: root

# First apply on a fresh WSL distro happens BEFORE systemd is up
# (systemd is opt-in via the /etc/wsl.conf we just deployed). The
# drop-in above lands fine without systemd; the actual
# daemon-reload + enable + restart needs systemd, so we gate this
# step on the init-is-systemd predicate. After the operator runs
# `wsl --shutdown` and reconnects, the re-apply finds systemd up
# and completes the start.
- name: Enable and start SSH (requires systemd)
  os.service:
    name: ssh
    state: restarted
    enabled: true
    daemon_reload: true
  as_user: root
  unless_command: "[ \"$(ps -p 1 -o comm= 2>/dev/null)\" != systemd ]"

# ─── Tailscale ────────────────────────────────────────────────────────────
# The WSL guest owns the tailnet node on these boxes, NOT the Windows host
# (dotfiles#90). Everything a tailnet peer wants here — sshd :{{ wsl_ssh_port }},
# the mooncake agentd, moongitd — is bound inside this VM, so running
# tailscaled here puts those ports on tailscale0 directly: no Windows
# Firewall rule, no Hyper-V firewall rule, no dependency on mirrored
# networking carrying inbound traffic across the VM boundary.
#
# The trade accepted with that: the Windows host itself (its own agentd on
# windows_agentd_port, RDP) stays off the tailnet, and a downed WSL VM has no
# remote recovery path. vmIdleTimeout=-1 plus the keepalive task cover the
# routine cases; the LAN covers the rest.
#
# Not in packages.yml — tailscale needs its own apt repo, so the repo +
# package + service belong together as one block.

# main_pc reached the tailnet before this repo managed it, via a hand-written
# /etc/apt/sources.list.d/tailscale.list pointing at
# /usr/share/keyrings/tailscale-archive-keyring.gpg. pkg.repo writes DEB822
# (tailscale.sources) with its own keyring under /etc/apt/keyrings — two
# sources naming the same repo with different Signed-By values, which apt
# rejects outright: "Conflicting values set for option Signed-By".
#
# So this runs BEFORE the pkg.repo step, not after: pkg.repo does its own
# apt-get update inside the step, and that update is what blows up. Dropping
# a source never touches the installed package.
- name: Drop the legacy hand-written Tailscale apt list
  file.write:
    path: /etc/apt/sources.list.d/tailscale.list
    state: absent
  as_user: root
  tags: [wsl, tailscale]

- name: Register Tailscale apt repo
  pkg.repo:
    name: tailscale
    state: present
    apt:
      uri: https://pkgs.tailscale.com/stable/ubuntu
      suites: ["{{ ubuntu_codename }}"]
      components: [main]
      gpg_key_url: https://pkgs.tailscale.com/stable/ubuntu/{{ ubuntu_codename }}.noarmor.gpg
      gpg_check: false
  as_user: root
  tags: [wsl, tailscale]

- name: Install tailscale
  pkg:
    name: tailscale
    state: present
  as_user: root
  timeout: 10m
  retry:
    attempts: 3
    delay: 10s
  tags: [wsl, tailscale]

# `tailscale up` (login/authkey) stays manual — that's a secret, not
# something to script into version control. Same posture as arch/macos.
# Gated on systemd for the same reason as the SSH step above: the first
# apply on a fresh distro runs before systemd is up.
- name: Enable tailscaled
  os.service:
    name: tailscaled
    state: started
    enabled: true
  as_user: root
  unless_command: "[ \"$(ps -p 1 -o comm= 2>/dev/null)\" != systemd ]"
  tags: [wsl, tailscale]

# MagicDNS off inside WSL, deliberately (dotfiles#90). With CorpDNS on,
# tailscaled rewrites /etc/resolv.conf and WSL regenerates it right back
# (generateResolvConf=true in wsl.conf) — that's the standing
# "/etc/resolv.conf overwritten" health warning, and the same churn that
# produced the newline-in-DISPLAY bug in #71. The fleet addresses peers by
# IP (dex_remote_ip, peers.toml), so nothing here needs MagicDNS names.
#
# Skipped unless the daemon is up AND logged in — a logged-out node has no
# prefs to change yet. Until the operator runs `tailscale up`, use
# `tailscale up --accept-dns=false`; after that this step keeps it that way.
- name: Disable Tailscale MagicDNS in the WSL guest
  shell: tailscale set --accept-dns=false
  as_user: root
  unless_command: |
    [ "$(ps -p 1 -o comm= 2>/dev/null)" != systemd ] \
      || ! systemctl is-active --quiet tailscaled \
      || ! tailscale status >/dev/null 2>&1 \
      || tailscale debug prefs 2>/dev/null | grep -q '"CorpDNS": false'
  tags: [wsl, tailscale]

# GPU tooling. nvtop is a small Vulkan/NVIDIA monitor; CUDA is the heavy
# toolkit (multi-GB, ~30 min on first install). Both are skipped on
# machines without an NVIDIA GPU.
- name: Install nvtop (if NVIDIA GPU present)
  pkg:
    name: nvtop
    state: present
  as_user: root
  # Skip when no NVIDIA GPU on this host. `unless_command` reads as
  # "skip step if this exits 0", so we negate the lspci match.
  unless_command: "! lspci 2>/dev/null | grep -qi nvidia"
  timeout: 10m

# WSL injects /usr/lib/wsl/lib (nvidia-smi, libcuda.so) only for interactive
# login shells. Non-interactive SSH sessions, systemd units, and mooncake
# agentd all skip that injection — bare `nvidia-smi` returns 127, causing
# agents to incorrectly report no GPU driver. Adding the path to
# /etc/environment makes it visible to all processes unconditionally.
- name: Add /usr/lib/wsl/lib to PATH in /etc/environment (NVIDIA GPU)
  shell: |
    set -euo pipefail
    sed -i 's|PATH="\(.*\)"|PATH="\1:/usr/lib/wsl/lib"|' /etc/environment
  as_user: root
  unless_command: "grep -q '/usr/lib/wsl/lib' /etc/environment || [ ! -f /usr/lib/wsl/lib/nvidia-smi ]"
  tags: [wsl, gpu]

# CUDA stays shell until mooncake's pkg.repo apt driver gains the
# .deb-keyring-install pattern (the cuda-keyring_1.1-1_all.deb route
# isn't a normal source-list-with-gpg-key flow — it's a single .deb
# that drops the source.list AND the keyring in one go).
- name: Install CUDA toolkit (if NVIDIA GPU present, CUDA not installed)
  shell: |
    set -euo pipefail
    UBUNTU_VER=$(lsb_release -sr | tr -d '.')
    wget "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu${UBUNTU_VER}/x86_64/cuda-keyring_1.1-1_all.deb" \
      -O /tmp/cuda-keyring.deb
    dpkg -i /tmp/cuda-keyring.deb
    apt-get update
    apt-get install -y cuda-toolkit
    rm -f /tmp/cuda-keyring.deb
  as_user: root
  # Skip when no GPU OR nvcc is already on PATH.
  unless_command: "! lspci 2>/dev/null | grep -qi nvidia || command -v nvcc"
  timeout: 45m
