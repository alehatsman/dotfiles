---
# The blanket `apt-get upgrade` that used to run here is gone
# (migration §2, decided 2026-09-08): a full distro upgrade is a choice,
# not declared state, and it made every apply slow and irreproducible.
# Upgrade deliberately instead.

- name: Install bootstrap packages (needed before add-apt-repository / pkg.repo)
  pkg:
    state: present
    names:
      - gnupg
      - software-properties-common
      - curl
      - ca-certificates
      - apt-transport-https
  sudo: true
  timeout: 10m
  retry:
    attempts: 3
    delay: 10s

# Neovim PPA — kept as shell because the pkg.repo apt driver
# doesn't yet have a `ppa:` shorthand.
# Spelling out the launchpad URI + keyserver fetch via pkg.repo is
# possible but uglier than this one-liner.
- name: Add neovim PPA
  shell: |
    set -euo pipefail
    add-apt-repository ppa:neovim-ppa/unstable -y
    apt-get update
  # add-apt-repository is idempotent, but it and the apt-get update after
  # it cost ~20s every apply and reported `unknown` forever. The source
  # file it writes is the state worth checking (migration.md §3.3).
  unless: ls /etc/apt/sources.list.d | grep -q neovim-ppa
  sudo: true
  timeout: 5m
  retry:
    attempts: 2
    delay: 5s

- name: Install Ubuntu apt apps
  pkg:
    state: present
    names:
      - gnupg
      - curl
      - make
      - cmake
      - dos2unix
      - git
      - graphviz
      - imagemagick
      - mosh
      - nmap
      - tldr
      - tmux
      - wget
      - yamllint
      - unzip
      - neovim
      - nodejs
      # No `yarn`: on Debian the name is a virtual package cmdtest provides,
      # so `apt-get install -y yarn` exits 0 having installed nothing and the
      # step never converges. Real yarn comes from corepack, which ships with
      # nodejs. It is a genuine pacman and brew package, so the other two
      # platform lists keep it.
      - npm
      - zsh
      - golang-go
      - build-essential
      - python3-pip
      - httpie
      - hexyl
      - wl-clipboard
      - zstd
  sudo: true
  timeout: 20m
  retry:
    attempts: 3
    delay: 10s

# Retired with Clojure, the databases and the misc leftovers (dotfiles#34).
# No autoremove: dropping auto-installed deps is an upgrade-class choice.
- name: Remove retired apt packages
  pkg:
    manager: apt
    state: absent
    names: [clojure, rlwrap, sshfs, tor, lua5.1, ruby-full, postgresql-client]
  sudo: true
  timeout: 10m

# usql came from `go install`; components/usql is retired on these boxes.
- name: Remove usql
  file:
    path: ~/go/bin/usql
    state: absent
