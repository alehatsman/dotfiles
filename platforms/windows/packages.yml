---
# The blanket `apt-get upgrade` that used to run here is gone
# (decided 2026-09-08): a full distro upgrade is a choice,
# not declared state, and it made every apply slow and irreproducible.
# Upgrade deliberately instead.
#
# `manager: apt` is explicit on every pkg step below. Without it provision
# picks whatever manager the HOST has, so rendering this WSL-only file on a
# mac resolved to brew and failed validation with `brew must not run as
# root` -- which is what broke `just ci` from a mac.

- name: Install bootstrap packages (needed before add-apt-repository / pkg.repo)
  pkg:
    manager: apt
    state: present
    names:
      - gnupg
      - software-properties-common
      - curl
      - ca-certificates
      - apt-transport-https
  sudo: true
  timeout: 10m
  retry:
    attempts: 3
    delay: 10s

# Neovim PPA — kept as shell because the pkg.repo apt driver
# doesn't yet have a `ppa:` shorthand.
# Spelling out the launchpad URI + keyserver fetch via pkg.repo is
# possible but uglier than this one-liner.
- name: Add neovim PPA
  shell: |
    set -euo pipefail
    add-apt-repository ppa:neovim-ppa/unstable -y
    apt-get update
  # add-apt-repository is idempotent, but it and the apt-get update after
  # it cost ~20s every apply and reported `unknown` forever. The source
  # file it writes is the state worth checking.
  unless: ls /etc/apt/sources.list.d | grep -q neovim-ppa
  sudo: true
  timeout: 5m
  retry:
    attempts: 2
    delay: 5s

- name: Install Ubuntu apt apps
  pkg:
    manager: apt
    state: present
    names:
      - gnupg
      - curl
      - make
      - cmake
      - dos2unix
      - git
      - graphviz
      - imagemagick
      - mosh
      - nmap
      - tldr
      - tmux
      - wget
      - yamllint
      - unzip
      - neovim
      # No `yarn`: on Debian the name is a virtual package cmdtest provides,
      # so `apt-get install -y yarn` exits 0 having installed nothing and the
      # step never converges. Real yarn comes from corepack, which ships with
      # nodejs. It is a genuine pacman and brew package, so the other two
      # platform lists keep it.
      #
      # No `nodejs`/`npm` either -- they come from NodeSource below. Ubuntu
      # noble ships 18.19.1, which went EOL in April 2025 and is too old to
      # build components/teleport's web UI (it requires node ^24 || >=26).
      - zsh
      - golang-go
      - build-essential
      - python3-pip
      - httpie
      - hexyl
      - wl-clipboard
      - zstd
  sudo: true
  timeout: 20m
  retry:
    attempts: 3
    delay: 10s

# ─── Node.js (NodeSource) ─────────────────────────────────────────────────
# Ubuntu noble's nodejs is 18.19.1 -- EOL since April 2025, and below the
# `node ^24.0.0 || >=26.0.0` that components/teleport's web UI requires, so a
# teleportd build fails outright with EBADENGINE on these boxes.
#
# The macs already run node 24 via brew, so this brings the Linux side to the
# same major rather than introducing a new split.
#
# Same three-step shape as the Tailscale repo in index.yml: keyring, DEB822
# source, then an update gated on the source actually changing. DEB822 on
# purpose -- a second source naming the same repo with a different Signed-By
# is what apt rejects outright, and that bug has already been paid for once
# here.
#
# NodeSource publishes a single `nodistro` suite for every Ubuntu/Debian
# release, so this does not take ubuntu_codename.

- name: Fetch the NodeSource apt keyring
  shell: |
    set -euo pipefail
    curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key \
      | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
  creates: /etc/apt/keyrings/nodesource.gpg
  sudo: true
  tags: [packages, node]

- name: Register the NodeSource apt source
  file:
    path: /etc/apt/sources.list.d/nodesource.sources
    state: file
    content: |
      Types: deb
      URIs: https://deb.nodesource.com/node_{{ node_major }}.x
      Suites: nodistro
      Components: main
      Signed-By: /etc/apt/keyrings/nodesource.gpg
    mode: '0644'
  sudo: true
  register: nodesource_repo
  tags: [packages, node]

- name: Refresh apt after the NodeSource source changed
  cmd: [apt-get, update]
  when: nodesource_repo.changed
  changed_when: true
  sudo: true
  tags: [packages, node]

# The distro `npm` package depends on the distro nodejs and would drag 18
# back in. NodeSource's nodejs bundles npm, so the separate package is both
# unnecessary and actively harmful here.
- name: Remove the distro npm package
  pkg:
    manager: apt
    name: npm
    state: absent
  sudo: true
  timeout: 10m
  tags: [packages, node]

# `pkg: state: present` is the wrong tool here and was tried first: it asks
# "is nodejs installed", the distro's 18.19.1 answers yes, and the step
# reports ok in 100ms having changed nothing. Converging on a VERSION, not on
# presence, needs apt to actually be told to install -- it then picks
# NodeSource's 24.x as the highest candidate.
#
# The `unless` is what keeps it idempotent: once the installed major is at or
# above the pin, this never runs again.
- name: Install Node.js {{ node_major }} from NodeSource
  shell: apt-get install -y nodejs
  unless: |
    set -eu
    command -v node >/dev/null 2>&1 || exit 1
    major=$(node --version | sed 's/^v//; s/\..*//')
    [ "$major" -ge {{ node_major }} ]
  sudo: true
  timeout: 15m
  retry:
    attempts: 3
    delay: 10s
  tags: [packages, node]

- name: Verify node is new enough for the web builds this repo does
  assert:
    command: |
      set -eu
      major=$(node --version | sed 's/^v//; s/\..*//')
      if [ "$major" -lt {{ node_major }} ]; then
        echo "node $(node --version) is older than {{ node_major }} — the \
      NodeSource install did not take" >&2
        exit 1
      fi
  tags: [packages, node, verify]

# Retired with Clojure, the databases and the misc leftovers (dotfiles#34).
# No autoremove: dropping auto-installed deps is an upgrade-class choice.
- name: Remove retired apt packages
  pkg:
    manager: apt
    state: absent
    names: [clojure, rlwrap, sshfs, tor, lua5.1, ruby-full, postgresql-client]
  sudo: true
  timeout: 10m

# usql came from `go install`; components/usql is retired on these boxes.
- name: Remove usql
  file:
    path: ~/go/bin/usql
    state: absent
