---
# Scheduled tasks that keep WSL and its ports reachable.
#
# All run as {{ username }} — the bare account name, no COMPUTERNAME\ prefix
# (verified on main_pc, where these tasks carry UserId `aleh`) — not SYSTEM,
# so the user's registered WSL distros are visible. S4U logon means they
# fire even when the user is not logged in.
#
# Gated on the task existing, not on its definition matching: changing an
# action here does not re-register a task already on the box. Unregister it
# by hand (or add an absent step) to roll out a changed definition.

# Belt-and-suspenders to vmIdleTimeout=-1 in .wslconfig: re-runs
# `systemctl start ssh` every 5 minutes. A fast no-op when sshd is already
# running, and the wsl.exe invocation itself wakes a stopped VM.
- name: Register Task Scheduler entry to keep WSL SSH alive
  shell:
    interpreter: powershell
    script: |
      $action = New-ScheduledTaskAction -Execute 'C:\Windows\System32\wsl.exe' `
        -Argument '-d {{ wsl_distro }} -u root -- systemctl start ssh'
      $trigger = New-ScheduledTaskTrigger -Once -At (Get-Date) `
        -RepetitionInterval (New-TimeSpan -Minutes 5)
      $principal = New-ScheduledTaskPrincipal -UserId "{{ username }}" `
        -LogonType S4U -RunLevel Highest
      $settings = New-ScheduledTaskSettingsSet `
        -ExecutionTimeLimit (New-TimeSpan -Minutes 2) `
        -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -StartWhenAvailable
      Register-ScheduledTask -TaskName "WSL2-SSH-Keepalive" `
        -Description "Wake WSL VM + ensure ssh service is up (5-minute repetition)" `
        -Action $action -Trigger $trigger -Principal $principal -Settings $settings | Out-Null
  unless: if (Get-ScheduledTask -TaskName "WSL2-SSH-Keepalive" -ErrorAction SilentlyContinue) { exit 0 } else { exit 1 }

# Windows re-marks the LAN as Public (Unidentified) on most boots, and the
# firewall rules in network.yml are scoped Domain,Private only. Without this
# every WSL-exposed port (:2222/:8080) is filtered after a reboot until
# someone sets the profile Private by hand. Interface index changes across
# boots, so match by category, not index.
- name: Register Task Scheduler entry to pin LAN profile Private at boot
  shell:
    interpreter: powershell
    script: |
      $inner = '-NoProfile -Command "Get-NetConnectionProfile | ' +
               'Where-Object { $_.NetworkCategory -eq ''Public'' } | ' +
               'Set-NetConnectionProfile -NetworkCategory Private"'
      $action = New-ScheduledTaskAction `
        -Execute 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe' `
        -Argument $inner
      $trigger = New-ScheduledTaskTrigger -AtStartup
      $principal = New-ScheduledTaskPrincipal -UserId "{{ username }}" `
        -LogonType S4U -RunLevel Highest
      $settings = New-ScheduledTaskSettingsSet `
        -ExecutionTimeLimit (New-TimeSpan -Minutes 2) `
        -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -StartWhenAvailable
      Register-ScheduledTask -TaskName "Set-Network-Private" `
        -Description "Reclassify any Public connection profile to Private at boot (fleet rules are Domain,Private)" `
        -Action $action -Trigger $trigger -Principal $principal -Settings $settings | Out-Null
  unless: if (Get-ScheduledTask -TaskName "Set-Network-Private" -ErrorAction SilentlyContinue) { exit 0 } else { exit 1 }

# vmIdleTimeout=-1 in .wslconfig prevents idle-based shutdown but NOT
# session-based shutdown: WSL exits when the last wsl.exe session closes,
# regardless of timeout. On always-on server boxes (windows_prevent_sleep)
# a persistent boot task holds a session open so all services stay reachable.
# ExecutionTimeLimit 0 = no limit; the task is meant to run forever.
- name: Register WSL session keepalive task (always-on)
  shell:
    interpreter: powershell
    script: |
      $action = New-ScheduledTaskAction -Execute 'C:\Windows\System32\wsl.exe' `
        -Argument '-d {{ wsl_distro }} -u root -- sleep infinity'
      $trigger = New-ScheduledTaskTrigger -AtStartup
      $principal = New-ScheduledTaskPrincipal -UserId "{{ username }}" `
        -LogonType S4U -RunLevel Highest
      $settings = New-ScheduledTaskSettingsSet `
        -ExecutionTimeLimit (New-TimeSpan -Seconds 0) `
        -RestartCount 999 -RestartInterval (New-TimeSpan -Minutes 1) `
        -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -StartWhenAvailable
      Register-ScheduledTask -TaskName "WSL-Session-Keepalive" `
        -Description "Persistent wsl session so WSL2 never exits on session-based shutdown (server boxes)" `
        -Action $action -Trigger $trigger -Principal $principal -Settings $settings | Out-Null
  unless: if (Get-ScheduledTask -TaskName "WSL-Session-Keepalive" -ErrorAction SilentlyContinue) { exit 0 } else { exit 1 }
  when: windows_prevent_sleep
  tags: [always-on]

# Inverse: remove the keepalive task on non-server boxes so it can't block
# sleep.
- name: Remove WSL session keepalive task (non-server boxes)
  shell:
    interpreter: powershell
    script: Unregister-ScheduledTask -TaskName "WSL-Session-Keepalive" -Confirm:$false
  unless: if (Get-ScheduledTask -TaskName "WSL-Session-Keepalive" -ErrorAction SilentlyContinue) { exit 1 } else { exit 0 }
  when: not windows_prevent_sleep
