---
- name: Make sure xcode is installed
  shell: |
    set -euo pipefail
    if ! type "make" > /dev/null 2>&1; then
      xcode-select --install
      exit 0
    fi
    exit 2
  register: xcode_result
  failed_when: result.rc not in [0, 2]
  changed_when: result.rc == 0
  timeout: 10m

- name: Make sure rosetta 2 is installed
  shell: |
    set -euo pipefail
    softwareupdate --install-rosetta --agree-to-license
  unless: pkgutil --pkg-info com.apple.pkg.RosettaUpdateAuto >/dev/null 2>&1
  sudo: true
  timeout: 10m

- name: Make sure brew is installed
  shell: |
    set -euo pipefail
    /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  unless: test -x /opt/homebrew/bin/brew || test -x /usr/local/bin/brew
  timeout: 10m
  retry:
    attempts: 3
    delay: 10s

- name: Define brew taps, formulae, and casks
  vars:
    # Plain strings now: the `name:` field existed only to feed
    # mooncake's pkg.repo, whose `name:` was a filesystem label and so
    # could not hold a slash. HashiCorp relicensed to BSL and pulled
    # packer/terraform from homebrew-core; their tap is the only brew
    # source for them.
    taps:
      - wata727/tflint
      - borkdude/brew
      - wagoodman/dive
      - hashicorp/tap
    apps:
      - aria2
      - aws-iam-authenticator
      - awscli
      - caddy
      - cmake
      - fd
      - fzf
      - gnu-sed
      - graphviz
      - git
      - git-delta
      - htop
      - imagemagick
      - jq
      - libpq
      - lsd
      - mosh
      - nmap
      - hashicorp/tap/packer
      - python
      - ripgrep
      - rustup
      - shellcheck
      - shfmt
      - hashicorp/tap/terraform
      - tailscale
      - tig
      - tldr
      - tree
      - wget
      - yamllint
      - zoxide
      - yq
      - clojure
      - leiningen
      - clj-kondo
      - dive
      - kubernetes-cli
      - go
      - node
      - nvm
      - yarn
      - tmux
      - uv
      - neovim
      - zsh
      - httpie
      - ninja
      - hexyl
      - gh
      - code-minimap
      - lua-language-server
      - xclip
      - pngpaste  # clipboard->PNG for img-clip.nvim (paste screenshots into notes)
    cask_apps:
      - adobe-acrobat-reader
      # alacritty: NOT here. Homebrew disabled the cask on 2026-09-01 —
      # it no longer passes the macOS Gatekeeper check — so `brew install
      # --cask alacritty` hard-errors and, before this was removed, took
      # the whole fresh-machine apply down with it at step 19 of ~183.
      # components/alacritty still deploys the config (harmless, and it is
      # what a reinstated cask or a hand-installed build would read).
      - amazon-workspaces
      - anki
      - docker
      # 1Password CLI's cask install prompts for sudo (needed once, to link
      # into the system keychain) — same class of caveat as the alacritty
      # note above; --keep-going/-K covers it same as any other sudo step.
      - 1password
      - 1password-cli
      - font-fira-code
      - google-drive
      - google-cloud-sdk
      - kap
      - pgadmin4
      - postman
      - rectangle  # spectacle was discontinued and pulled from homebrew-cask; rectangle is the drop-in successor
      - telegram
      - transmission
      - tunnelblick
      - visual-studio-code
      - vlc
      - xmind
      - font-jetbrains-mono-nerd-font

# Two for_each passes over the same list collapse into one shell loop
# (migration §3.6). provision has no loop construct — deliberately — and
# a literal `for` reads better than either pass did.
#
# `brew tap | grep -qx` is the drift check mooncake's pkg.repo brew driver
# did internally, and it is what keeps brew's rc=1 on "already tapped"
# from failing the step. Homebrew 6.0 refuses to load formulae from a
# third-party tap unless it is explicitly trusted — `brew tap` no longer
# implies trust — and `brew trust` is idempotent, so it runs every time.
- name: Tap and trust brew taps
  shell: |
    set -euo pipefail
    for t in {{ taps | join(' ') }}; do
      brew tap | grep -qx "$t" || brew tap "$t"
      brew trust "$t"
    done
  changed_when: false
  timeout: 5m

- name: Install brew formulae
  pkg:
    manager: brew
    state: present
    names: "{{ apps }}"
  timeout: 30m
  retry:
    attempts: 2
    delay: 10s

- name: Install brew casks
  pkg:
    manager: brew
    cask: true
    state: present
    names: "{{ cask_apps }}"
  timeout: 30m
  retry:
    attempts: 2
    delay: 10s
