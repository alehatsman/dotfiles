---
- name: Make sure xcode is installed
  shell: |
    set -euo pipefail
    if ! type "make" > /dev/null 2>&1; then
      xcode-select --install
      exit 0
    fi
    exit 2
  as: xcode_result
  failed_when: result.rc not in [0, 2]
  changed_when: result.rc == 0
  timeout: 10m

- name: Make sure rosetta 2 is installed
  shell: |
    set -euo pipefail
    softwareupdate --install-rosetta --agree-to-license
  unless_command: pkgutil --pkg-info com.apple.pkg.RosettaUpdateAuto >/dev/null 2>&1
  as_user: root
  timeout: 10m

- name: Make sure brew is installed
  shell: |
    set -euo pipefail
    /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  unless_command: test -x /opt/homebrew/bin/brew || test -x /usr/local/bin/brew
  timeout: 10m
  retry:
    attempts: 3
    delay: 10s

- name: Define brew taps, formulae, and casks
  vars:
    # taps are objects rather than strings because mooncake's pkg.repo
    # `name:` field doesn't allow slashes (it's a filesystem label).
    # `tap` keeps the canonical `<owner>/<repo>` brew expects.
    taps:
      - { name: wata727-tflint,       tap: wata727/tflint }
      - { name: borkdude-brew,        tap: borkdude/brew }
      - { name: wagoodman-dive,       tap: wagoodman/dive }
      # HashiCorp relicensed to BSL and pulled packer/terraform from
      # homebrew-core; their tap is now the only brew source.
      - { name: hashicorp-tap,        tap: hashicorp/tap }
    apps:
      - aria2
      - aws-iam-authenticator
      - awscli
      - caddy
      - cmake
      - fd
      - fzf
      - gnu-sed
      - graphviz
      - git
      - git-delta
      - htop
      - imagemagick
      - jq
      - lastpass-cli
      - libpq
      - lsd
      - mosh
      - nmap
      - hashicorp/tap/packer
      - python
      - ripgrep
      - rustup
      - shellcheck
      - shfmt
      - hashicorp/tap/terraform
      - terraform-inventory
      - tig
      - tldr
      - tree
      - watchman
      - wget
      - yamllint
      - yq
      - clojure
      - leiningen
      - clj-kondo
      - dive
      - kubernetes-cli
      - go
      - node
      - nvm
      - yarn
      - tmux
      - uv
      - ollama
      - neovim
      - zsh
      - httpie
      - ninja
      - hexyl
      - gh
      - code-minimap
      - lua-language-server
      - xclip
      - pngpaste  # clipboard->PNG for img-clip.nvim (paste screenshots into notes)
    cask_apps:
      - adobe-acrobat-reader
      # alacritty: NOT here. Homebrew disabled the cask on 2026-09-01 —
      # it no longer passes the macOS Gatekeeper check — so `brew install
      # --cask alacritty` hard-errors and, before this was removed, took
      # the whole fresh-machine apply down with it at step 19 of ~183.
      # components/alacritty still deploys the config (harmless, and it is
      # what a reinstated cask or a hand-installed build would read).
      - amazon-workspaces
      - anki
      - docker
      - font-fira-code
      - google-drive
      - google-cloud-sdk
      - kap
      - pgadmin4
      - postman
      - rectangle  # spectacle was discontinued and pulled from homebrew-cask; rectangle is the drop-in successor
      - telegram
      - transmission
      - tunnelblick
      - visual-studio-code
      - vlc
      - xmind
      - font-jetbrains-mono-nerd-font

- name: Register brew taps
  # mooncake's pkg.repo brew driver lists current taps first and only
  # calls `brew tap` on drift — drops the failed_when/changed_when
  # boilerplate the shell version needed for brew's rc=1 on "already
  # tapped" (proposal-08).
  pkg.repo:
    name: "{{ item.name }}"
    state: present
    brew:
      tap: "{{ item.tap }}"
  for_each: "{{ taps }}"
  timeout: 5m

- name: Trust brew taps
  # Homebrew 6.0 refuses to load formulae from third-party taps unless the
  # tap is explicitly trusted; `brew tap` no longer implies trust. `brew
  # trust` is idempotent, so re-running a trusted tap is a clean no-op.
  shell: |
    set -euo pipefail
    brew trust "{{ item.tap }}"
  for_each: "{{ taps }}"
  changed_when: false
  timeout: 5m

- name: Install brew formulae
  pkg:
    manager: brew
    state: present
    names: "{{ apps }}"
  timeout: 30m
  retry:
    attempts: 2
    delay: 10s

- name: Install brew casks
  pkg:
    manager: brew
    cask: true
    state: present
    names: "{{ cask_apps }}"
  timeout: 30m
  retry:
    attempts: 2
    delay: 10s
