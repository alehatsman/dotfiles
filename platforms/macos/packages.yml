---
- name: Make sure xcode is installed
  shell: |
    set -euo pipefail
    if ! type "make" > /dev/null 2>&1; then
      xcode-select --install
      exit 0
    fi
    exit 2
  register: xcode_result
  failed_when: result.rc not in [0, 2]
  changed_when: result.rc == 0
  timeout: 10m

- name: Make sure rosetta 2 is installed
  shell: |
    set -euo pipefail
    softwareupdate --install-rosetta --agree-to-license
  unless: pkgutil --pkg-info com.apple.pkg.RosettaUpdateAuto >/dev/null 2>&1
  sudo: true
  timeout: 10m

- name: Make sure brew is installed
  shell: |
    set -euo pipefail
    /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  unless: test -x /opt/homebrew/bin/brew || test -x /usr/local/bin/brew
  timeout: 10m
  retry:
    attempts: 3
    delay: 10s

# Shared by mac and work_mac. Work-only tools (cloud CLIs, clojure,
# databases) live in machines/work_mac/index.yml, not here (dotfiles#34).
- name: Define brew formulae and casks
  vars:
    apps:
      - aria2
      - cmake
      - gnu-sed
      - graphviz
      - git
      - imagemagick
      - poppler  # pdftotext/pdftoppm: PDF text extraction + page rendering
      - mosh
      - nmap
      # Not "python" here: it's a brew alias, and `pkg`'s verify compares
      # against `brew list --formula`, which reports the resolved formula
      # name, not the alias -- so this entry always reports failed even
      # when installed. components/languages/index.yml installs it with
      # a binary-presence check instead.
      - shellcheck
      - shfmt
      - tailscale
      - tig
      - tldr
      - wget
      - yamllint
      - yq
      - go
      - node
      - nvm
      - yarn
      - tmux
      - uv
      - neovim
      - zsh
      - httpie
      - ninja
      - hexyl
      - code-minimap
      - lua-language-server
      - pngpaste  # clipboard->PNG for img-clip.nvim (paste screenshots into notes)

      # Containers (podman, not docker/docker-desktop — see platforms/arch's
      # equivalent list). No buildah here: homebrew-core ships no macOS
      # formula for it, Linux-only; `podman build` covers image builds.
      - podman
      - podman-compose
      - lazydocker
    cask_apps:
      - adobe-acrobat-reader
      # alacritty: NOT here. Homebrew disabled the cask on 2026-09-01 —
      # it no longer passes the macOS Gatekeeper check — so `brew install
      # --cask alacritty` hard-errors and, before this was removed, took
      # the whole fresh-machine apply down with it at step 19 of ~183.
      # components/alacritty still deploys the config (harmless, and it is
      # what a reinstated cask or a hand-installed build would read).
      - anki
      # 1Password CLI's cask install prompts for sudo (needed once, to link
      # into the system keychain) — same class of caveat as the alacritty
      # note above; --keep-going/-K covers it same as any other sudo step.
      - 1password
      - 1password-cli
      - font-fira-code
      - google-drive
      - rectangle  # spectacle was discontinued and pulled from homebrew-cask; rectangle is the drop-in successor
      - telegram
      - visual-studio-code
      - vlc
      - font-jetbrains-mono-nerd-font

- name: Install brew formulae
  pkg:
    manager: brew
    state: present
    names: "{{ apps }}"
  timeout: 30m
  retry:
    attempts: 2
    delay: 10s

- name: Install brew casks
  pkg:
    manager: brew
    cask: true
    state: present
    names: "{{ cask_apps }}"
  timeout: 30m
  retry:
    attempts: 2
    delay: 10s

# podman has no daemon on macOS -- it runs containers inside a small Linux
# VM it manages itself (qemu-backed), which is what docker-desktop's VM
# did. `machine init` creates that VM once; `machine start` is safe to
# repeat, so the whole thing is one idempotent step.
#
# Sized explicitly (dotfiles#17): podman's default 2 GiB OOM-kills the linker
# on Rust builds inside containers. A VM that exists at the wrong size is
# stopped, resized, and started again -- `machine set` refuses a running VM.
# Resources are read by grepping the inspect JSON, not `--format`, because
# its Go-template braces collide with this file's own templating.
- name: Set up the podman machine VM
  shell: |
    set -euo pipefail
    m=podman-machine-default
    mem="{{ podman_machine_memory_mib }}"
    cpus="{{ podman_machine_cpus }}"
    field() { podman machine inspect "$m" | grep -m1 "\"$1\":" | tr -dc '0-9'; }
    if ! podman machine inspect "$m" >/dev/null 2>&1; then
      podman machine init --memory "$mem" --cpus "$cpus" "$m"
    elif [ "$(field Memory)" != "$mem" ] || [ "$(field CPUs)" != "$cpus" ]; then
      podman machine stop "$m" || true
      podman machine set --memory "$mem" --cpus "$cpus" "$m"
    fi
    podman machine start "$m" 2>/dev/null || podman machine inspect "$m" | grep -q '"State": "running"'
  unless: |
    set -eu
    j=$(podman machine inspect podman-machine-default 2>/dev/null)
    printf '%s' "$j" | grep -q '"State": "running"' &&
    [ "$(printf '%s' "$j" | grep -m1 '"Memory":' | tr -dc '0-9')" = "{{ podman_machine_memory_mib }}" ] &&
    [ "$(printf '%s' "$j" | grep -m1 '"CPUs":' | tr -dc '0-9')" = "{{ podman_machine_cpus }}" ]
  tags: [macos, containers]
  timeout: 5m
