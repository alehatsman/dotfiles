---
- import: ./packages.yml
  tags: [macos, packages]

# CLI formula (not the tailscale-app cask): the cask needs a one-time
# interactive System Settings → Privacy & Security approval for its
# system extension, which breaks unattended `provision apply`. The
# formula's tailscaled runs as a root launchd service instead — same
# `sudo brew services` idiom as the 1Password CLI cask note above.
# `tailscale up` (login/authkey) stays manual — that's a secret, not
# something to script into version control.
- name: Start tailscaled via Homebrew services (mac)
  shell: sudo brew services start tailscale
  unless: brew services list | grep -q '^tailscale.*started'
  tags: [macos, tailscale]

# The twenty-one scalar preferences below used to be one ungated `defaults
# write` block. It reported `unknown` on every apply and could not say which
# key it had changed; gating it honestly took a thirty-line `unless` that read
# all of them back. Both problems are the `defaults` action's job now
# (provision spec §6.10): each key is its own step, reads its own current
# value, and says what it changed.
#
# No `sudo` anywhere here, and the action refuses it: every domain touched is
# a per-user preference, and a root write lands in /var/root/Library rather
# than in the login session's own (dotfiles#62).
#
# `when: os == "darwin"` on every one of them. The action does not skip
# itself off macOS -- it fails -- so `validate --strict` asks each step where
# it runs, and a plan that says so is worth the repetition.

# Window animations: the 'new window' scale effect, and the resize time it uses
- name: "NSGlobalDomain NSAutomaticWindowAnimationsEnabled"
  defaults:
    domain: NSGlobalDomain
    key: "NSAutomaticWindowAnimationsEnabled"
    type: bool
    value: false
  when: os == "darwin"
  tags: [macos, defaults]

- name: "NSGlobalDomain NSWindowResizeTime"
  defaults:
    domain: NSGlobalDomain
    key: "NSWindowResizeTime"
    type: float
    value: 0.001
  when: os == "darwin"
  tags: [macos, defaults]

# Icons for hard drives, servers and removable media on the desktop
- name: "com.apple.finder ShowExternalHardDrivesOnDesktop"
  defaults:
    domain: com.apple.finder
    key: "ShowExternalHardDrivesOnDesktop"
    type: bool
    value: true
  when: os == "darwin"
  tags: [macos, defaults]

- name: "com.apple.finder ShowHardDrivesOnDesktop"
  defaults:
    domain: com.apple.finder
    key: "ShowHardDrivesOnDesktop"
    type: bool
    value: true
  when: os == "darwin"
  tags: [macos, defaults]

- name: "com.apple.finder ShowMountedServersOnDesktop"
  defaults:
    domain: com.apple.finder
    key: "ShowMountedServersOnDesktop"
    type: bool
    value: true
  when: os == "darwin"
  tags: [macos, defaults]

- name: "com.apple.finder ShowRemovableMediaOnDesktop"
  defaults:
    domain: com.apple.finder
    key: "ShowRemovableMediaOnDesktop"
    type: bool
    value: true
  when: os == "darwin"
  tags: [macos, defaults]

# Hidden files, always
- name: "com.apple.finder AppleShowAllFiles"
  defaults:
    domain: com.apple.finder
    key: "AppleShowAllFiles"
    type: bool
    value: true
  when: os == "darwin"
  tags: [macos, defaults]

# Save to disk, not to iCloud
- name: "NSGlobalDomain NSDocumentSaveNewDocumentsToCloud"
  defaults:
    domain: NSGlobalDomain
    key: "NSDocumentSaveNewDocumentsToCloud"
    type: bool
    value: false
  when: os == "darwin"
  tags: [macos, defaults]

# Quit the printer app once its jobs finish
- name: "com.apple.print.PrintingPrefs Quit When Finished"
  defaults:
    domain: com.apple.print.PrintingPrefs
    key: "Quit When Finished"
    type: bool
    value: true
  when: os == "darwin"
  tags: [macos, defaults]

# Drop the "are you sure you want to open this application?" dialog
- name: "com.apple.LaunchServices LSQuarantine"
  defaults:
    domain: com.apple.LaunchServices
    key: "LSQuarantine"
    type: bool
    value: false
  when: os == "darwin"
  tags: [macos, defaults]

# Password immediately after sleep or screen saver
- name: "com.apple.screensaver askForPassword"
  defaults:
    domain: com.apple.screensaver
    key: "askForPassword"
    type: int
    value: 1
  when: os == "darwin"
  tags: [macos, defaults]

- name: "com.apple.screensaver askForPasswordDelay"
  defaults:
    domain: com.apple.screensaver
    key: "askForPasswordDelay"
    type: int
    value: 0
  when: os == "darwin"
  tags: [macos, defaults]

# Screenshots: to the desktop, as PNG
- name: "com.apple.screencapture location"
  defaults:
    domain: com.apple.screencapture
    key: "location"
    type: string
    value: "{{ home }}/Desktop"
  when: os == "darwin"
  tags: [macos, defaults]

- name: "com.apple.screencapture type"
  defaults:
    domain: com.apple.screencapture
    key: "type"
    type: string
    value: "png"
  when: os == "darwin"
  tags: [macos, defaults]

# Secondary click: bottom-right corner and two fingers, on the bluetooth
  # trackpad, the per-host global keys and the built-in one
- name: "com.apple.driver.AppleBluetoothMultitouch.trackpad TrackpadCornerSecondaryClick"
  defaults:
    domain: com.apple.driver.AppleBluetoothMultitouch.trackpad
    key: "TrackpadCornerSecondaryClick"
    type: int
    value: 2
  when: os == "darwin"
  tags: [macos, defaults]

- name: "com.apple.driver.AppleBluetoothMultitouch.trackpad TrackpadRightClick"
  defaults:
    domain: com.apple.driver.AppleBluetoothMultitouch.trackpad
    key: "TrackpadRightClick"
    type: bool
    value: true
  when: os == "darwin"
  tags: [macos, defaults]

- name: "NSGlobalDomain com.apple.trackpad.trackpadCornerClickBehavior"
  defaults:
    domain: NSGlobalDomain
    key: "com.apple.trackpad.trackpadCornerClickBehavior"
    type: int
    value: 1
    current_host: true
  when: os == "darwin"
  tags: [macos, defaults]

- name: "NSGlobalDomain com.apple.trackpad.enableSecondaryClick"
  defaults:
    domain: NSGlobalDomain
    key: "com.apple.trackpad.enableSecondaryClick"
    type: bool
    value: true
    current_host: true
  when: os == "darwin"
  tags: [macos, defaults]

- name: "com.apple.AppleMultitouchTrackpad TrackpadCornerSecondaryClick"
  defaults:
    domain: com.apple.AppleMultitouchTrackpad
    key: "TrackpadCornerSecondaryClick"
    type: int
    value: 2
  when: os == "darwin"
  tags: [macos, defaults]

- name: "com.apple.AppleMultitouchTrackpad TrackpadRightClick"
  defaults:
    domain: com.apple.AppleMultitouchTrackpad
    key: "TrackpadRightClick"
    type: bool
    value: true
  when: os == "darwin"
  tags: [macos, defaults]

# Font smoothing off (`-g` is NSGlobalDomain said shorter)
- name: "NSGlobalDomain AppleFontSmoothing"
  defaults:
    domain: NSGlobalDomain
    key: "AppleFontSmoothing"
    type: int
    value: 0
  when: os == "darwin"
  tags: [macos, defaults]

# The menu bar array stays in shell: `defaults` takes four scalar types and
# `array` is deferred with its own reopen condition (provision plan.md). Its
# gate compares the plist `defaults read` prints with quoting and whitespace
# stripped -- content, not formatting -- which is also why "Menu Extras" is
# one word on the right-hand side.
- name: Menu bar extras
  shell: |
    set -euo pipefail
    defaults write com.apple.systemuiserver menuExtras -array \
      "/System/Library/CoreServices/Menu Extras/AirPort.menu" \
      "/System/Library/CoreServices/Menu Extras/Bluetooth.menu" \
      "/System/Library/CoreServices/Menu Extras/Clock.menu" \
      "/System/Library/CoreServices/Menu Extras/Displays.menu" \
      "/System/Library/CoreServices/Menu Extras/Volume.menu"
  unless: |
    set -eu
    menu=$(defaults read com.apple.systemuiserver menuExtras 2>/dev/null | tr -d ' \n"')
    [ "$menu" = "(/System/Library/CoreServices/MenuExtras/AirPort.menu,/System/Library/CoreServices/MenuExtras/Bluetooth.menu,/System/Library/CoreServices/MenuExtras/Clock.menu,/System/Library/CoreServices/MenuExtras/Displays.menu,/System/Library/CoreServices/MenuExtras/Volume.menu)" ]
  when: os == "darwin"
  tags: [macos, defaults]
