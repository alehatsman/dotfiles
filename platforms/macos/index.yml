---
- import: ./packages.yml
  tags: [macos, packages]

# CLI formula (not the tailscale-app cask): the cask needs a one-time
# interactive System Settings → Privacy & Security approval for its
# system extension, which breaks unattended `provision apply`. The
# formula's tailscaled runs as a root launchd service instead — same
# `sudo brew services` idiom as the 1Password CLI cask note above.
# `tailscale up` (login/authkey) stays manual — that's a secret, not
# something to script into version control.
- name: Start tailscaled via Homebrew services (mac)
  shell: sudo brew services start tailscale
  unless: brew services list | grep -q '^tailscale.*started'
  tags: [macos, tailscale]

- name: Make sure macos configuration is set
  # No as_user: root — every domain touched below (NSGlobalDomain,
  # com.apple.finder, com.apple.screensaver, com.apple.screencapture, the
  # trackpad domains, systemuiserver) is a per-user preference. Running
  # this as root writes to /var/root/Library/Preferences instead of the
  # real login session's ~/Library/Preferences, so none of it would take
  # effect for the actual user (dotfiles#62).
  shell: |
    set -euo pipefail
    # Disable window animations ('new window' scale effect)
    defaults write NSGlobalDomain NSAutomaticWindowAnimationsEnabled -bool false
    defaults write NSGlobalDomain NSWindowResizeTime -float 0.001

    # Show icons for hard drives, servers, and removable media on the desktop
    defaults write com.apple.finder ShowExternalHardDrivesOnDesktop -bool true
    defaults write com.apple.finder ShowHardDrivesOnDesktop -bool true
    defaults write com.apple.finder ShowMountedServersOnDesktop -bool true
    defaults write com.apple.finder ShowRemovableMediaOnDesktop -bool true

    # Show hidden files by default
    defaults write com.apple.finder AppleShowAllFiles -bool true

    # Save to disk (not to iCloud) by default
    defaults write NSGlobalDomain NSDocumentSaveNewDocumentsToCloud -bool false

    # Automatically quit printer app once the print jobs complete
    defaults write com.apple.print.PrintingPrefs "Quit When Finished" -bool true

    # Disable the “Are you sure you want to open this application?” dialog
    defaults write com.apple.LaunchServices LSQuarantine -bool false

    # Require password immediately after sleep or screen saver begins
    defaults write com.apple.screensaver askForPassword -int 1
    defaults write com.apple.screensaver askForPasswordDelay -int 0

    # Save screenshots to the desktop
    defaults write com.apple.screencapture location -string "$HOME/Desktop"

    # Save screenshots in PNG format
    defaults write com.apple.screencapture type -string "png"

    # Trackpack secordary click right and two finger
    defaults write com.apple.driver.AppleBluetoothMultitouch.trackpad TrackpadCornerSecondaryClick -int 2
    defaults write com.apple.driver.AppleBluetoothMultitouch.trackpad TrackpadRightClick -bool true

    defaults -currentHost write NSGlobalDomain com.apple.trackpad.trackpadCornerClickBehavior -int 1
    defaults -currentHost write NSGlobalDomain com.apple.trackpad.enableSecondaryClick -bool true

    defaults write com.apple.AppleMultitouchTrackpad TrackpadCornerSecondaryClick -int 2
    defaults write com.apple.AppleMultitouchTrackpad TrackpadRightClick -bool true
    defaults write com.apple.systemuiserver menuExtras -array \
      "/System/Library/CoreServices/Menu Extras/AirPort.menu" \
      "/System/Library/CoreServices/Menu Extras/Bluetooth.menu" \
      "/System/Library/CoreServices/Menu Extras/Clock.menu" \
      "/System/Library/CoreServices/Menu Extras/Displays.menu" \
      "/System/Library/CoreServices/Menu Extras/Volume.menu"

    defaults write -g AppleFontSmoothing -int 0
  # Every `defaults write` above has a matching read here. This is long
  # because the step is long: the honest question for a step that writes
  # 23 preferences is "are all 23 already at the wanted value", and there
  # is no shorter way to ask it.
  #
  # It fails open on purpose. A key never written, a value someone
  # changed by hand, a domain that does not exist yet, `defaults` itself
  # missing -- each leaves `eq` false and lets the step run, which costs
  # a second because `defaults write` of a value already in place is a
  # no-op. Failing closed would silently stop applying the settings.
  #
  # `set -eu`, not `-euo pipefail`: the first mismatching `eq` should end
  # the gate with a non-zero status, which is exactly what errexit does.
  unless: |
    set -eu
    eq() {  # eq <want> <args to `defaults`...>
      want=$1
      shift
      [ "$(defaults "$@" 2>/dev/null)" = "$want" ]
    }

    # Booleans read back as 0/1, never as true/false.
    eq 0 read NSGlobalDomain NSAutomaticWindowAnimationsEnabled
    eq 0.001 read NSGlobalDomain NSWindowResizeTime

    eq 1 read com.apple.finder ShowExternalHardDrivesOnDesktop
    eq 1 read com.apple.finder ShowHardDrivesOnDesktop
    eq 1 read com.apple.finder ShowMountedServersOnDesktop
    eq 1 read com.apple.finder ShowRemovableMediaOnDesktop
    eq 1 read com.apple.finder AppleShowAllFiles

    eq 0 read NSGlobalDomain NSDocumentSaveNewDocumentsToCloud
    eq 1 read com.apple.print.PrintingPrefs "Quit When Finished"
    eq 0 read com.apple.LaunchServices LSQuarantine

    eq 1 read com.apple.screensaver askForPassword
    eq 0 read com.apple.screensaver askForPasswordDelay

    eq "$HOME/Desktop" read com.apple.screencapture location
    eq png read com.apple.screencapture type

    eq 2 read com.apple.driver.AppleBluetoothMultitouch.trackpad TrackpadCornerSecondaryClick
    eq 1 read com.apple.driver.AppleBluetoothMultitouch.trackpad TrackpadRightClick

    # `-currentHost` is part of the address: written per-host, read per-host.
    eq 1 -currentHost read NSGlobalDomain com.apple.trackpad.trackpadCornerClickBehavior
    eq 1 -currentHost read NSGlobalDomain com.apple.trackpad.enableSecondaryClick

    eq 2 read com.apple.AppleMultitouchTrackpad TrackpadCornerSecondaryClick
    eq 1 read com.apple.AppleMultitouchTrackpad TrackpadRightClick

    eq 0 read -g AppleFontSmoothing

    # The menu bar array is the one value `defaults read` prints as a
    # plist block instead of a scalar, so it is compared with quoting and
    # whitespace stripped -- content, not formatting. Stripping spaces is
    # also why "Menu Extras" is one word on the right-hand side.
    menu=$(defaults read com.apple.systemuiserver menuExtras 2>/dev/null | tr -d ' \n"')
    [ "$menu" = "(/System/Library/CoreServices/MenuExtras/AirPort.menu,/System/Library/CoreServices/MenuExtras/Bluetooth.menu,/System/Library/CoreServices/MenuExtras/Clock.menu,/System/Library/CoreServices/MenuExtras/Displays.menu,/System/Library/CoreServices/MenuExtras/Volume.menu)" ]
