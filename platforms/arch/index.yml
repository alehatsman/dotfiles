---
# Was `upgrade: true` — a full `pacman -Syu` on every apply. Dropped for
# the same reason as the apt side (migration §2, decided 2026-09-08): a
# distro upgrade is a choice, not declared state. `just upgrade` when you
# mean it.
#
# The standalone `Refresh the pacman package database` step that replaced it
# is gone too. `pkg` ensures packages, and a step naming none of them is not
# a state to declare — provision rejects it (spec §6.5). It was also refreshing
# at the wrong moment: it ran *before* multilib was enabled below, so the
# database it built did not yet know about the repository the later steps
# install from. The install step already carries `update_cache: true`, which
# refreshes after the multilib change, which is the refresh that matters.
- name: Enable multilib repository (uncomment block in pacman.conf)
  # Stock pacman.conf ships these two lines commented:
  #   #[multilib]
  #   #Include = /etc/pacman.d/mirrorlist
  # sed uncomments the header, then the Include line immediately after
  # it. `unless` makes the second run a no-op — the same guarantee
  # text.replace got from allow_no_match, stated explicitly.
  shell: sed -i 's/^#\[multilib\]/[multilib]/; /^\[multilib\]/{n;s/^#Include/Include/}' /etc/pacman.conf
  unless: grep -qx '\[multilib\]' /etc/pacman.conf
  sudo: true
  tags: [arch, system, packages]

- name: Install base-devel and git (refreshes pacman db too)
  # update_cache: true subsumes both the explicit `pacman -Sy --noconfirm`
  # that previously chased the multilib enable above, and the standalone
  # refresh step that used to open this file. This is the first refresh
  # after multilib is enabled, so it is the one the later installs need.
  pkg:
    manager: pacman
    state: present
    update_cache: true
    names:
      - base-devel
      - git
  sudo: true
  timeout: 5m
  tags: [arch, system, packages]

- name: Build yay AUR helper
  # Build under ~/.cache (stable across tmpfiles cleanup) so the install
  # step below finds the package at a deterministic path — no /tmp
  # sentinel file passing state between steps. unless_command makes
  # both steps idempotent at the mooncake level.
  shell: |
    set -euo pipefail
    builddir="$HOME/.cache/yay-build"
    rm -rf "$builddir"
    mkdir -p "$builddir"
    git clone https://aur.archlinux.org/yay.git "$builddir/yay"
    cd "$builddir/yay" && makepkg -s --noconfirm
  unless: pacman -Qi yay
  timeout: 10m
  tags: [arch, system, packages]

- name: Install yay AUR helper
  # $HOME would resolve to /root under as_user: root, so reference the
  # user's path explicitly via {{ username }}.
  shell: |
    set -euo pipefail
    builddir="/home/{{ username }}/.cache/yay-build"
    pacman -U --noconfirm "$builddir"/yay/yay-*.pkg.tar.zst
    rm -rf "$builddir"
  unless: pacman -Qi yay
  sudo: true
  timeout: 5m
  tags: [arch, system, packages]

- import: ./packages.yml
  tags: [arch, system, packages]

- name: Enable NetworkManager
  service:
    name: NetworkManager
    state: started
    enabled: true
  sudo: true
  tags: [arch, system, packages]

- name: Enable TLP for battery management
  service:
    name: tlp
    state: started
    enabled: true
  sudo: true
  tags: [arch, system, packages]

- name: Enable bluetooth
  service:
    name: bluetooth
    state: started
    enabled: true
  sudo: true
  tags: [arch, system, packages]

- name: Enable SSH daemon
  service:
    name: sshd
    state: started
    enabled: true
  sudo: true
  tags: [arch, system, packages]

# `tailscale up` (login/authkey) stays manual — that's a secret, not
# something to script into version control.
- name: Enable tailscaled
  service:
    name: tailscaled
    state: started
    enabled: true
  sudo: true
  tags: [arch, tailscale]

- name: Enable firmware update timer
  service:
    name: fwupd-refresh.timer
    state: started
    enabled: true
  sudo: true
  tags: [arch, system, packages]

- name: Set default shell to zsh
  shell: chsh -s /usr/bin/zsh "{{ username }}"
  unless: 'test "$(getent passwd {{ username }} | cut -d: -f7)" = /usr/bin/zsh'
  sudo: true
  tags: [arch, system, packages]

- name: Make Intel RAPL energy_uj readable by non-root (waybar power module)
  shell: |
    set -euo pipefail
    cat > /etc/udev/rules.d/99-rapl-readable.rules <<'EOF'
    ACTION=="add", SUBSYSTEM=="powercap", KERNEL=="intel-rapl:*", RUN+="/usr/bin/chmod 0444 /sys%p/energy_uj"
    EOF
    # Apply now for already-loaded RAPL domains (udev only fires on add).
    for f in /sys/class/powercap/intel-rapl:*/energy_uj; do
      [ -e "$f" ] && chmod 0444 "$f" || true
    done
  # The step has two effects, so the gate asks about both: the rule is on
  # disk, and every RAPL domain currently present is already 0444. A
  # `creates:` on the rule file alone would skip the chmod forever after
  # the first run, which is wrong the moment a domain appears -- or a
  # permission is reset -- without a reboot to fire the udev rule.
  unless: |
    set -eu
    grep -qF 'KERNEL=="intel-rapl:*"' /etc/udev/rules.d/99-rapl-readable.rules 2>/dev/null || exit 1
    # No domains present is not "not done": the rule is deployed and
    # there is nothing left to chmod, so the loop falls through to 0.
    for f in /sys/class/powercap/intel-rapl:*/energy_uj; do
      [ -e "$f" ] || continue
      [ "$(stat -c %a "$f")" = "444" ] || exit 1
    done
  sudo: true
  tags: [arch, system, packages, rapl]

# CapsLock → Ctrl remap, decomposed from a single shell block into
# declarative pieces. The runtime-apply commands (localectl, loadkeys,
# /sys/class/leds poke) stay shell because they're one-shot effects
# with no idempotency surface to check against.

- name: Create kbd keymaps directory
  file:
    path: /usr/local/share/kbd/keymaps
    state: dir
  sudo: true
  tags: [arch, system, packages]

- name: Deploy us-caps-ctrl keymap (CapsLock acts as Control)
  file:
    path: /usr/local/share/kbd/keymaps/us-caps-ctrl.map
    state: file
    content: |
      include "/usr/share/kbd/keymaps/i386/qwerty/us.map.gz"
      keycode 58 = Control
    mode: '0644'
  sudo: true
  tags: [arch, system, packages]

- name: Set KEYMAP in /etc/vconsole.conf
  # Replaces an existing KEYMAP= line or appends one if absent — the
  # same two branches text.line had. `unless` short-circuits both once
  # the desired line is in place.
  shell: |
    set -euo pipefail
    line='KEYMAP=/usr/local/share/kbd/keymaps/us-caps-ctrl.map'
    touch /etc/vconsole.conf
    if grep -q '^KEYMAP=' /etc/vconsole.conf; then
      sed -i "s|^KEYMAP=.*|$line|" /etc/vconsole.conf
    else
      echo "$line" >> /etc/vconsole.conf
    fi
  unless: grep -qxF 'KEYMAP=/usr/local/share/kbd/keymaps/us-caps-ctrl.map' /etc/vconsole.conf
  sudo: true
  tags: [arch, system, packages]

- name: Deploy udev rule keeping CapsLock LED off
  file:
    path: /etc/udev/rules.d/99-capslock-led.rules
    state: file
    content: |
      ACTION=="add", SUBSYSTEM=="leds", KERNEL=="input*::capslock", ATTR{brightness}="0"
    mode: '0644'
  sudo: true
  tags: [arch, system, packages]

- name: Apply CapsLock remap to running session (best-effort)
  # Not three one-shot commands, as this comment used to say. The first
  # of them is a write: `localectl set-x11-keymap` puts the layout in
  # /etc/X11/xorg.conf.d/00-keyboard.conf, where it survives a reboot and
  # where `localectl status` reads it back. That is the step's one
  # durable effect, so it is what the gate asks about.
  shell: |
    set -euo pipefail
    localectl set-x11-keymap us "" "" ctrl:nocaps
    loadkeys /usr/local/share/kbd/keymaps/us-caps-ctrl.map
    echo 0 > /sys/class/leds/input3::capslock/brightness 2>/dev/null || true
  # `loadkeys` and the LED write are the genuinely runtime-only pair, and
  # neither needs re-running once the files above are in place:
  # systemd-vconsole-setup loads KEYMAP= from /etc/vconsole.conf at boot,
  # and the udev rule deployed above turns the LED off on `add`. They
  # matter in the session that first writes those files -- the session in
  # which this gate is false anyway, because localectl has not run yet.
  unless: |
    set -eu
    st=$(localectl status 2>/dev/null || true)
    printf '%s\n' "$st" | grep -qE 'X11 Layout:[[:space:]]*us[[:space:]]*$' &&
    printf '%s\n' "$st" | grep -qE 'X11 Options:.*ctrl:nocaps'
  sudo: true
  tags: [arch, system, packages]
