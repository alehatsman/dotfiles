---
- name: Install pacman packages
  pkg:
    manager: pacman
    state: present
    names:
      # System / hardware (ThinkPad X1 Carbon Gen 13 Aura Edition)
      - base-devel
      - intel-ucode
      - tlp
      - tlp-rdw
      - powertop
      - bluez
      - bluez-utils
      - pipewire
      - pipewire-pulse
      - pipewire-alsa
      - wireplumber
      - sof-firmware
      - alsa-firmware
      - alsa-ucm-conf
      - alsa-utils
      - xdg-utils

      # Network
      - networkmanager
      - openssh
      - mosh
      - nmap
      - impala
      - tailscale

      # Firmware & hardware management
      - fwupd
      - fprintd

      # Core tools
      - gnupg
      - curl
      - wget
      - git
      - make
      - cmake
      - unzip
      - dos2unix
      - ca-certificates
      - man-db
      - man-pages

      # Shell
      - zsh
      - zsh-syntax-highlighting

      # Terminal tools
      - tmux
      - fzf
      - bat
      - lsd
      - ripgrep
      - fd
      - tree
      - htop
      - btop
      - tig
      - lazygit
      - jq
      - aria2
      - ffmpeg
      - imagemagick
      - graphviz
      - hexyl
      - ninja
      - xclip
      - wl-clipboard
      - shellcheck
      - yamllint
      - reflector
      - rsync
      - socat
      - tcpdump
      - wireshark-cli

      # Data recovery / disk
      - testdisk
      - ddrescue

      # Backup
      - borg
      - restic

      # Editors
      - neovim
      - lua-language-server

      # Development
      - just
      - go
      - nodejs
      - npm
      - yarn
      - uv
      - sqlite

      # Containers
      - podman
      - podman-compose
      - buildah
      - lazydocker

      # Offline / security
      - keepassxc
      - zeal

      # Misc
      - github-cli
      - httpie
      - direnv
      - cliphist
      - network-manager-applet
      - blueman

      # Apps (multilib must be enabled)
      - vlc
      - mpv
      - thunderbird
      - steam
      - swaybg

      # Wayland / Hyprland
      - hyprland
      - waybar
      - wofi
      - dunst
      - hyprpaper
      - hyprlock
      - hypridle
      - xdg-desktop-portal-hyprland
      - xdg-desktop-portal-gtk
      - qt5-wayland
      - qt6-wayland
      - polkit-gnome
      - grim
      - slurp
      - brightnessctl
      - playerctl
      - pavucontrol
      - hyprsunset
      - gnome-keyring
      - alacritty
      - yazi
      - ttf-jetbrains-mono-nerd
      - noto-fonts
      - noto-fonts-emoji
  sudo: true
  timeout: 20m
  retry:
    attempts: 3
    delay: 10s
  tags: [arch, system, packages]

# AUR packages via yay. The old pkg action supported manager: yay
# and emitted `yay -S --noconfirm --needed`
# under the hood. The handler now reads step.Pkg.Manager and returns
# Sudo:false for yay/paru/brew (F049 fix), so the step runs as the
# calling user — yay refuses root by design.
- name: Install AUR packages
  pkg:
    manager: yay
    state: present
    names:
      - git-delta
      - tealdeer
      - nwg-dock-hyprland
      - bruno-bin
      - shfmt
      - yq
      - code-minimap
      - zoxide
      - tree-sitter-cli
      - google-chrome
      - 1password
      - 1password-cli
      - globalprotect-openconnect
      - bluetuith
      - wlogout
  timeout: 15m
  retry:
    attempts: 2
    delay: 10s
  tags: [arch, system, packages]

# Retired with Clojure, the cloud CLIs and the databases (dotfiles#34).
# Removed before components/languages drops the JDK clojure depends on.
- name: Remove retired pacman packages
  pkg:
    manager: pacman
    state: absent
    names: [clojure, rlwrap, lua51, aws-cli, postgresql, redis, pgcli]
  sudo: true
  tags: [arch, system, packages]

- name: Remove retired AUR packages
  pkg:
    manager: yay
    state: absent
    names: [usql-bin]
  tags: [arch, system, packages]
