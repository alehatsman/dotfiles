---
- name: "Install claude if not present"
  # Upstream install script uses bashisms; pipe into bash explicitly
  # because /bin/sh is dash on Ubuntu.
  shell: curl -sSL https://claude.ai/install.sh | bash
  unless: which claude
  tags: [claude]

- name: "Make sure claude config directory exists"
  file:
    path: "~/.claude"
    state: dir
  tags: [claude]

- name: "Deploy claude settings"
  file:
    path: "~/.claude/settings.json"
    src: "./settings.json"
    state: file
  tags: [claude]

- name: "Deploy claude system prompt"
  # Source defaults to ./CLAUDE.md (shared trooper prompt); per-machine
  # vars override claude_system_prompt_src to ship a host-specific prompt.
  # Path resolves relative to this component dir.
  file:
    path: "~/.claude/CLAUDE.md"
    src: "{{ claude_system_prompt_src }}"
    state: file
  tags: [claude, claude-prompt]

- name: "Install isayes"
  # isayes ships its own provision task for build+install (cargo build
  # --release, then copy to ~/.local/bin/isayes) — reuse it rather than
  # duplicating the build steps here.
  #
  # `cargo build --release` first, and that is not redundant with the build
  # step inside tasks/install.yml. That task's own header says it cannot
  # bootstrap from a clean checkout: provision validates a whole plan before
  # running any of it, so the final `file` step's src (target/release/isayes)
  # is checked for existence before the build step that creates it has run.
  # We clone fresh every time, which is exactly the unsupported path — it
  # failed on main_pc with "file src not found: target/release/isayes".
  # Building once up front satisfies the validator; install.yml's own build
  # step then no-ops on the warm target dir.
  shell: |
    set -euo pipefail
    tmpdir=$(mktemp -d)
    trap 'rm -rf "$tmpdir"' EXIT
    git clone https://github.com/alehatsman/isayes "$tmpdir/isayes"
    cd "$tmpdir/isayes"
    cargo build --release
    provision apply tasks/install.yml
  creates: ~/.local/bin/isayes
  tags: [claude]

# These three already carried their own gate, as a `||` short-circuit
# inside the script. That works, but it hides the answer: the step runs
# either way, so provision could only report `unknown`. Lifting the same
# test into `unless` changes nothing about what happens on the machine and
# lets `plan` say which of them has work to do.
# codefort is no longer used from Claude; converge machines that still
# have the server registered.
- name: "Unregister codefort MCP server"
  shell: claude mcp remove --scope user codefort
  unless: "! claude mcp list 2>/dev/null | grep -q '^codefort'"
  tags: [claude]

# User scope, not project scope: `codeintel mcp --path` defaults to `.`, so a
# single registration follows whatever tree the session was started in and
# there is nothing to re-add per repository. In a tree with no index it answers
# `no-index` with a hint and exits 0 — that is codeintel's specified
# degradation, not an error, so the tool being present everywhere costs a list
# entry and nothing else.
#
# The binary comes from components/codeintel. This step does not depend on it:
# `claude mcp add` records a command string and never resolves it, so the order
# of the two imports does not matter. It does depend on `claude`, which is why
# it lives here.
- name: "Register codeintel MCP server"
  shell: claude mcp add --scope user -- codeintel codeintel mcp
  unless: claude mcp list 2>/dev/null | grep -q '^codeintel'
  tags: [claude]

- name: "Add the claude-plugins-official marketplace"
  shell: claude plugin marketplace add anthropics/claude-plugins-official
  unless: claude plugin marketplace list 2>/dev/null | grep -q 'claude-plugins-official'
  tags: [claude]

# Split from the add above because the two are different kinds of thing.
# Adding the marketplace is state: either it is registered or it is not.
# Updating it refreshes a cache from the network, which is not declared
# state and has no converged form to compare against — so it runs every
# time and says plainly that it changed nothing.
- name: "Update the claude-plugins-official marketplace"
  shell: claude plugin marketplace update claude-plugins-official
  changed_when: false
  tags: [claude]

- name: "Install gopls LSP plugin"
  shell: claude plugins install gopls-lsp@claude-plugins-official --scope user
  unless: claude plugins list 2>/dev/null | grep -q 'gopls-lsp@claude-plugins-official'
  tags: [claude]

- name: "Install lua LSP plugin"
  shell: claude plugins install lua-lsp@claude-plugins-official --scope user
  unless: claude plugins list 2>/dev/null | grep -q 'lua-lsp@claude-plugins-official'
  tags: [claude]

- name: "Install typescript LSP plugin"
  shell: claude plugins install typescript-lsp@claude-plugins-official --scope user
  unless: claude plugins list 2>/dev/null | grep -q 'typescript-lsp@claude-plugins-official'
  tags: [claude]

- name: "Make sure ~/.local/bin exists"
  file:
    path: "~/.local/bin"
    state: dir
  tags: [claude]

- name: "Deploy claude-account switcher"
  file:
    path: "~/.local/bin/claude-account"
    src: "./scripts/claude-account.sh"
    state: file
    mode: "0755"
  tags: [claude]
