---
# codefort-client — the `cf` CLI only, for machines that talk to a codefort
# server but don't run one (components/codefort is the server: daemon, web
# UI, systemd unit, and installs cf there itself).
#
# Builds from the local checkout like the server component does — deploys
# reviewed local code, not the remote. Sha-gated on the checkout's HEAD.
# Server + token come from the environment (CODEFORT_SERVER/CODEFORT_TOKEN,
# components/zsh env.zsh), not from here.

- vars_file: ./variables.yml

- name: "Ensure Go toolchain is installed (for building cf)"
  assert:
    command: command -v go
  tags: [codefort-client]

- name: "Ensure codefort source checkout exists"
  assert:
    command: test -d {{ codefort_client_src_dir }}/cmd/cf
  tags: [codefort-client]

- name: "Build and install cf"
  shell: |
    set -euo pipefail
    cd {{ codefort_client_src_dir }}
    go build -trimpath -ldflags "-s -w" -o {{ codefort_client_bin }} ./cmd/cf
    git rev-parse HEAD > {{ codefort_client_bin }}.sha
  unless: |
    test -x {{ codefort_client_bin }} && \
      [ "$(cat {{ codefort_client_bin }}.sha 2>/dev/null)" = "$(git -C {{ codefort_client_src_dir }} rev-parse HEAD 2>/dev/null)" ]
  timeout: 10m
  tags: [codefort-client]
