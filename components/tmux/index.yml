---
# Tmux — install + config.

- name: Install tmux (linux)
  pkg:
    name: tmux
    state: present
  sudo: true
  when: os == 'linux'
  tags: [tmux, install]

- name: Install tmux (macos)
  pkg:
    name: tmux
    state: present
    manager: brew
  when: os == 'darwin'
  timeout: 5m
  retry:
    attempts: 3
    delay: 5s
  tags: [tmux, install]

# Pinned, not tracking master. The `creates`-gated clone it replaces
# cloned once and never updated, so every machine sat on whatever master
# was the day it was built; `git` has no clone-only-if-missing mode, and
# of the two honest options -- follow the branch or name a version -- a
# version is the one a plan can state and check offline. Owner's call,
# 2026-09-08.
#
# `--depth 1` is gone with the shell: provision does full clones, because
# a shallow one cannot compare tags (provision spec §6.8). An existing
# shallow checkout still converges onto the tag.
- name: tmux plugin manager (tpm)
  git:
    repo: https://github.com/tmux-plugins/tpm
    dest: ~/.config/tmux/plugins/tpm
    ref: v3.1.0
  timeout: 5m
  retry:
    attempts: 3
    delay: 5s
  tags: [tmux, plugins]

- name: Verify tmux installation
  assert:
    command: which tmux
  tags: [tmux, verify]

- name: Create tmux config directory
  file:
    path: ~/.config/tmux
    state: dir
  tags: [tmux, config]

- name: Create tmux plugins directory
  file:
    path: ~/.config/tmux/plugins
    state: dir
  tags: [tmux, config]

- name: Deploy .tmux.conf
  template:
    src: ./.tmux.conf.j2
    dest: ~/.tmux.conf
  tags: [tmux, config]

- name: Ensure ~/.local/bin exists
  file:
    path: ~/.local/bin
    state: dir
  tags: [tmux, scripts]

- name: Deploy tmux-claude-jump
  file:
    path: ~/.local/bin/tmux-claude-jump
    src: ./scripts/tmux-claude-jump.sh
    state: file
    mode: '0755'
  tags: [tmux, scripts]

- name: Verify tmux config
  assert:
    command: test -f ~/.tmux.conf
  tags: [tmux, verify]

- name: Verify tpm installation
  assert:
    command: test -d ~/.config/tmux/plugins/tpm
  tags: [tmux, verify]
