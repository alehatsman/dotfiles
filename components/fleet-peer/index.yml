---
# fleet-peer — make this machine reachable BY the rest of the fleet.
#
# components/ssh/index.yml is the mirror image of this file: it provisions the
# machine's *outbound* identity key so this box can reach GitHub, moongit and
# main_pc-wsl. Nothing there — or anywhere else in the repo before dotfiles#2 —
# ever opened the inbound direction, which is why `mac` sat as a leaf: able to
# reach main_pc, unreachable from it, and impossible to target with
# `mooncake fleet bootstrap` or `fleet apply`.
#
# Two halves, both required. sshd without authorized_keys is a closed door with
# no lock fitted; authorized_keys without sshd is a lock with no door. The
# agentd on top is what turns a merely-SSH-able box into a fleet *peer*.
#
# Gated on fleet_peer_enabled (default false in shared/variables.yml).
# Importing this component is not consent — a machine opts in explicitly in its
# own vars.yml, so a laptop that happens to import platforms/macos never starts
# listening by surprise.
#
# Linux hosts already enable sshd through their platform (platforms/arch
# index.yml, platforms/windows index.yml for WSL), so the sshd half here is
# macOS-only for now. The authorized_keys + agentd halves are platform-neutral
# and safe to reuse when an Arch box is added to the fleet.

- name: Ensure ~/.ssh exists with the permissions sshd insists on
  file.write:
    path: ~/.ssh
    state: directory
    mode: '0700'
  when: fleet_peer_enabled == 'true'
  tags: [fleet-peer, ssh]

# 0600 is not decoration: sshd silently ignores an authorized_keys that is
# group- or world-writable and the failure looks exactly like a wrong key.
- name: Deploy authorized_keys from the declared fleet key list
  file.template:
    src: ./templates/authorized_keys.j2
    dest: ~/.ssh/authorized_keys
    mode: '0600'
  when: fleet_peer_enabled == 'true'
  tags: [fleet-peer, ssh]

# ───────────────────────── inbound sshd (macOS) ─────────────────────────────
# macOS has no sshd unit to os.service: Remote Login is a System Settings
# toggle that `systemsetup` drives. It needs root, and on modern macOS the
# calling terminal also needs Full Disk Access — without it systemsetup fails
# with a bare "Remote Login: Off" and no error, so the assert below is what
# actually catches a silent no-op. See docs/macos-peer-setup.md.
- name: Enable Remote Login (inbound sshd)
  shell: |
    set -euo pipefail
    systemsetup -setremotelogin on
  as_user: root
  when: os == 'darwin' and fleet_peer_enabled == 'true'
  # Idempotence gate: skip when Remote Login already reads On. Cheap, and keeps
  # a re-apply from bouncing live SSH sessions.
  unless_command: systemsetup -getremotelogin 2>/dev/null | grep -q 'On$'
  tags: [fleet-peer, ssh]

# -w, not -G. Both set a connect timeout on macOS, but -G is BSD-only and
# GNU/OpenBSD netcat rejects it outright ("invalid option -- 'G'"), which
# makes every port check here fail on a Linux peer regardless of whether the
# port is open. That is worst on the unless_command gate below: a gate that
# can never hold means `agentd bootstrap` re-runs on every apply. -w is
# accepted by both flavours. See dotfiles#2.
- name: Verify sshd is accepting connections
  assert:
    command:
      cmd: nc -z -w 5 127.0.0.1 22
  when: os == 'darwin' and fleet_peer_enabled == 'true'
  tags: [fleet-peer, verify]

# ─────────────────────────── mooncake agentd ────────────────────────────────
# `agentd bootstrap` installs the launchd plist (macOS) or systemd unit
# (Linux) for the *running* binary, enables + starts it, and prints the bearer
# token plus a `fleet pair` one-liner for the controller.
#
# Deliberately the local form, not `fleet bootstrap user@host`: the remote form
# SFTPs the controller's own binary onto the target and errors on version
# mismatch, so bootstrapping from a controller that is behind silently
# downgrades this machine's mooncake. Installing from the binary already on
# this box keeps the version whatever `mooncake task install` last put here.
#
# Idempotent: same version + active service is a no-op. A version drift needs
# --upgrade, which is intentionally NOT passed — a surprise daemon swap during
# an unrelated apply is worse than a loud failure telling you to re-run
# `mooncake task install` first.
- name: Install and start the mooncake agentd
  shell: |
    set -euo pipefail
    mooncake agentd bootstrap --port "{{ fleet_peer_agentd_port }}"
  as_user: root
  when: fleet_peer_enabled == 'true'
  unless_command: nc -z -w 5 127.0.0.1 "{{ fleet_peer_agentd_port }}"
  tags: [fleet-peer, agentd]

- name: Verify the agentd is listening
  assert:
    command:
      cmd: nc -z -w 5 127.0.0.1 "{{ fleet_peer_agentd_port }}"
  when: fleet_peer_enabled == 'true'
  tags: [fleet-peer, verify]
