---
props:
  # dex's DEX_* env now comes from ~/.config/dex/dex.env (rendered by
  # components/dex); .zshenv just sources that file. The only dex knobs zsh
  # still needs are the proxy ones below, which drive the shell-only
  # ANTHROPIC_BASE_URL export (services must NOT route through the proxy).
  dex_proxy_port:
    type: string
    default: "7921"
    description: Loopback port for the dex proxy (Anthropic pass-through).
  dex_proxy_default_on:
    type: string
    default: "false"
    description: When "true", .zshenv auto-exports ANTHROPIC_BASE_URL + ENABLE_TOOL_SEARCH so every shell routes through the proxy.

steps:
  - name: Install zsh
    pkg:
      name: zsh
      state: present
    as_user: root
    when: os == "linux"
    tags: [zsh, install]

  - name: Install zsh (macos)
    pkg:
      name: zsh
      state: present
      manager: brew
    when: os == "darwin"
    timeout: 5m
    retry:
      attempts: 3
      delay: 5s
    tags: [zsh, install]

  - name: Make sure zsh config directory is present
    file.write:
      path: ~/.config/zsh
      state: directory
    tags: [zsh, config]

  - vars.load: ./vars/ubuntu_vars.yml
    when: os == 'linux'

  - vars.load: ./vars/macos_{{arch}}.yml
    when: os == "darwin"

  - name: Deploy .zshenv
    # Sourced by ALL zsh (incl. non-interactive scripts/cron/agent shells) —
    # holds env that must apply regardless of shell type (cargo, dex client
    # vars). See templates/.zshenv.j2 (dotfiles #33).
    file.template:
      src: ./templates/.zshenv.j2
      dest: ~/.zshenv
    tags: [zsh, config]

  - name: Deploy .zshrc
    file.template:
      src: ./templates/.zshrc.j2
      dest: ~/.zshrc
    tags: [zsh, config]

  - name: Deploy .ignore
    file.template:
      src: ./templates/.ignore.j2
      dest: ~/.ignore
    tags: [zsh, config]

  - name: Clone zplug
    git.clone:
      repo: https://github.com/zplug/zplug.git
      dest: ~/.zplug
      depth: 1
    timeout: 5m
    retry:
      attempts: 3
      delay: 5s
    tags: [zsh, plugins]

  - name: Clone oh-my-zsh
    git.clone:
      repo: https://github.com/ohmyzsh/ohmyzsh.git
      dest: ~/.zplug/repos/ohmyzsh/ohmyzsh
      depth: 1
    timeout: 5m
    retry:
      attempts: 3
      delay: 5s
    tags: [zsh, plugins]

  - name: Set zsh as default shell
    os.user:
      name: "{{ username }}"
      shell: "{{ zsh_shell_path }}"
    as_user: root
    tags: [zsh, shell]

  - name: Verify zsh installation
    assert:
      command:
        cmd: which zsh
    tags: [zsh, verify]

  - name: Verify zsh config
    assert:
      command:
        cmd: test -f ~/.zshrc
    tags: [zsh, verify]

  - name: Verify zplug installation
    assert:
      command:
        cmd: test -d ~/.zplug
    tags: [zsh, verify]
