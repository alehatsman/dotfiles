---
props: {}

steps:
  - name: Install zsh
    pkg:
      name: zsh
      state: present
    sudo: true
    when: os == "linux"
    tags: [zsh, install]

  - name: Install zsh (macos)
    pkg:
      name: zsh
      state: present
      manager: brew
    when: os == "darwin"
    timeout: 5m
    retry:
      attempts: 3
      delay: 5s
    tags: [zsh, install]

  - name: Make sure zsh config directory is present
    file:
      path: ~/.config/zsh
      state: dir
    tags: [zsh, config]

  # Per-distro, not per-OS. The three Linux boxes do not share fzf's install
  # layout, so one file cannot serve them: apt puts the shell integration in
  # /usr/share/doc/fzf/examples, pacman puts it flat in /usr/share/fzf. The
  # old single ubuntu_vars.yml loaded on `os == 'linux'` — i.e. on Arch too,
  # despite the name — and shipped Arch's path to the Ubuntu boxes, leaving
  # ^P and ^@ bound to widgets that were never defined (dotfiles#72).
  # apt_available / pacman_available are the same facts the languages and
  # usql components already select on.
  - vars_file: ./vars/ubuntu.yml
    when: apt_available
  - vars_file: ./vars/arch.yml
    when: pacman_available

  - vars_file: ./vars/macos_{{arch}}.yml
    when: os == "darwin"

  - name: Deploy .zshenv
    # Sourced by ALL zsh (incl. non-interactive scripts/cron/agent shells) —
    # holds env that must apply regardless of shell type (cargo). See
    # templates/.zshenv.j2 (dotfiles #33).
    template:
      src: ./templates/.zshenv.j2
      dest: ~/.zshenv
    tags: [zsh, config]

  - name: Deploy .zshrc
    template:
      src: ./templates/.zshrc.j2
      dest: ~/.zshrc
    tags: [zsh, config]

  - name: Deploy .ignore
    template:
      src: ./templates/.ignore.j2
      dest: ~/.ignore
    tags: [zsh, config]

  - name: Clone zplug
    shell: git clone --depth 1 https://github.com/zplug/zplug.git "$HOME/.zplug"
    creates: ~/.zplug
    timeout: 5m
    retry:
      attempts: 3
      delay: 5s
    tags: [zsh, plugins]

  # Guard the path BEFORE setting it. os.user will happily point the
  # account at a binary that doesn't exist, and the failure surfaces
  # nowhere near here: sshd rejects the user at preauth with "not
  # allowed because shell ... does not exist", before authorized_keys
  # is even read, so every key auth dies with a bare "Permission
  # denied (publickey)". Interactive terminals exec zsh directly and
  # never consult the login shell, so nothing else notices. dotfiles#6.
  - name: Verify the configured login shell exists before adopting it
    assert:
      command: test -x "{{ zsh_shell_path }}"
    tags: [zsh, shell, verify]

  # chsh refuses a shell missing from /etc/shells, and a Homebrew zsh
  # is never registered there by the install. os.user does not need
  # this, but keeping the file honest means a later manual chsh, and
  # anything else consulting getusershell(3), agrees with what we set.
  - name: Register the login shell in /etc/shells
    shell: |
      set -euo pipefail
      printf '%s\n' "{{ zsh_shell_path }}" >> /etc/shells
    sudo: true
    unless: grep -qxF "{{ zsh_shell_path }}" /etc/shells
    tags: [zsh, shell]

  # macOS keeps the login shell in Directory Services, not /etc/passwd,
  # so the idempotence guard differs by platform (migration §3.5).
  - name: Set zsh as default shell (linux)
    shell: chsh -s "{{ zsh_shell_path }}" "{{ username }}"
    unless: 'test "$(getent passwd {{ username }} | cut -d: -f7)" = "{{ zsh_shell_path }}"'
    sudo: true
    when: os == 'linux'
    tags: [zsh, shell]

  - name: Set zsh as default shell (macos)
    shell: chsh -s "{{ zsh_shell_path }}" "{{ username }}"
    unless: "test \"$(dscl . -read /Users/{{ username }} UserShell | awk '{print $2}')\" = \"{{ zsh_shell_path }}\""
    sudo: true
    when: os == 'darwin'
    tags: [zsh, shell]

  # `which zsh` would pass here off PATH even when the account's login
  # shell is broken — which is exactly how #6 stayed hidden. Assert on
  # what was actually set instead.
  - name: Verify zsh is the account's login shell
    assert:
      command: test "$(dscl . -read /Users/{{ username }} UserShell | awk '{print $2}')" = "{{ zsh_shell_path }}"
    when: os == 'darwin'
    tags: [zsh, verify]

  - name: Verify zsh installation
    assert:
      command: which zsh
    tags: [zsh, verify]

  - name: Verify zsh config
    assert:
      command: test -f ~/.zshrc
    tags: [zsh, verify]

  - name: Verify zplug installation
    assert:
      command: test -d ~/.zplug
    tags: [zsh, verify]
