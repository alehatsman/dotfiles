---
FZF_BASE: /opt/local/opt/fzf
GCP_PATH: /opt/local/Caskroom/google-cloud-sdk/latest/google-cloud-sdk
# openjdk@21 is keg-only (brew doesn't symlink/register it) — languages
# component installs this formula on every platform (dotfiles#52).
JAVA_HOME: /opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
ZPLUG_HOME: ~/.zplug
zsh_shell_path: /opt/local/bin/zsh
