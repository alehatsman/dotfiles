---
# Package install — inlined when the mooncake in-tree presets/ library
# was retired. The Hyprland ecosystem comes from Arch's pacman repos;
# this step replaces what `use: { name: hyprland }` used to do.
- name: Install Hyprland ecosystem packages
  pkg:
    manager: pacman
    state: present
    names:
      - hyprland
      - waybar
      - wofi
      - dunst
      - hyprpaper
      - hyprlock
      - hypridle
      - xdg-desktop-portal-hyprland
      - xdg-desktop-portal-gtk
      - qt5-wayland
      - qt6-wayland
      - polkit-gnome
      - grim
      - slurp
      - brightnessctl
      - playerctl
      - pavucontrol
      - alacritty
      - yazi
      - ttf-jetbrains-mono-nerd
      - noto-fonts
      - noto-fonts-emoji
  sudo: true
  when: pacman_available
  timeout: 10m
  tags: [hyprland, install]

- name: Create Hyprland config directory
  file:
    path: ~/.config/hypr
    state: dir
  tags: [hyprland, config]

- name: Deploy hyprland.conf
  template:
    src: ./templates/hyprland.conf.j2
    dest: ~/.config/hypr/hyprland.conf
  tags: [hyprland, config]

- name: Deploy hypridle.conf
  template:
    src: ./templates/hypridle.conf.j2
    dest: ~/.config/hypr/hypridle.conf
  tags: [hyprland, config]

- name: Deploy hyprlock.conf
  template:
    src: ./templates/hyprlock.conf.j2
    dest: ~/.config/hypr/hyprlock.conf
  tags: [hyprland, config]

- name: Deploy hyprpaper.conf
  template:
    src: ./templates/hyprpaper.conf.j2
    dest: ~/.config/hypr/hyprpaper.conf
  tags: [hyprland, config]

- name: Create Waybar config directory
  file:
    path: ~/.config/waybar
    state: dir
  tags: [hyprland, waybar, config]

- name: Deploy Waybar config
  template:
    src: ./templates/waybar-config.json.j2
    dest: ~/.config/waybar/config.jsonc
  tags: [hyprland, waybar, config]

- name: Deploy Waybar style
  template:
    src: ./templates/waybar-style.css.j2
    dest: ~/.config/waybar/style.css
  tags: [hyprland, waybar, config]

- name: Create Wofi config directory
  file:
    path: ~/.config/wofi
    state: dir
  tags: [hyprland, wofi, config]

- name: Deploy Wofi style
  template:
    src: ./templates/wofi-style.css.j2
    dest: ~/.config/wofi/style.css
  tags: [hyprland, wofi, config]

- name: Create Dunst config directory
  file:
    path: ~/.config/dunst
    state: dir
  tags: [hyprland, dunst, config]

- name: Deploy dunstrc
  template:
    src: ./templates/dunstrc.j2
    dest: ~/.config/dunst/dunstrc
  tags: [hyprland, dunst, config]

- name: Create Alacritty config directory
  file:
    path: ~/.config/alacritty
    state: dir
  tags: [hyprland, alacritty, config]

- name: Deploy Alacritty config (Linux)
  template:
    src: ./templates/alacritty.toml.j2
    dest: ~/.config/alacritty/alacritty.toml
  tags: [hyprland, alacritty, config]

- name: Create nwg-dock config directory
  file:
    path: ~/.config/nwg-dock-hyprland
    state: dir
  tags: [hyprland, dock, config]

- name: Deploy nwg-dock style
  template:
    src: ./templates/nwg-dock-style.css.j2
    dest: ~/.config/nwg-dock-hyprland/style.css
  tags: [hyprland, dock, config]

- name: Deploy Chrome Wayland flags
  file:
    path: ~/.config/chrome-flags.conf
    state: file
    content: |
      --ozone-platform=wayland
      --enable-features=WaylandWindowDecorations
  tags: [hyprland, config]

- name: Deploy Electron Wayland flags
  file:
    path: ~/.config/electron-flags.conf
    state: file
    content: |
      --ozone-platform=wayland
      --enable-features=WaylandWindowDecorations
  tags: [hyprland, config]

- name: Create screenshots directory
  file:
    path: ~/pictures/screenshots
    state: dir
  tags: [hyprland, config]

- name: Create ~/.local/bin
  file:
    path: ~/.local/bin
    state: dir
  tags: [hyprland, askpass]

- name: Deploy GUI askpass helper for sudo prompts
  template:
    src: ./templates/gui-askpass.sh.j2
    dest: ~/.local/bin/gui-askpass
    mode: '0755'
  tags: [hyprland, askpass]

- name: Deploy waybar-cpu-temp helper (temp + fan tooltip)
  template:
    src: ./templates/waybar-cpu-temp.sh.j2
    dest: ~/.local/bin/waybar-cpu-temp
    mode: '0755'
  tags: [hyprland, waybar, config]

- name: Deploy waybar-cpu-power helper (RAPL package watts)
  template:
    src: ./templates/waybar-cpu-power.sh.j2
    dest: ~/.local/bin/waybar-cpu-power
    mode: '0755'
  tags: [hyprland, waybar, config]

- name: Deploy wm-clip system-wide copy/paste dispatcher
  template:
    src: ./templates/wm-clip.sh.j2
    dest: ~/.local/bin/wm-clip
    mode: '0755'
  tags: [hyprland, config]

- name: Deploy GTK 3 dark theme preference
  file:
    path: ~/.config/gtk-3.0/settings.ini
    state: file
    content: |
      [Settings]
      gtk-application-prefer-dark-theme=1
      gtk-theme-name=Adwaita-dark
  tags: [hyprland, theme]

- name: Deploy GTK 4 dark theme preference
  file:
    path: ~/.config/gtk-4.0/settings.ini
    state: file
    content: |
      [Settings]
      gtk-application-prefer-dark-theme=1
      gtk-theme-name=Adwaita-dark
  tags: [hyprland, theme]

- name: Set freedesktop color-scheme to prefer-dark (Chrome and portal-aware apps read this)
  shell: |
    set -euo pipefail
    gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
    gsettings set org.gnome.desktop.interface gtk-theme 'Adwaita-dark'
  # `gsettings get` prints a GVariant, so a string comes back inside
  # single quotes and the wanted value is quoted here to match. No sudo
  # on the step, so the gate reads the same user's dconf the step writes.
  unless: |
    set -eu
    [ "$(gsettings get org.gnome.desktop.interface color-scheme 2>/dev/null)" = "'prefer-dark'" ] &&
    [ "$(gsettings get org.gnome.desktop.interface gtk-theme 2>/dev/null)" = "'Adwaita-dark'" ]
  tags: [hyprland, theme]
