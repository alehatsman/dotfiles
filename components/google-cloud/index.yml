---
# Google Cloud SDK install.
#
# Linux: keyring + DEB822 source + apt-get update, spelled out — mooncake's
# pkg.repo apt driver did the three in one step (migration §3.11). The key
# was never fingerprint-pinned; that posture is unchanged.
#
# macOS: brew cask.

- name: Fetch the Google Cloud apt keyring
  shell: curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg | gpg --dearmor -o /etc/apt/keyrings/google-cloud.gpg
  creates: /etc/apt/keyrings/google-cloud.gpg
  sudo: true
  when: os == 'linux'

- name: Register the Google Cloud apt source
  file:
    path: /etc/apt/sources.list.d/google-cloud-sdk.sources
    state: file
    content: |
      Types: deb
      URIs: https://packages.cloud.google.com/apt
      Suites: cloud-sdk
      Components: main
      Signed-By: /etc/apt/keyrings/google-cloud.gpg
    mode: '0644'
  sudo: true
  register: google_cloud_repo
  when: os == 'linux'

- name: Refresh apt after the Google Cloud source changed
  cmd: [apt-get, update]
  when: os == 'linux' and google_cloud_repo.changed
  sudo: true

- name: Install google-cloud-cli (apt)
  pkg:
    name: google-cloud-cli
    state: present
  sudo: true
  when: os == 'linux'

- name: Install google-cloud-sdk (brew cask, macOS)
  pkg:
    name: google-cloud-sdk
    manager: brew
    cask: true
    state: present
  when: os == 'darwin'
  timeout: 10m
