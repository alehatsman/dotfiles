---
# codefort — private self-hosted git host. Builds the daemon + web UI from
# the local source tree and runs codefortd as a user systemd service.
#
# Single service, single port: codefortd serves /api/*, git smart-HTTP, and
# the built SPA (CODEFORT_WEB_DIR) on {{ props.codefort_addr }}. Linger
# (shared/bootstrap.yml) keeps the user service alive across logout, so the
# box acts as a standalone server even with no interactive session.
#
# Build/install/restart are sha-gated on the source tree's committed HEAD:
# all three run together when HEAD moves, skip together otherwise. The .sha
# sidecar is written last (in the restart step) so the gate variable only
# flips after the new revision is fully live.
#
# Force a rebuild:
#   rm {{ codefort_bin_path }}.sha && provision apply ./main_pc.yml --tags codefort

props:
  codefort_addr:
    type: string
    default: ":8080"
    description: Listen address for codefortd (host:port or :port).
  codefort_max_concurrency:
    type: string
    default: "6"
    description: Max concurrent CI + agent runs (CODEFORT_MAX_CONCURRENCY).
  codefort_agent_reserved:
    type: string
    default: "2"
    description: Run slots reserved for agents so CI backlog can't lock them out.

steps:
  - vars_file: ./variables.yml

  # ───────────────── TOOLCHAIN GUARDS ────────────────────────────────────────

  - name: "Ensure Go toolchain is installed (for building codefortd)"
    # Provided by components/languages — fail-fast guard so the build step
    # doesn't error out cryptically.
    assert:
      command: command -v go
    tags: [codefort, build]

  - name: "Ensure Node toolchain is installed (for building the web UI)"
    assert:
      command: command -v npm
    tags: [codefort, build]

  - name: "Ensure git is installed"
    pkg:
      name: git
      state: present
    sudo: true
    tags: [codefort, build]

  # ───────────────── MIGRATION (moongit → codefort, one-time) ────────────────
  # codefort's cutover runbook (docs/plan-rename-codefort.md in the codefort
  # repo) never ran against this host. These four steps replay it: stop the
  # old unit, then move the checkout, data dir + DB, and config dir + env
  # files to their renamed paths. Each `unless` skips when the new path
  # already exists (already migrated) or the old path never existed (fresh
  # host, never ran moongit) — so this whole block is a no-op after the
  # first apply. Must run before any step below that creates or seeds a
  # codefort_* path, or that step's `creates:`/`file:` guard would fire
  # first and leave the pre-rename data behind untouched (data dir) or,
  # worse, silently generate a fresh blank secret env file over real HTTP
  # Basic credentials.

  - name: "Retire the pre-rename moongit.service, if present"
    # Stopped before any data move below — moving the DB out from under a
    # running server risks the -wal sidecar. The daemon rename means the old
    # unit is not replaced; left running it would also still hold :8080.
    shell: |
      set -eu
      systemctl --user disable --now moongit.service || true
      rm -f ~/.config/systemd/user/moongit.service
    unless: test ! -f ~/.config/systemd/user/moongit.service
    tags: [codefort, migrate]

  - name: "Migrate the pre-rename checkout (~/projects/moongit → {{ codefort_src_dir }})"
    shell: mv ~/projects/moongit {{ codefort_src_dir | expanduser }}
    unless: test -e {{ codefort_src_dir | expanduser }} || test ! -d ~/projects/moongit
    tags: [codefort, migrate]

  - name: "Migrate the pre-rename data dir + database (~/.local/share/moongit → {{ codefort_data_dir }})"
    # Whole-dir mv carries repos/ with it; the DB and its -wal/-shm sidecars
    # (which may not exist after a clean stop) are renamed in place after.
    shell: |
      set -eu
      mv ~/.local/share/moongit {{ codefort_data_dir | expanduser }}
      d={{ codefort_data_dir | expanduser }}
      [ -f "$d/moongit.db" ]     && mv "$d/moongit.db"     "$d/codefort.db"
      [ -f "$d/moongit.db-wal" ] && mv "$d/moongit.db-wal" "$d/codefort.db-wal"
      [ -f "$d/moongit.db-shm" ] && mv "$d/moongit.db-shm" "$d/codefort.db-shm"
      true
    unless: test -e {{ codefort_data_dir | expanduser }} || test ! -d ~/.local/share/moongit
    tags: [codefort, migrate]

  - name: "Migrate the pre-rename config dir + env files (~/.config/moongit → ~/.config/codefort)"
    # agent.env keeps its name (it always did); only the two moongit.*-named
    # files inside are renamed. codefort.env is re-rendered fresh below
    # regardless, but codefort.secret.env is create-once, so moving the real
    # one here is what preserves the HTTP Basic password across the rename.
    shell: |
      set -eu
      mv ~/.config/moongit ~/.config/codefort
      d=~/.config/codefort
      [ -f "$d/moongit.env" ]        && mv "$d/moongit.env"        "$d/codefort.env"
      [ -f "$d/moongit.secret.env" ] && mv "$d/moongit.secret.env" "$d/codefort.secret.env"
      true
    unless: test -e ~/.config/codefort || test ! -d ~/.config/moongit
    tags: [codefort, migrate]

  # ───────────────── DIRECTORIES ─────────────────────────────────────────────

  - name: "Ensure ~/.local/bin exists"
    file:
      path: ~/.local/bin
      state: dir
    tags: [codefort, build]

  - name: "Ensure data + repos dirs exist"
    # Creating the leaf repos dir materializes the parent data dir too.
    file:
      path: "{{ codefort_repos_dir }}"
      state: dir
    tags: [codefort, build]

  - name: "Ensure config dir for the env file exists"
    file:
      path: ~/.config/codefort
      state: dir
    tags: [codefort, service]

  # ───────────────── BUILD (sha-gated on committed HEAD) ──────────────────────

  - name: "Build codefortd + codefort client"
    # {{ codefort_src_dir }} is unquoted on purpose so bash expands ~ at run
    # time.
    shell: |
      set -euo pipefail
      cd {{ codefort_src_dir }}
      go build -trimpath -ldflags "-s -w" -o ./bin/codefortd ./cmd/codefortd
      go build -trimpath -ldflags "-s -w" -o ./bin/cf        ./cmd/cf
    unless: |
      test -x {{ codefort_bin_path }} && \
        [ "$(cat {{ codefort_bin_path }}.sha 2>/dev/null)" = "$(git -C {{ codefort_src_dir }} rev-parse HEAD 2>/dev/null)" ]
    tags: [codefort, build]

  - name: "Build the web UI (vite build → web/dist)"
    shell: |
      set -euo pipefail
      cd {{ codefort_src_dir }}/web
      npm install
      npm run build
    unless: |
      test -x {{ codefort_bin_path }} && \
        [ "$(cat {{ codefort_bin_path }}.sha 2>/dev/null)" = "$(git -C {{ codefort_src_dir }} rev-parse HEAD 2>/dev/null)" ]
    timeout: 10m
    tags: [codefort, build]

  - name: "Install codefortd + codefort to ~/.local/bin"
    # No sha write here — the restart step stamps it last so the gate only
    # flips once the new revision is actually running.
    shell: |
      set -euo pipefail
      install -m 0755 {{ codefort_src_dir }}/bin/codefortd {{ codefort_bin_path }}
      install -m 0755 {{ codefort_src_dir }}/bin/cf        {{ codefort_client_path }}
    unless: |
      test -x {{ codefort_bin_path }} && \
        [ "$(cat {{ codefort_bin_path }}.sha 2>/dev/null)" = "$(git -C {{ codefort_src_dir }} rev-parse HEAD 2>/dev/null)" ]
    tags: [codefort, build]

  # ───────────────── SERVICE (user-scope systemd unit) ───────────────────────

  - name: "Render codefort environment file"
    # Host-specific absolute paths live here, not in the unit. systemd does
    # not expand ~, so every path is run through expanduser. No secrets —
    # those live in the secret env file seeded below.
    file:
      path: "{{ codefort_env_file }}"
      state: file
      content: |
        CODEFORT_ADDR={{ props.codefort_addr }}
        CODEFORT_DATA_DIR={{ codefort_data_dir | expanduser }}
        CODEFORT_REPOS_DIR={{ codefort_repos_dir | expanduser }}
        CODEFORT_WEB_DIR={{ codefort_web_dir | expanduser }}
        CODEFORT_MAX_CONCURRENCY={{ props.codefort_max_concurrency }}
        CODEFORT_AGENT_RESERVED={{ props.codefort_agent_reserved }}
      mode: '0644'
    tags: [codefort, service]

  - name: "Seed codefort secret env file (HTTP Basic creds) if missing"
    # Created once, NEVER overwritten — `creates:` skips the step when the
    # file already exists, so hand-edited credentials survive every apply.
    # umask 077 makes the file 0600 from birth (it carries the password).
    # Empty values = basic auth disabled. The systemd unit references it
    # with a leading `-`, so a missing/empty file is fine.
    shell: |
      set -eu
      umask 077
      cat > {{ codefort_secret_env_file }} <<'EOF'
      # HTTP Basic auth for the codefort web UI + git smart-HTTP.
      # Fill both in, then: systemctl --user restart codefort.service
      # Leave empty to disable. This file is never committed or clobbered.
      CODEFORT_BASIC_USER=
      CODEFORT_BASIC_PASS=
      EOF
    creates: "{{ codefort_secret_env_file | expanduser }}"
    tags: [codefort, service]

  # os.systemd wrote the unit, reloaded, enabled and started it in one
  # step, and reload_on_change restarted it when the unit body drifted.
  # provision splits that into five (migration §3.8). The unit body now
  # lives in ./units/, so `plan` diffs it — os.systemd never did.
  # os.systemd also created the unit directory; that is explicit now.
  - name: "Ensure the user unit directory exists"
    file:
      path: ~/.config/systemd/user
      state: dir
      mode: '0755'
    tags: [codefort, service]

  - name: "Deploy the codefort user unit"
    template:
      src: ./units/codefort.service.j2
      dest: ~/.config/systemd/user/codefort.service
      mode: '0644'
    register: codefort_unit
    tags: [codefort, service]

  - name: "Reload the user systemd manager"
    cmd: [systemctl, --user, daemon-reload]
    when: codefort_unit.changed
    # See the Tailscale refresh in platforms/windows/index.yml: `when`
    # decides whether it runs, `changed_when` says what it did. A reload
    # that only runs after the unit file changed did reload the manager.
    changed_when: true
    tags: [codefort, service]

  - name: "Enable + start codefort"
    service:
      name: codefort.service
      scope: user
      state: started
      enabled: true
    tags: [codefort, service]

  # This is reload_on_change: restart when the UNIT body changed. Binary
  # changes are handled by the stamp step below, EnvironmentFile content
  # changes by the drift probe.
  - name: "Restart codefort when its unit changed"
    service:
      name: codefort.service
      scope: user
      state: restarted
    when: codefort_unit.changed
    tags: [codefort, service]

  - name: "Restart codefort if the managed env file drifted from the running process"
    # The unit-changed restart above only fires on UNIT changes, not on
    # EnvironmentFile content changes. So when a managed env value is
    # added/changed, the running process keeps the stale env until
    # restarted. Compare the live process env to the rendered file and
    # restart only on drift — idempotent, no restart once in sync.
    # Probes CODEFORT_ADDR as the sentinel (it was CODEFORT_DEX_URL until
    # dotfiles#91 removed dex).
    shell: |
      set -euo pipefail
      pid=$(systemctl --user show -p MainPID --value codefort.service 2>/dev/null || echo 0)
      live=""
      [ "$pid" -gt 0 ] && live=$(tr '\0' '\n' < "/proc/$pid/environ" 2>/dev/null | grep '^CODEFORT_ADDR=' || true)
      want="CODEFORT_ADDR={{ props.codefort_addr }}"
      if [ "$live" != "$want" ]; then
        systemctl --user restart codefort.service
      fi
    changed_when: false
    tags: [codefort, service]

  - name: "Restart codefort + stamp deployed revision"
    # Runs only when HEAD differs from the installed .sha — picks up the
    # freshly-installed binary, then writes the sidecar last so build /
    # install / restart all gate on the same flip.
    shell: |
      set -euo pipefail
      systemctl --user restart codefort.service
      git -C {{ codefort_src_dir }} rev-parse HEAD > {{ codefort_bin_path }}.sha
      chmod 0644 {{ codefort_bin_path }}.sha
    unless: |
      test -x {{ codefort_bin_path }} && \
        [ "$(cat {{ codefort_bin_path }}.sha 2>/dev/null)" = "$(git -C {{ codefort_src_dir }} rev-parse HEAD 2>/dev/null)" ]
    tags: [codefort, service]

  # ───────────────── READINESS ───────────────────────────────────────────────

  # 30 attempts x 2s is the 60s timeout wait.http declared (migration
  # §3.10). `retry` composes with `assert` (spec §6.7), which is how a
  # readiness gate is written.
  - name: "Wait for codefort to become ready"
    assert:
      command: curl -fsS -o /dev/null http://127.0.0.1{{ props.codefort_addr }}/healthz
      msg: "codefort did not become ready"
    retry: { attempts: 30, delay: 2s }
    tags: [codefort, verify]

  - name: "Note: mint an API token to use /api/*"
    # The daemon rejects all /api/* calls until a token exists. Minting is
    # interactive (the secret prints once), so it's not part of declarative
    # apply. git smart-HTTP and the web UI work without one.
    shell: echo "codefort up on {{ props.codefort_addr }}. If /api/* 401s, run:{{ ' ' }}{{ codefort_bin_path }} token create <name>"
    changed_when: false
    tags: [codefort, verify]

  # ───────────────── AGENT IDENTITY (baseline token + shell env) ──────────────

  - name: "Seed agent identity env file (mint baseline token, once)"
    # Writes {{ codefort_agent_env_file }} with CODEFORT_SERVER, CODEFORT_DATA_DIR
    # (so the codefortd CLI invoked by the gwc worktree helper hits the live
    # db, not ./data), and a baseline CODEFORT_TOKEN minted under this host's
    # name. CREATED ONCE and never clobbered — the plaintext is shown only at
    # mint time, so a re-render can't recover it. zsh sources this file.
    # To rotate: revoke the token, delete its row, remove this file, re-apply.
    shell: |
      set -eu
      umask 077
      export CODEFORT_DATA_DIR="{{ codefort_data_dir | expanduser }}"
      tok=$({{ codefort_bin_path }} token create "{{ computer_name }}" 2>/dev/null | grep -oE 'cf_[0-9a-f]+' | head -1)
      [ -n "$tok" ] || { echo "token mint failed (name '{{ computer_name }}' may already exist — revoke + delete the row, then retry)" >&2; exit 1; }
      mkdir -p ~/.config/codefort
      cat > "{{ codefort_agent_env_file | expanduser }}" <<EOF
      export CODEFORT_SERVER=http://127.0.0.1{{ props.codefort_addr }}
      export CODEFORT_DATA_DIR={{ codefort_data_dir | expanduser }}
      export CODEFORT_TOKEN=$tok
      EOF
      chmod 0600 "{{ codefort_agent_env_file | expanduser }}"
    creates: "{{ codefort_agent_env_file | expanduser }}"
    tags: [codefort, token]

  # ───────────────── CI CONTAINER IMAGES: REMOVED (mooncake ripped out) ───────
  # codefort-ci:latest / codefort-ci-dev:latest used to bundle mooncake because
  # codefortd's own runner execs every server-side CI step as
  # `mooncake step '<yaml>'` inside the container — that contract lives in
  # codefort's Go source (a separate repo), not here. mooncake is gone from
  # this repo, so these images are no longer built. codefort's CI runner will
  # fail until codefort's own runner stops requiring mooncake — that's a
  # codefort-repo change, out of scope for dotfiles.
