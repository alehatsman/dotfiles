---
# HashiCorp APT repo + terraform install. mooncake's pkg.repo apt driver
# did keyring fetch, DEB822 source and apt-get update in one step;
# provision spells the three out (migration §3.11).
#
# The key was never fingerprint-pinned here (gpg_check was false), and
# this rewrite does not change that. To upgrade key trust, verify against
# 798AEC654E5C15428C8E42EEAA16FCBCA621E701 in the fetch step.

- name: Fetch the HashiCorp apt keyring
  shell: curl -fsSL https://apt.releases.hashicorp.com/gpg | gpg --dearmor -o /etc/apt/keyrings/hashicorp.gpg
  creates: /etc/apt/keyrings/hashicorp.gpg
  sudo: true
  when: os == 'linux'

- name: Register the HashiCorp apt source
  file:
    path: /etc/apt/sources.list.d/hashicorp.sources
    state: file
    content: |
      Types: deb
      URIs: https://apt.releases.hashicorp.com
      Suites: {{ ubuntu_codename | default('jammy') }}
      Components: main
      Signed-By: /etc/apt/keyrings/hashicorp.gpg
    mode: '0644'
  sudo: true
  register: hashicorp_repo
  when: os == 'linux'

- name: Refresh apt after the HashiCorp source changed
  cmd: [apt-get, update]
  when: os == 'linux' and hashicorp_repo.changed
  sudo: true

- name: Install terraform
  pkg:
    name: terraform
    state: present
  sudo: true
  when: os == 'linux'
