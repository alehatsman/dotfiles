---
# Language toolchains. Each step is gated on the package manager
# available on the current host, so the same import works across
# Ubuntu/macOS/Arch.

- name: Install Python 3 (apt)
  pkg:
    names: [python3, python3-pip, python3-venv]
  sudo: true
  when: apt_available
  tags: [dev, python]

- name: Install Python 3 (brew)
  # `pkg` verifies by checking `brew list --formula` for the exact name
  # given. "python" is only an alias -- brew lists the resolved formula
  # (currently python@3.14), so the alias never matches and `pkg` reports
  # the install failed even when it worked. Gate on the binary instead,
  # same pattern as the rustup step above.
  shell: brew install python
  unless: command -v python3 >/dev/null 2>&1
  when: brew_available
  tags: [dev, python]

- name: Install Python 3 (pacman)
  pkg:
    names: [python, python-pip]
  sudo: true
  when: pacman_available
  tags: [dev, python]

# Rust via rustup. `--no-modify-path` keeps shell init untouched —
# the cargo bin dir is added by zsh config (~/.config/zsh/env.zsh, sourced by
# .zshenv, sources ~/.cargo/env).
#
# Gate on what this step produces — ~/.cargo/env and a working
# ~/.cargo/bin/cargo — not on `rustup` being somewhere on PATH. A rustup
# from another source (Homebrew's formula links only `rustup`, its
# cargo/rustc proxies stay in /opt/homebrew/opt/rustup/bin) satisfied the
# old check, the installer never ran, and cargo was unreachable from every
# shell (dotfiles#13). Re-running the installer over an existing ~/.rustup
# is safe: it reuses the installed toolchain and writes the missing shims.
- name: Install Rust toolchain via rustup
  shell: |
    set -euo pipefail
    curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
      sh -s -- -y --default-toolchain stable --profile default --no-modify-path
  unless: test -f "$HOME/.cargo/env" && "$HOME/.cargo/bin/cargo" --version >/dev/null 2>&1
  tags: [dev, rust]

- name: Install Go toolchain (apt)
  pkg:
    name: golang-go
  sudo: true
  when: apt_available
  tags: [dev, golang]

- name: Install Go toolchain (brew)
  pkg:
    name: go
    manager: brew
  when: brew_available
  tags: [dev, golang]

- name: Install Go toolchain (pacman)
  pkg:
    name: go
  sudo: true
  when: pacman_available
  tags: [dev, golang]

- name: Install Java JDK (apt)
  pkg:
    name: openjdk-21-jdk
  sudo: true
  when: apt_available
  tags: [dev, java]

- name: Install Java JDK (brew)
  pkg:
    name: openjdk@21
    manager: brew
  when: brew_available
  tags: [dev, java]

- name: Install Java JDK (pacman)
  pkg:
    name: jdk21-openjdk
  sudo: true
  when: pacman_available
  tags: [dev, java]
