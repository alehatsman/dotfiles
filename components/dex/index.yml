---
# dex — local semantic-search MCP helper for Claude Code.
#
# Role:
#   dex_role=client  install the Go binary + register MCP + SSH tunnel
#   dex_role=server  additionally bring up the embedding service in WSL
#
# Default is client (see shared/variables.yml); main_pc overrides to server.
# Machines that don't want dex at all simply omit the use: line.
# See components/dex/server.yml for server-side steps.

props:
  dex_role:
    type: string
    default: "client"
    description: "client=MCP+tunnel only; server=additionally runs embedding service"
  dex_src_url:
    type: string
    default: "git@github.com:alehatsman/dex.git"
    description: Git remote to clone/update dex source from.
  dex_local_port:
    type: string
    default: "11434"
    description: Local ollama port for embed + chat.
  dex_embed_model:
    type: string
    default: ""
    description: Embedding model name. Empty = binary compiled default.
  dex_embed_batch:
    type: string
    default: "128"
    description: Embedding batch size.
  dex_chat_model:
    type: string
    default: ""
    description: Chat model name. Empty = binary compiled default.
  dex_ask_model:
    type: string
    default: ""
    description: Ask/routing model override. Empty = falls back to dex_chat_model.
  dex_expand_model:
    type: string
    default: ""
    description: Query-side expansion model (dex #252), e.g. qwen3:4b. Empty = expansion disabled.
  dex_expand_mode:
    type: string
    default: "on"
    description: Default expansion level when a request omits it (off|on|full). Only used when dex_expand_model is set.
  dex_rerank_local_port:
    type: string
    default: "8082"
    description: Local reranker port.
  dex_rerank_remote_port:
    type: string
    default: "8082"
    description: Remote reranker port (for SSH tunnel in server role).
  dex_rerank_publish_addr:
    type: string
    default: "127.0.0.1"
    description: Host address the reranker container publishes on. Override to 0.0.0.0 where Docker Desktop + WSL mirrored networking won't expose 127.0.0.1.
  dex_rerank_connect_host:
    type: string
    default: "127.0.0.1"
    description: Host dex connects to for rerank. Override (e.g. host.docker.internal) where 127.0.0.1 publish is unreachable.
  dex_rerank_style:
    type: string
    default: "cohere"
    description: Reranker API style (cohere or chat).
  dex_rerank_model:
    type: string
    default: "BAAI/bge-reranker-v2-m3"
    description: Reranker model name.
  dex_rerank_pool:
    type: string
    default: "40"
    description: Reranker candidate pool size.
  dex_rerank_gpu:
    type: string
    default: "1"
    description: GPU index for the reranker container (empty = no GPU).
  dex_rerank_concurrency:
    type: string
    default: "8"
    description: Reranker request concurrency.
  dex_remote_host:
    type: string
    default: "main_pc-wsl"
    description: SSH hostname alias for the remote embedding server.
  dex_remote_ip:
    type: string
    default: "192.168.1.68"
    description: LAN IP of the remote embedding server.
  dex_remote_port:
    type: string
    default: "11434"
    description: Remote ollama port to forward via the SSH tunnel.
  dex_remote_ssh_port:
    type: string
    default: "2222"
    description: SSH port on the remote embedding server.
  dex_remote_user:
    type: string
    default: "aleh"
    description: SSH user on the remote embedding server.
  dex_serve_port:
    type: string
    default: "7920"
    description: Local port for dex serve (HTTP query API for moongit Intel tab).
  dex_watch_paths:
    type: string
    default: ""
    description: Space-separated list of paths for dex-watch@ instances. Empty = additive mode.
  dex_ollama_keep_alive:
    type: string
    default: "5m"
    description: Ollama model keep-alive duration (-1 = forever).
  dex_ollama_num_parallel:
    type: string
    default: "4"
    description: Ollama parallel request slots.
  dex_tunnel_enabled:
    type: string
    default: "true"
    description: "true=deploy+load the SSH tunnel plist; false=unload+remove it (use when local services already occupy the forwarded ports)."
  dex_feedback_shadow:
    type: string
    default: ""
    description: "1 = record shadow re-ranking A/B decisions to feedback_shadow.jsonl (#731). Server-only; empty = off."
  dex_feedback_live:
    type: string
    default: ""
    description: "1 = enable live feedback-driven reweighting (#731). Server-only; empty = off."
steps:
  - vars.load: ./variables.yml

  # Inject all props into global scope so server.yml and templates can use {{ dex_* }}.
  - vars:
      dex_role: "{{ props.dex_role }}"
      dex_src_url: "{{ props.dex_src_url }}"
      dex_local_port: "{{ props.dex_local_port }}"
      dex_embed_model: "{{ props.dex_embed_model }}"
      dex_embed_batch: "{{ props.dex_embed_batch }}"
      dex_chat_model: "{{ props.dex_chat_model }}"
      dex_ask_model: "{{ props.dex_ask_model }}"
      dex_expand_model: "{{ props.dex_expand_model }}"
      dex_expand_mode: "{{ props.dex_expand_mode }}"
      dex_rerank_local_port: "{{ props.dex_rerank_local_port }}"
      dex_rerank_remote_port: "{{ props.dex_rerank_remote_port }}"
      dex_rerank_style: "{{ props.dex_rerank_style }}"
      dex_rerank_model: "{{ props.dex_rerank_model }}"
      dex_rerank_pool: "{{ props.dex_rerank_pool }}"
      dex_rerank_gpu: "{{ props.dex_rerank_gpu }}"
      dex_rerank_concurrency: "{{ props.dex_rerank_concurrency }}"
      dex_rerank_publish_addr: "{{ props.dex_rerank_publish_addr }}"
      dex_rerank_connect_host: "{{ props.dex_rerank_connect_host }}"

  # ───────────────── CLIENT (and server — server is a superset) ──────────────

  - name: "Ensure Go toolchain is installed (for building dex)"
    # Expected to be provided by components/languages — this is just a
    # fail-fast guard so the build step doesn't error out cryptically.
    assert:
      command:
        cmd: command -v go
    tags: [dex, build]

  - name: "Ensure ~/.local/bin exists"
    file.write:
      path: ~/.local/bin
      state: directory
    tags: [dex, build]

  - name: "Clone or update dex source"
    # update:true is safe here because dex_src_dir is under
    # ~/.local/share/ — kept distinct from any dev checkout in ~/projects/.
    # If somehow this checkout diverges, mooncake refuses with a clear error
    # instead of silently trampling work.
    git.clone:
      repo: "{{ dex_src_url }}"
      dest: "{{ dex_src_dir }}"
      update: true
      force: true
    tags: [dex, build]

  # Both build + install are skipped when the installed binary's sidecar SHA
  # matches the source HEAD — otherwise every apply rebuilds and re-installs
  # and plan-mode reports a change every run. Force rebuild via:
  #   rm /usr/local/bin/dex{,.sha} && mooncake apply -c ./<m>.yml [-K] -t dex

  - name: "Build and install dex binary"
    # Delegates to dex's own tasks.yml `install` target: builds with
    # -tags sqlite_fts5 (required for FTS5), copies to ~/.local/bin, and
    # restarts any running dex instances. The go-quality module it pulls is
    # fetched from github.com over https (alehatsman/go-quality), so no
    # insecure-host trust is needed — works even when this moongit host is down.
    # {{ dex_src_dir }} is unquoted on purpose — see variables.yml.
    shell: |
      set -euo pipefail
      cd {{ dex_src_dir }}
      mooncake task install
      git -C {{ dex_src_dir }} rev-parse HEAD > {{ dex_bin_path }}.sha
      chmod 0644 {{ dex_bin_path }}.sha
    unless_command: |
      test -x {{ dex_bin_path }} && \
        [ "$(cat {{ dex_bin_path }}.sha 2>/dev/null)" = "$(git -C {{ dex_src_dir }} rev-parse HEAD 2>/dev/null)" ]
    tags: [dex, build]

  # ───────────────── LOCAL OLLAMA (macOS only) ───────────────────────────────
  # On Linux the GPU server runs ollama as a system service (server.yml).
  # On macOS ollama is installed via Homebrew; start it as a user service and
  # pull the embed + chat models so dex works offline without the SSH tunnel.

  - name: "Start ollama via Homebrew services (mac)"
    shell: brew services start ollama
    unless_command: brew services list | grep -q '^ollama.*started'
    when: os == 'darwin'
    tags: [dex, ollama]

  - name: "Pull dex embed model into local ollama (mac)"
    shell: ollama pull {{ dex_embed_model }}
    unless_command: ollama list 2>/dev/null | grep -q '^{{ dex_embed_model }}'
    when: os == 'darwin' and dex_embed_model != ''
    tags: [dex, ollama]

  - name: "Pull dex chat model into local ollama (mac)"
    shell: ollama pull {{ dex_chat_model }}
    unless_command: ollama list 2>/dev/null | grep -q '^{{ dex_chat_model }}'
    when: os == 'darwin' and dex_chat_model != ''
    tags: [dex, ollama]

  - name: "Pull dex expand model into local ollama (mac)"
    shell: ollama pull {{ dex_expand_model }}
    unless_command: ollama list 2>/dev/null | grep -q '^{{ dex_expand_model }}'
    when: os == 'darwin' and dex_expand_model != ''
    tags: [dex, ollama]

  - name: "Tune ollama homebrew plist for multi-agent (OLLAMA_NUM_PARALLEL, OLLAMA_KEEP_ALIVE) (mac)"
    # PlistBuddy Add fails when the key exists; fall back to Set.
    # Use launchctl unload+load (not brew services restart): brew services
    # start/restart regenerates the plist from the formula, clobbering edits.
    shell: |
      set -euo pipefail
      plist=~/Library/LaunchAgents/homebrew.mxcl.ollama.plist
      /usr/libexec/PlistBuddy -c "Add :EnvironmentVariables:OLLAMA_NUM_PARALLEL string {{ dex_ollama_num_parallel }}" "$plist" 2>/dev/null || \
        /usr/libexec/PlistBuddy -c "Set :EnvironmentVariables:OLLAMA_NUM_PARALLEL {{ dex_ollama_num_parallel }}" "$plist"
      /usr/libexec/PlistBuddy -c "Add :EnvironmentVariables:OLLAMA_KEEP_ALIVE string {{ dex_ollama_keep_alive }}" "$plist" 2>/dev/null || \
        /usr/libexec/PlistBuddy -c "Set :EnvironmentVariables:OLLAMA_KEEP_ALIVE {{ dex_ollama_keep_alive }}" "$plist"
      # launchctl unload+load re-reads the plist from disk without overwriting it.
      # brew services restart would regenerate the plist from the formula template,
      # clobbering the edits above.
      launchctl unload "$plist"
      launchctl load "$plist"
    unless_command: |
      /usr/libexec/PlistBuddy -c "Print :EnvironmentVariables:OLLAMA_NUM_PARALLEL" ~/Library/LaunchAgents/homebrew.mxcl.ollama.plist 2>/dev/null | grep -qx "{{ dex_ollama_num_parallel }}" && \
      /usr/libexec/PlistBuddy -c "Print :EnvironmentVariables:OLLAMA_KEEP_ALIVE" ~/Library/LaunchAgents/homebrew.mxcl.ollama.plist 2>/dev/null | grep -qx "{{ dex_ollama_keep_alive }}"
    when: os == 'darwin'
    tags: [dex, ollama]

  # ───────────────── LOCAL RERANKER (macOS, Infinity + MPS) ─────────────────
  # Linux rerank is handled in server.yml via Docker containers (Infinity or
  # vLLM). On macOS, Docker containers can't reach Metal, so Infinity runs as
  # a Python package with --engine torch --device mps. Gated on
  # dex_rerank_style=cohere — client macs that tunnel to a Linux chat-vllm
  # server don't activate this block.

  - name: "Install Infinity reranker package (mac)"
    shell: >-
      uv tool install 'infinity-emb[torch,optimum,server]'
      --with 'click<8.2'
      --with 'optimum<2'
      --with 'transformers<4.49'
    unless_command: uv tool list 2>/dev/null | grep -q '^infinity-emb'
    when: os == 'darwin' and dex_rerank_style == 'cohere' and dex_rerank_local_port != ''
    timeout: 10m
    tags: [dex, rerank]

  - name: "Deploy dex-reranker launchd plist (mac)"
    file.template:
      src: ./templates/dex-reranker.plist.j2
      dest: "~/Library/LaunchAgents/com.alehatsman.dex-reranker.plist"
    when: os == 'darwin' and dex_rerank_style == 'cohere' and dex_rerank_local_port != ''
    tags: [dex, rerank]

  - name: "Load dex-reranker launchd plist (mac)"
    shell: |
      set -euo pipefail
      plist=~/Library/LaunchAgents/com.alehatsman.dex-reranker.plist
      launchctl unload "$plist" 2>/dev/null || true
      launchctl load "$plist"
    when: os == 'darwin' and dex_rerank_style == 'cohere' and dex_rerank_local_port != ''
    tags: [dex, rerank]

  # ───────────────────────────────────────────────────────────────────────────

  - name: "Ensure ~/.config/dex exists"
    file.write:
      path: ~/.config/dex
      state: directory
    tags: [dex]

  - name: "Render dex.env (single source of truth for all DEX_* consumers)"
    # One file feeds .zshenv (sourced), the dex-serve/dex-watch@ units
    # (EnvironmentFile=) and the MCP registration below (each line → a
    # `claude mcp add -e` flag). Change a DEX_* value via the vars and
    # re-deploy — the consumers never carry their own copy.
    file.template:
      src: ./templates/dex.env.j2
      dest: "~/.config/dex/dex.env"
    tags: [dex, claude]

  - name: "Register dex with Claude Code (user scope)"
    # remove-then-add keeps the command/args in lockstep with this template
    # so future arg changes propagate cleanly. Env vars come from the rendered
    # dex.env (above) rather than shell defaults — the ollama-served model
    # names + non-standard port all differ from the dex binary's compiled-in
    # defaults, so leaving them implicit would silently 4xx against both
    # endpoints. Each KEY=VALUE line becomes one `-e` flag, so the MCP server's
    # env stays identical to the shell + service env by construction.
    shell: |
      set -euo pipefail
      claude mcp remove dex --scope user 2>/dev/null || true
      # Build the -e flag list from dex.env — single source, no per-var duplication.
      args=()
      while IFS= read -r kv; do
        case "$kv" in ''|\#*) continue ;; esac
        args+=(-e "$kv")
      done < ~/.config/dex/dex.env
      claude mcp add --scope user dex "${args[@]}" -- {{ dex_bin_path }} mcp
    tags: [dex, claude]

  - name: "Append dex usage block to ~/.claude/CLAUDE.md"
    # Declarative nudge so the "query dex first" + FTS5 build protocol travels
    # with the dex component to any box, instead of being hand-baked into a
    # single machine's prompt. Marker-guarded (idempotent), same pattern as the
    # SSH-config append below. Runs AFTER the claude component's whole-file
    # file.copy of CLAUDE.md (claude is imported before dex in the machine
    # index), so a re-apply re-establishes the block after the overwrite.
    shell: |
      set -euo pipefail
      dest="$HOME/.claude/CLAUDE.md"
      touch "$dest"
      if ! grep -q '<!-- dex -->' "$dest"; then
        cat >> "$dest" <<'DEXBLOCK'

      <!-- dex -->
      ## Pull intel from dex first (semantic code intel)

      Lead with semantic intel, not blind sweeps:
      - Query dex (`search_semantic`, `ask`, `search_symbol`, `graph_*`) **before**
        grepping or reading broadly. `graph_*` only for architecture/call-flow.
      - Minimal reads. Grep only after semantic search comes up empty. Stop at
        sufficient confidence; optimize tokens. Fallback: `dex context . "$Q" --format json`.

      ## Prefer dex tools over native — token compression (MANDATORY)

      dex tools return compact output. Use them instead of native equivalents; fall
      back to native only for the caveats listed below.

      | Instead of | Use | Key args |
      |---|---|---|
      | `Read` | `file_view` | `mode`: `signatures` (~10× smaller), `map` (imports+exports), `lines:N-M` (slice), `full` (LLM summary). Up to 10 `paths`/call. |
      | `Grep`/`rg` | `search_grep` | `pattern` (RE2), `path`, `ext`, `max_results`. |
      | `ls`/`find` | `file_tree` | `path`, `depth`; aggregates deep dirs. |
      | `Bash` (build/test/log) | `ctx_shell` | `command`; auto-compresses output, reports `saved_pct`. |
      | semantic→read chain | `search_context` / `ask` | one round-trip: hits + signatures + best symbol body. |

      Fall back to NATIVE — don't force a dex tool that can't do the job:
      - Writes, redirects (`>`/`>>`/`tee`), heredocs, or >60 s commands → native `Bash`
        (`ctx_shell` blocks writes + times out at 60 s; auth/dev-server/watch pass through).
      - Unindexed files, or full content >64 KB → native `Read` (`file_view` is
        index-scoped; `full` caps at 64 KB).
      - grep features `search_grep` lacks (context lines, fixed-string flags, etc.) → native `Grep`.

      **Never build/install `dex` without `-tags sqlite_fts5`.** CGO `mattn/go-sqlite3`;
      a plain `go install ./cmd/dex` ships a binary missing FTS5, then `reindex`/`index`
      fail (`migrate: no such module: fts5`). `reindex` drops the index *before*
      rebuild, so an FTS5-less binary **wipes the project index**. Build via dex's
      `tasks.yml` (`GO_TAGS: sqlite_fts5`) or `CGO_ENABLED=1 go build -tags sqlite_fts5`.
      Don't `reindex` blind — confirm the binary opens an index first. The `dex serve`/
      `dex watch` systemd user units run the old build until restarted.
      <!-- /dex -->
      DEXBLOCK
      fi
    tags: [dex, claude]

  - name: "Verify dex is on $PATH"
    assert:
      command:
        cmd: which dex
    tags: [dex, verify]

  - name: "Verify dex is registered with Claude Code"
    assert:
      command:
        cmd: "claude mcp list | grep -q '^dex: '"
    tags: [dex, verify]

  # ───────────────── CLIENT-ONLY TUNNEL (Linux + macOS) ──────────────────────
  #
  # Server hosts skip the tunnel — they reach the embedding endpoint over
  # loopback (dex is fine pointing at the same 127.0.0.1:8082 that the
  # server publishes).

  - name: "Ensure {{ dex_remote_host }} SSH alias is in ~/.ssh/config"
    # The tunnel template (and the ssh binary launched by launchd/systemd)
    # resolves `dex_remote_host` as a hostname alias. Without this Host
    # block the tunnel fails with "nodename nor servname provided". The step
    # is idempotent — it exits early if the block is already present.
    shell: |
      set -euo pipefail
      config="$HOME/.ssh/config"
      touch "$config" && chmod 0600 "$config"
      if ! grep -q "^Host {{ dex_remote_host }}$" "$config"; then
        printf '\nHost %s\n    HostName %s\n    Port %s\n    User %s\n' \
          '{{ dex_remote_host }}' '{{ dex_remote_ip }}' \
          '{{ dex_remote_ssh_port }}' '{{ dex_remote_user }}' >> "$config"
      fi
    unless_command: "grep -q '^Host {{ dex_remote_host }}$' ~/.ssh/config 2>/dev/null"
    when: dex_role == 'client'
    tags: [dex, tunnel]

  - name: "Deploy dex-tunnel user systemd unit"
    file.template:
      src: ./templates/dex-tunnel.service.j2
      dest: "~/.config/systemd/user/dex-tunnel.service"
    when: dex_role == 'client' and os == 'linux'
    tags: [dex, tunnel]

  - name: "Enable and start dex-tunnel.service"
    shell: |
      set -euo pipefail
      systemctl --user daemon-reload
      systemctl --user enable --now dex-tunnel.service
    when: dex_role == 'client' and os == 'linux'
    tags: [dex, tunnel]

  - name: "Unload and remove dex-tunnel launchd plist when tunnel is disabled (mac)"
    shell: |
      set -euo pipefail
      plist=~/Library/LaunchAgents/com.alehatsman.dex-tunnel.plist
      launchctl unload "$plist" 2>/dev/null || true
      rm -f "$plist"
    unless_command: "[ ! -f ~/Library/LaunchAgents/com.alehatsman.dex-tunnel.plist ]"
    when: dex_role == 'client' and os == 'darwin' and dex_tunnel_enabled == 'false'
    tags: [dex, tunnel]

  - name: "Deploy dex-tunnel launchd plist (mac)"
    file.template:
      src: ./templates/dex-tunnel.plist.j2
      dest: "~/Library/LaunchAgents/com.alehatsman.dex-tunnel.plist"
    when: dex_role == 'client' and os == 'darwin' and dex_tunnel_enabled == 'true'
    tags: [dex, tunnel]

  - name: "Load dex-tunnel launchd plist (mac)"
    shell: |
      set -euo pipefail
      plist=~/Library/LaunchAgents/com.alehatsman.dex-tunnel.plist
      launchctl unload "$plist" 2>/dev/null || true
      launchctl load "$plist"
    when: dex_role == 'client' and os == 'darwin' and dex_tunnel_enabled == 'true'
    tags: [dex, tunnel]

  # ───────────────── AUTO-REINDEX (dex watch) ───────────────────────
  #
  # A templated user systemd unit so each indexed project gets its own
  # fsnotify-driven watcher. Ad-hoc worktrees pick up watches automatically
  # through the zsh gwc helper (components/zsh), which enables/disables
  # dex-watch@ instances and depends on this template existing — so the
  # template is deployed on every Linux box, server included.
  #
  # Long-lived projects (dex_watch_paths) are handled differently per role:
  #   client  declarative dex-watch@ instances (the sync step below)
  #   server  the dex-sweep daemon (see SWEEP section) keeps the WHOLE indexed
  #           portfolio fresh by polling — not just dex_watch_paths — so per-path
  #           eager watchers are unnecessary and serve runs query-only
  #           (DEX_SERVE_WATCH=0). On clients dex_watch_paths is empty, so the
  #           sync step is the additive no-op.
  #
  # Linux-only by design — mac clients have no equivalent watcher, since
  # long-lived projects live on the GPU host (main_pc) and the Mac is a
  # read-only consumer over the tunnel.

  - name: "Deploy dex-watch@ templated systemd unit"
    file.template:
      src: ./templates/dex-watch@.service.j2
      dest: "~/.config/systemd/user/dex-watch@.service"
    when: os == 'linux'
    tags: [dex, watch]

  - name: "Reload user systemd so dex-watch@ is discoverable"
    shell: systemctl --user daemon-reload
    when: os == 'linux'
    changed_when: false
    tags: [dex, watch]

  # Empty dex_watch_paths = additive mode (leave existing instances
  # alone). Listing one or more paths flips into declarative mode: enable
  # each, disable any other dex-watch@* instance.
  # Existing watch instances cache their ExecStart from when they were
  # started, so a template change (e.g. dex_bin_path moves) doesn't
  # propagate until the instance is restarted. try-restart only acts on
  # running units, so this is a no-op when nothing's enabled.
  - name: "Restart any running dex-watch@* to pick up new template"
    shell: |
      set -euo pipefail
      instances=$(systemctl --user list-units --type=service --no-legend --plain 'dex-watch@*' 2>/dev/null | awk '{print $1}')
      for u in $instances; do
        systemctl --user try-restart "$u" || true
      done
    when: os == 'linux'
    changed_when: false
    tags: [dex, watch]

  - name: "Sync dex-watch instances against dex_watch_paths"
    # Client-only: on the server the long-lived dex_watch_paths are owned by
    # dex serve's eager-watch (see SERVE section), and gating this step out
    # there also stops it from disabling gwc-driven ad-hoc worktree watchers
    # as "stale". On clients dex_watch_paths is empty, so this is the
    # additive no-op that leaves gwc's instances alone.
    #
    # Pongo2 (mooncake's templater) treats `{#` as a block-comment opener,
    # so any literal `${#paths[@]}` blows up at parse time. Check the input
    # variable instead — same effect, no `{#` bigram.
    shell: |
      set -euo pipefail
      declared='{{ dex_watch_paths }}'
      if [[ -z "${declared// /}" ]]; then
        echo "dex_watch_paths empty — leaving existing watch instances alone"
        exit 0
      fi
      declare -a paths
      read -ra paths <<<"$declared"
      for p in "${paths[@]}"; do
        esc=$(systemd-escape "$p")
        systemctl --user enable --now "dex-watch@${esc}.service"
      done
      wants_dir="$HOME/.config/systemd/user/default.target.wants"
      [[ -d "$wants_dir" ]] || exit 0
      shopt -s nullglob
      for f in "$wants_dir"/dex-watch@*.service; do
        unit=$(basename "$f")
        inst=${unit#dex-watch@}
        inst=${inst%.service}
        # `--` is load-bearing: $inst always starts with `-` (every absolute
        # path escapes `/` to `-`), so without it systemd-escape misreads the
        # arg as malformed flags, prints usage to stderr, and emits nothing
        # on stdout — every entry then looks "stale" and the loop disables
        # every running watcher.
        path=$(systemd-escape --unescape -- "$inst")
        found=0
        for p in "${paths[@]}"; do
          [[ "$p" == "$path" ]] && { found=1; break; }
        done
        if [[ "$found" -eq 0 ]]; then
          echo "disabling stale: $unit ($path)"
          systemctl --user disable --now "$unit"
        fi
      done
    when: os == 'linux' and dex_role != 'server'
    tags: [dex, watch]

  # ───────────────── SERVE (HTTP query API for moongit Intel) ─────────────────
  # A server-side `dex serve` daemon on loopback, consumed by moongit's Intel
  # tab (MOONGIT_DEX_URL). Serves the dex_watch_paths roots read-only; it no
  # longer eager-watches them (DEX_SERVE_WATCH=0) — dex-sweep owns freshness.
  # Linux + server only; bound to 127.0.0.1 so no token.

  - name: "Write dex-serve EnvironmentFile (project list)"
    # dex_watch_paths is rendered here (shell cmd → {{ username }} expands)
    # rather than in the unit template (file.template is single-pass and
    # would leave a literal {{ username }} that breaks the --project list).
    shell: |
      set -euo pipefail
      mkdir -p ~/.config/dex
      {
        printf 'DEX_SERVE_PROJECTS=%s\n' '{{ dex_watch_paths }}'
        # Eager per-project watchers are retired in favour of dex-sweep (see
        # SWEEP section): serve is query-only, dex-sweep owns freshness across
        # the whole portfolio. DEX_SERVE_WATCH=0 disables serve's eager-watch
        # without touching MCP autowatch (which lives in dex.env, not here).
        printf 'DEX_SERVE_WATCH=0\n'
      } > ~/.config/dex/serve.env
    when: dex_role == 'server' and os == 'linux'
    changed_when: false
    tags: [dex, serve]

  - name: "Deploy dex-serve user systemd unit"
    file.template:
      src: ./templates/dex-serve.service.j2
      dest: "~/.config/systemd/user/dex-serve.service"
    when: dex_role == 'server' and os == 'linux'
    tags: [dex, serve]

  - name: "Enable + (re)start dex-serve.service"
    # Always restart so a template change (new dex_watch_paths entry, port
    # change) takes effect. The daemon is lightweight, so an apply-time blip
    # is cheap; changed_when:false keeps plan output quiet.
    shell: |
      set -euo pipefail
      systemctl --user daemon-reload
      systemctl --user enable dex-serve.service
      systemctl --user restart dex-serve.service
    when: dex_role == 'server' and os == 'linux'
    changed_when: false
    tags: [dex, serve]

  # ───────────────── SWEEP (portfolio freshness daemon) ──────────────────────
  # One `dex sweep` daemon that keeps EVERY repo dex has ever indexed fresh —
  # not just the served dex_watch_paths. It polls the index dir and incrementally
  # reindexes stale repos (git HEAD newer than the index), one at a time,
  # throttled. This is the migration target away from eager per-project watchers:
  # serve no longer eager-watches (DEX_SERVE_WATCH=0 above), and the whole
  # portfolio stays warm without N resident fsnotify watchers. Server + Linux
  # only — the portfolio lives on the GPU host. Ad-hoc active-repo watchers
  # (gwc / dex-watch@) are unaffected; they remain for low-latency real-time
  # freshness on the repo you're actively editing.

  - name: "Deploy dex-sweep user systemd unit"
    file.template:
      src: ./templates/dex-sweep.service.j2
      dest: "~/.config/systemd/user/dex-sweep.service"
    when: dex_role == 'server' and os == 'linux'
    tags: [dex, sweep]

  - name: "Enable + (re)start dex-sweep.service"
    shell: |
      set -euo pipefail
      systemctl --user daemon-reload
      systemctl --user enable dex-sweep.service
      systemctl --user restart dex-sweep.service
    when: dex_role == 'server' and os == 'linux'
    changed_when: false
    tags: [dex, sweep]

  # ───────────────── RETIRED: dex proxy (dex #208) ───────────────────────────
  # The `dex proxy` subcommand was cut from the binary. Tear down any unit/plist
  # left over from earlier applies so a converged host stops trying to run it.
  - name: "Tear down retired dex-proxy.service (linux)"
    shell: |
      set -euo pipefail
      systemctl --user disable --now dex-proxy.service 2>/dev/null || true
      rm -f ~/.config/systemd/user/dex-proxy.service
      systemctl --user daemon-reload
    when: os == 'linux'
    changed_when: false
    tags: [dex, proxy]

  - name: "Tear down retired dex-proxy launchd plist (mac)"
    shell: |
      set -euo pipefail
      plist=~/Library/LaunchAgents/com.alehatsman.dex-proxy.plist
      launchctl unload "$plist" 2>/dev/null || true
      rm -f "$plist"
    when: os == 'darwin'
    changed_when: false
    tags: [dex, proxy]

  # Retire the standalone dex-watch@ instances for the long-lived serve
  # paths: dex serve now eager-watches its --project registry at boot
  # (DEX_SERVE_WATCH, default on), which is exactly dex_watch_paths, so a
  # separate watcher per path is redundant. Runs AFTER serve is (re)started
  # above so there's no window where nothing watches those roots. Only
  # touches the declared serve paths — gwc-driven ad-hoc worktree watchers
  # are left running.
  #
  # Ordering dependency: requires an installed dex binary that supports
  # eager-watch. The build step at the top of this component installs from
  # dex_src_url HEAD, so a fleet apply rebuilds before reaching here; a
  # tag-scoped `-t serve` apply against an old binary would disable the
  # watchers without a replacement — rebuild dex first in that case.
  - name: "Retire server-side dex-watch@ instances superseded by serve eager-watch"
    shell: |
      set -euo pipefail
      declared='{{ dex_watch_paths }}'
      if [[ -z "${declared// /}" ]]; then
        echo "dex_watch_paths empty — nothing to retire"
        exit 0
      fi
      declare -a paths
      read -ra paths <<<"$declared"
      for p in "${paths[@]}"; do
        esc=$(systemd-escape "$p")
        unit="dex-watch@${esc}.service"
        if systemctl --user is-enabled "$unit" >/dev/null 2>&1 \
           || systemctl --user is-active "$unit" >/dev/null 2>&1; then
          echo "retiring $unit (covered by dex serve eager-watch)"
          systemctl --user disable --now "$unit" || true
        fi
      done
    when: dex_role == 'server' and os == 'linux'
    changed_when: false
    tags: [dex, serve]

  # ───────────────── SUMMARY TUNNEL (server + remote worker configured) ──────
  #

  # ───────────────── SERVER (main_pc) ────────────────────────────────────────

  - import: ./server.yml
    when: dex_role == 'server'
    tags: [dex, server]

  # ───────────────── CI CONTAINER IMAGE (server role; sha-gated) ──────────────
  # dex-ci:latest is the container moongitd runs dex's server-side CI (mgitci.yml)
  # in: moongit-ci-dev + the cgo toolchain the sqlite_fts5 build needs. Like
  # moongit#193, the bundled mooncake (inherited from the moongit-ci-dev base)
  # silently rots when mooncake advances past dex's tasks.yml syntax, failing the
  # quality gate on a YAML parse. Rebuild via dex's own ci-image task, gated on
  # the combined dex+mooncake HEAD AND the moongit-ci-dev base image id — so a
  # base rebuild (e.g. a Go-toolchain bump landing via a moongit-side change)
  # also retriggers dex-ci. Without the base id the gate is blind to the base it
  # derives FROM: when moongit-ci-dev moved to go1.26.4, dex-ci stayed on 1.26.3
  # and dex CI broke (go.mod requires go>=1.26.4; GOTOOLCHAIN=local). Server role
  # only (no CI on client boxes). dex-ci is FROM moongit-ci-dev, so the dex
  # component is imported AFTER moongit in the machine index — that base is
  # already built when this runs. (NB: base id read via `docker images
  # --no-trunc -q`, not `inspect --format '{{.Id}}'`, to avoid colliding with
  # mooncake's own {{ }} templating.)
  #
  # Force a rebuild:
  #   rm {{ dex_ci_image_sha }} && mooncake apply -c ./main_pc.yml -t ci-images
  - name: "Build dex CI container image (refresh when dex, mooncake, or the base image move)"
    shell: |
      set -euo pipefail
      command -v docker >/dev/null 2>&1 || { echo "docker not found — skipping dex CI image build"; exit 0; }
      cd {{ dex_src_dir }}
      mooncake task ci-image
      mkdir -p "$(dirname {{ dex_ci_image_sha }})"
      { git -C {{ dex_src_dir }} rev-parse HEAD; git -C {{ mooncake_src_dir }} rev-parse HEAD; docker images --no-trunc -q moongit-ci-dev:latest; } > {{ dex_ci_image_sha }}
    unless_command: |
      docker image inspect dex-ci:latest >/dev/null 2>&1 && \
      [ "$(cat {{ dex_ci_image_sha }} 2>/dev/null)" = "$({ git -C {{ dex_src_dir }} rev-parse HEAD; git -C {{ mooncake_src_dir }} rev-parse HEAD; docker images --no-trunc -q moongit-ci-dev:latest; })" ]
    when: dex_role == 'server' and os == 'linux'
    timeout: 15m
    tags: [dex, ci-images]
