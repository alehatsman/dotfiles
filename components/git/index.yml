---
- name: Make sure git is installed
  pkg:
    name: git
    state: present
  sudo: true
  when: os == 'linux'
  tags: [git, install]

- name: Deploy .gitconfig
  template:
    src: ./.gitconfig.j2
    dest: ~/.gitconfig
  tags: [git, config]

- name: Verify git installation
  assert:
    command: which git
  tags: [git, verify]

- name: Verify git config
  assert:
    command: git config --get user.name
  tags: [git, verify]
