---
# anchord — alehatsman/anchor's local session daemon.
#
# anchor owns long-running PTY processes so the clients watching them can be
# restarted without taking the processes down. That property is not a
# consequence of its protocol; it is a consequence of who owns anchord's
# process — which makes it this component's job, not teleport's.
#
# WHY THIS EXISTS WHEN `anchor service install` ALREADY DOES IT
#
# anchor ships `anchor service install`, which writes the same LaunchAgent
# this component writes. That command is right for anchor's users and wrong
# for this machine: every change to this box is declared here and applied by
# provision, so a daemon installed by a binary invoking launchctl is a host
# change this repo cannot see, reproduce, or remove. The teleportd
# LaunchAgent next door is managed the same way, for the same reason.
#
# The cost is duplication: the plist and the unit are rendered from templates
# here *and* from `render()` in anchor's src/service.rs. They can drift. That
# is the accepted trade for keeping the machine declarative, and it is why
# anchor_launch_agent_label carries a comment tying it to the LABEL const.
#
# RELATIONSHIP TO TELEPORT
#
# Installing anchord does NOT route teleport through it. teleportd reads
# `use_anchor` (default false, teleport/daemon/src/config.rs) at startup, so
# until that flag is flipped AND teleportd is restarted, anchord simply runs
# beside it, owning nothing. The two cannot collide: anchord binds a unix
# socket under the user's data dir, teleportd binds 127.0.0.1:7337.
#
# That makes this component safe to apply on its own, which is deliberate —
# the flip and the restart are a separate, louder decision (anchor#7).

props:
  anchor_enabled:
    type: bool
    default: true
    description: >-
      Whether this machine runs anchord at all. Present so a box can import
      the component for its binaries without autostarting the daemon.

steps:
  - vars_file: ./variables.yml

  - name: "Ensure anchor_bin_dir exists"
    file:
      path: "{{ anchor_bin_dir }}"
      state: dir
    tags: [anchord]

  # ───────────────────────── build + install from source ──────────────────────

  # Same shape as components/teleport: anchor publishes no tagged release, so
  # there is no tarball to pin. Rebuilds are gated on main's resolved HEAD
  # commit recorded in a stamp file — not on `creates:`, which only asks
  # "does *an* anchord exist" and stays true forever after the first apply
  # (dotfiles#10).
  #
  # One `cargo install` for both binaries: anchor is a single crate with two
  # [[bin]] targets (anchord, anchor), unlike teleport's separate cli/ and
  # daemon/ projects.
  #
  # The commit alone is not enough, and the gap is not theoretical: a binary
  # copied into the bin dir by hand leaves the stamp untouched, so provision
  # reports a converged machine while something it never built is the thing
  # running. That happened to components/tally on 2026-10-17, during an
  # incident, and this component had the identical hole. So the stamp answers
  # "is this the right SOURCE" and `.anchord.sums` answers "are these still
  # the binaries that source produced". Drift in either one rebuilds.
  #
  # Digests, not mtimes: `install` and `cp` both set mtime to now, so a
  # timestamp would rank a hand-copied binary as the fresher one.
  #
  # The `-x` test covers BOTH binaries now. It only ever checked `anchord`,
  # so a deleted or non-executable `anchor` CLI — the half every client and
  # every tally view shells out to — left the gate satisfied and the machine
  # broken.
  - name: "Build and install anchord (+ anchor CLI) from source"
    shell: |
      set -euo pipefail
      tmp=$(mktemp -d)
      trap 'rm -rf "$tmp"' EXIT
      git clone --depth 1 "{{ anchor_repo_url }}.git" "$tmp/src"
      commit=$(git -C "$tmp/src" rev-parse HEAD)
      cargo install --locked --path "$tmp/src" --bins --root "$tmp/out"
      install -m 0755 "$tmp/out/bin/anchord" "{{ anchor_bin_dir | expanduser }}/anchord"
      install -m 0755 "$tmp/out/bin/anchor"  "{{ anchor_bin_dir | expanduser }}/anchor"
      printf '%s\n' "$commit" > "{{ anchor_bin_dir | expanduser }}/.anchord.commit"
      # What the commit does not say: whether these are still the binaries
      # that commit produced. Recorded relative to the bin dir so the check
      # below can `cd` there and not care where it is mounted.
      ( cd "{{ anchor_bin_dir | expanduser }}" && shasum -a 256 anchord anchor > .anchord.sums )
    unless: |
      set -euo pipefail
      bin="{{ anchor_bin_dir | expanduser }}"
      latest=$(git ls-remote "{{ anchor_repo_url }}.git" refs/heads/main | cut -f1)
      test -x "$bin/anchord" && \
        test -x "$bin/anchor" && \
        [ "$(cat "$bin/.anchord.commit" 2>/dev/null)" = "$latest" ] && \
        ( ! test -f "$bin/.anchord.sums" || \
          ( cd "$bin" && shasum -a 256 -c .anchord.sums --status ) )
    register: anchord_install
    timeout: 20m
    tags: [anchord]

  # Backfill for a machine installed before digests existed.
  #
  # A missing `.anchord.sums` used to fail the gate above, which rebuilt from
  # source and — because the install step feeds the service's restart
  # condition — bounced the daemon. For anchord that orphans every live PTY.
  # Paying a restart to write a checksum file is the wrong trade, especially
  # when the stamp already says the source is current.
  #
  # So: record the baseline from what is installed, once. This is the one
  # moment the digests are *assumed* rather than *produced* — there is no
  # evidence either way for a binary that predates the file. Every check
  # after it is real, and a genuine upgrade overwrites this baseline with
  # digests the build actually made.
  - name: "Record anchord binary digests if they were never recorded"
    shell: |
      set -euo pipefail
      cd "{{ anchor_bin_dir | expanduser }}"
      shasum -a 256 anchord anchor > .anchord.sums
    unless: |
      bin="{{ anchor_bin_dir | expanduser }}"
      test -f "$bin/.anchord.sums" || ! test -x "$bin/anchord" || ! test -x "$bin/anchor"
    tags: [anchord]

  # ─────────────────── autostart, macOS (LaunchAgent) ─────────────────────────

  - name: "Ensure ~/Library/LaunchAgents exists"
    file:
      path: ~/Library/LaunchAgents
      state: dir
    when: os == 'darwin' and props.anchor_enabled
    tags: [anchord]

  - name: "Deploy the anchord LaunchAgent"
    template:
      src: ./templates/anchord.plist.j2
      dest: "~/Library/LaunchAgents/{{ anchor_launch_agent_label }}.plist"
      mode: '0644'
    register: anchord_plist
    when: os == 'darwin' and props.anchor_enabled
    tags: [anchord]

  # Liveness is probed by talking to the daemon, not by asking launchd whether
  # a job exists — a loaded entry says nothing about whether the process
  # behind it is answering. `anchor ls` resolves the socket path exactly as
  # any other client does, so this probe fails in precisely the cases a client
  # would fail, which is the only definition of "up" that matters here.
  - name: "Check whether anchord is answering on its socket"
    shell: "{{ anchor_bin_dir | expanduser }}/anchor ls >/dev/null 2>&1"
    register: anchord_live
    changed_when: false
    failed_when: false
    when: os == 'darwin' and props.anchor_enabled
    tags: [anchord]

  # A failed probe does not prove the daemon is gone. A SIGSTOPped anchord is
  # alive, still holds its PTYs, still owns the socket — and answers nothing,
  # so the probe above fails exactly as it would for a dead one. launchd cannot
  # tell the difference either: KeepAlive fires on *exit*, and a stopped
  # process has not exited. Observed on work_mac 2026-10-17 — `runs = 1`,
  # `last exit code = (never exited)`, while every client got `Connection
  # refused (os error 61)`.
  #
  # Routing that case straight to the bootout+bootstrap below would kill a
  # healthy process holding live sessions and mark every one of them `lost`,
  # to repair a daemon that a single SIGCONT restores intact. So: try the cheap
  # remedy first, and fall through to the restart only when it does not take.
  #
  # Narrow by construction. This resumes STOPPED processes and nothing else —
  # a deadlocked or wedged anchord is not stopped, matches no pid here, and
  # still gets the restart it actually needs.
  - name: "Resume anchord if it is only suspended"
    shell: |
      set -uo pipefail
      bin="{{ anchor_bin_dir | expanduser }}"
      resumed=0
      for pid in $(pgrep -x anchord || true); do
        # `T` is ps's stopped state; what follows are unrelated flags
        # (`s`, `+`, ...), so match the first character and not the whole word.
        case "$(ps -o stat= -p "$pid" 2>/dev/null || true)" in
          T*) kill -CONT "$pid" 2>/dev/null && resumed=1 ;;
        esac
      done
      [ "$resumed" = 1 ] || exit 1
      # Resumed is not the same as answering. Bounded wait, retried rather than
      # slept through, for the reason the bootstrap below gives: the settle
      # time is the process's business and not a constant anyone here can name.
      for _ in $(seq 1 20); do
        "$bin/anchor" ls >/dev/null 2>&1 && exit 0
        sleep 0.25
      done
      exit 1
    register: anchord_resumed
    changed_when: anchord_resumed.rc == 0
    failed_when: false
    when: os == 'darwin' and props.anchor_enabled and anchord_live.rc != 0
    tags: [anchord]

  # `|| true` on bootout: a first-ever install has nothing loaded.
  #
  # There is no *port* to wait on, unlike teleportd — anchord binds a unix
  # socket, and a stale socket file is not a conflict: the next daemon probes
  # it and replaces it when nothing answers (anchor docs/04-protocol.md).
  #
  # But the wait teleportd carries was never really about the port. launchd
  # needs a beat to finish dropping a job after bootout, and bootstrapping
  # into that window fails with `5: Input/output error` — which this step did,
  # in production, leaving anchord booted out and never booted back in. The
  # daemon was down until the next apply. A `set -e` script that takes a
  # service down and then fails to bring it up is worse than one that never
  # ran, so the bootstrap retries until launchd accepts it.
  #
  # Retry rather than a fixed sleep: the settle time is launchd's business and
  # not a constant anyone here can name. Bounded, because a bootstrap that is
  # failing for some *other* reason must still surface as a failure rather
  # than spin — the last attempt runs bare so its stderr reaches the operator.
  - name: "(Re)bootstrap the anchord LaunchAgent"
    shell: |
      set -euo pipefail
      uid=$(id -u)
      label="{{ anchor_launch_agent_label }}"
      plist="{{ ('~/Library/LaunchAgents/' + anchor_launch_agent_label + '.plist') | expanduser }}"
      launchctl bootout "gui/$uid/$label" 2>/dev/null || true
      for _ in $(seq 1 20); do
        if launchctl bootstrap "gui/$uid" "$plist" 2>/dev/null; then
          exit 0
        fi
        sleep 0.25
      done
      # Out of retries: run it once more without swallowing stderr, so the
      # real reason is what the operator sees.
      launchctl bootstrap "gui/$uid" "$plist"
    when: >-
      os == 'darwin' and props.anchor_enabled and
      (anchord_plist.changed or anchord_install.changed or
       (anchord_live.rc != 0 and (anchord_resumed.rc | default(1)) != 0))
    changed_when: true
    tags: [anchord]

  # Asserted as a state after the bootstrap above, the same way
  # components/teleport does it: RunAtLoad means bootstrap already started
  # the job, so this is a cheap claim about where the machine should end up
  # rather than a second way to start it.
  - name: "Enable + start anchord (launchd)"
    service:
      name: "{{ anchor_launch_agent_label }}"
      scope: user
      enabled: true
      state: started
    when: os == 'darwin' and props.anchor_enabled
    tags: [anchord]

  # ─────────────────── autostart, Linux (systemd user unit) ───────────────────

  - name: "Ensure ~/.config/systemd/user exists"
    file:
      path: ~/.config/systemd/user
      state: dir
    when: os == 'linux' and props.anchor_enabled
    tags: [anchord]

  - name: "Deploy the anchord systemd user unit"
    template:
      src: ./templates/anchord.service.j2
      dest: "~/.config/systemd/user/{{ anchor_systemd_unit }}"
      mode: '0644'
    register: anchord_unit
    when: os == 'linux' and props.anchor_enabled
    tags: [anchord]

  - name: "Reload systemd user units"
    shell: systemctl --user daemon-reload
    when: os == 'linux' and props.anchor_enabled and (anchord_unit.changed or anchord_install.changed)
    changed_when: true
    tags: [anchord]

  - name: "Enable + start anchord"
    service:
      name: "{{ anchor_systemd_unit }}"
      scope: user
      enabled: true
      state: started
    when: os == 'linux' and props.anchor_enabled
    tags: [anchord]
