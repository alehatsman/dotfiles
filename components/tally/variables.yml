---
# Component-local defaults for tallyd (alehatsman/tally) — the daemon that
# drives a Novation Launchpad Mini MK3 as a front panel for anchor sessions.
#
# tallyd is the most disposable process on this machine, by design: it holds
# no state that cannot be rebuilt from `anchor list` plus a config file
# (tally docs/08-lifecycle.md). Killing it affects nothing except the lights.
# That is exactly why it belongs to the service manager rather than to a
# login shell — nobody should have to remember to start it.

# Built from source, tracking main. tally ships no tagged release, so there
# is no tarball to pin a sha256 to; the install step resolves main's HEAD and
# rebuilds only when that commit moves. Same shape as components/anchord.
tally_repo_url: "https://github.com/alehatsman/tally"

tally_bin_dir: "~/.local/bin"

# Unlike anchord, this label matches no constant in the binary. tally has no
# `service install` subcommand and will not grow one — it is not distributed
# to anyone, so the only thing that installs it is this component (tally
# docs/07-seams.md). There is nothing to drift against.
tally_launch_agent_label: "dev.tally.tallyd"

# tallyd's diagnostics go to stderr and are the only way to answer "why is my
# grid dark" — which Launchpad port it found, whether anchord is reachable,
# whether the device stopped answering. anchord gets away with no log paths
# because `anchor ls` can be asked; tallyd deliberately has no socket to ask
# (docs/08-lifecycle.md rejects one), so the log IS the interface.
tally_log_dir: "~/.local/state/tally"

# launchd gives an agent PATH=/usr/bin:/bin:/usr/sbin:/sbin and nothing else,
# which is a problem tallyd cannot solve from inside itself: it shells out to
# `tmux` to drive the jump, and tmux lives in Homebrew's prefix. Running
# tallyd by hand works and running it as an agent does not -- the failure only
# appears under the service manager, which is the worst place to find it.
#
# It compounds, too. If tallyd is the one to START the tmux server, that
# server inherits this PATH, and then every view window fails to find
# `anchor` as well. One variable fixes both, because the view windows are
# children of whichever tmux ends up running.
# Everything tallyd needs to exec, minus its own bin dir -- the template
# prepends that, because a vars file is not rendered recursively and a
# "{{ ... }}" written here reaches the plist verbatim. (It did, once.)
tally_extra_path: "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

# The window tallyd opens when a jump has nowhere to land (tally#10).
#
# tallyd opens this itself rather than anything starting it at login, and
# that stays true deliberately: a terminal that appears at boot is one more
# window to close every morning, and the fallback only fires when a pad is
# pressed with no client attached — which is exactly when you want it. What
# was wrong was not the laziness, it was that the command existed only
# inside a Rust function. Declared here, it is the same lazy window and this
# file is the place its look is chosen.
#
# tally reads TALLY_TERMINAL_CMD, splits it on spaces and appends
# `tmux -L tally attach -t tally`, so this must END at `-e` and no value may
# contain a space (tally src/jump.rs, terminal_command).
#
# Why the overrides: the shared Alacritty config is 80x40, sized for a
# single shell. This window holds a row session whose columns are full-width
# tabs, so it wants room for one agent at a time, not a quarter of one.
# `--class tally` is what a window manager rule would key on; nothing keys on
# it yet, and it costs nothing to make the window nameable before something
# does.
tally_terminal_cmd: >-
  open -na Alacritty --args
  --class tally
  --title tally
  --option window.dimensions.columns=200
  --option window.dimensions.lines=50
  -e
