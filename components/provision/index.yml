---
# provision — verify the binary running this plan can actually parse this repo.
#
# Verify-only, deliberately. This component never writes the binary: an apply
# must not swap out the tool executing it. Installing and upgrading are the job
# of scripts/bootstrap.sh, an explicit choice — the same posture the justfile
# takes on `just upgrade`.
#
# It checks CAPABILITY, not version, because version is useless here:
# Cargo.toml has read 0.9.1 across many commits, so a build that predates the
# `download` and `git` actions reports exactly the same string as a current
# one. Asking "which actions do you understand?" is the question that actually
# distinguishes them — and it is the precise failure that stranded mini_pc:
# `unknown key `download` in a step`, from a binary built at the v0.9.1 tag.
#
# See docs/bootstrap.md.

- name: provision understands the actions this repo uses
  assert:
    command: |
      set -eu
      command -v provision >/dev/null 2>&1 || {
        echo "provision not on PATH — run ./scripts/bootstrap.sh" >&2
        exit 1
      }
      tmp="$(mktemp -d)"
      trap 'rm -rf "$tmp"' EXIT
      # Never fetched: validate parses and renders, it does not execute.
      cat > "$tmp/probe.yml" <<'PROBE'
      - name: probe the download action
        download:
          url: https://example.invalid/probe.tar.gz
          dest: /tmp/provision-probe.tar.gz
      - name: probe the git action
        git:
          repo: https://example.invalid/probe.git
          dest: /tmp/provision-probe
      PROBE
      if ! out="$(provision validate "$tmp/probe.yml" 2>&1)"; then
        case "$out" in
          *"unknown key"*)
            echo "provision is too old for this repo:" >&2
            printf '%s\n' "$out" | sed 's/^/  /' >&2
            echo "" >&2
            echo "Rebuild from main:  ./scripts/bootstrap.sh" >&2
            exit 1 ;;
        esac
        # Any other validate failure is about the probe plan, not the binary's
        # vocabulary, so it is not this assert's business.
      fi
  tags: [core, provision, verify]
