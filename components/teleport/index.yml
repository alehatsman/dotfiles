---
# teleport — alehatsman/teleport's local headless terminal/session daemon
# (teleportd), reached over Tailscale Serve for phone/remote access.
#
# teleportd binds 127.0.0.1 only (docs/06-security.md in that repo); it is
# never exposed directly. `tailscale serve` proxies it to the tailnet over
# HTTPS — no public exposure, no bespoke auth to build
# (docs/07-remote-access.md). macOS has no headless autostart path yet
# (`teleportd service install` is Linux-only — issue #40), so this installs
# a login-scoped LaunchAgent by hand, the equivalent docs/08-packaging.md
# calls for.
#
# macOS and Linux. The two differ only in how the daemon is autostarted
# (LaunchAgent vs systemd user unit) and where teleportd keeps its data;
# build, config and Tailscale Serve are identical. See docs/teleport-linux.md.
#
# On Linux the service outlives logout, because shared/bootstrap.yml enables
# linger -- the macOS side still has no headless equivalent (issue #40).
#
# Built from source via cargo (components/languages must be imported
# first so rustup/cargo are on PATH), so there is no per-arch binary to
# track — the same build step works on Intel, Apple Silicon and x86_64 Linux.

props:
  teleport_tailnet_hostname:
    type: string
    default: "gj4vg9p1vj.tail37c478.ts.net"
    description: >-
      This box's tailnet MagicDNS name (`tailscale status --self`), allowlisted
      in teleportd's config.toml. Genuinely per-machine — Tailscale pins it at
      device registration and it does not follow OS hostname renames, so it
      drifts independently per box. Must be set explicitly in each importing
      machine's `use: … / props:` block (dotfiles#15); the default here is
      just whichever box last needed fixing, not a shared value.
  teleport_use_anchor:
    type: bool
    default: false
    description: >-
      Whether teleportd runs its sessions in anchord instead of its own
      in-process PTY layer. Off by default: a box that sets this MUST also
      import components/anchord, or teleportd starts fine (the client
      connects lazily) and then fails every session it is asked to create.
      The payoff is that teleportd can be restarted -- shipped -- without
      killing live sessions (anchor#7).

steps:
  - vars_file: ./variables.yml

  # vars_file values are data, not rendered (provision spec §3.3) — `{{ home }}`
  # in variables.yml would stay the literal seven characters. This has to
  # compute against `home`, so it's a `vars:` step instead.
  #
  # BOOTSTRAP PATH ONLY. This used to be a hand-mirrored copy of the full
  # interactive PATH from components/zsh/templates/.zshrc.j2, because
  # teleportd is launchd-started (bare /usr/bin:/bin:/usr/sbin:/sbin) and its
  # `claude`/`codex` presets exec a named binary with no shell in between, so
  # they inherited that bare PATH. Two lists, and the copy drifted.
  #
  # Fixed at both ends instead: teleport's presets now carry `login_shell`
  # (see presets.toml below), so the agent's environment comes from the user's
  # real login shell; and components/zsh moved the full PATH into
  # ~/.config/zsh/env.zsh where a non-interactive login shell can see it. All
  # this needs to do now is let launchd exec teleportd and let teleportd find
  # $SHELL.
  - vars:
      teleport_path: "{{ home }}/.local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin"
      # teleportd resolves its own data dir from the platform convention
      # (directories::BaseDirs::data_local_dir) and is not given --data-dir,
      # so config.toml has to be written where the daemon will actually look.
      # Computed here rather than in variables.yml for the same reason as
      # teleport_path above: vars_file values are data and are never rendered,
      # so a {{ }} there would stay seven literal characters.
      #
      # The Linux value is not a guess -- it is where mainpc's pre-existing
      # hand-installed teleportd already keeps its state.
      teleport_data_dir: >-
        {{ "~/Library/Application Support/teleport" if os == 'darwin'
           else "~/.local/share/teleport" }}

  - name: "Ensure teleport_bin_dir exists"
    file:
      path: "{{ teleport_bin_dir }}"
      state: dir
    tags: [teleport]

  # ───────────────────────── build + install teleportd from source ───────────

  # Built from source, not downloaded — teleport only ships a floating
  # "-dev" prerelease (github.com/alehatsman/teleport/releases), republished
  # with different bytes on every merge to main, so there is no stable
  # tagged tarball to pin a sha256 to. Tracks main: every apply resolves
  # main's current HEAD commit and rebuilds only when that commit has moved
  # since the last install.
  #
  # Reinstalls are gated on the resolved commit, not `creates:` on the
  # binary path (dotfiles#10) — `creates` only asks "does *a* teleportd
  # exist", permanently true after the first apply even once main has moved
  # on. The `.teleportd.commit` stamp records which commit is actually
  # installed, mirroring the old `.teleportd.sha256` tarball-hash stamp.
  #
  # `cargo install --path` (not `cargo build --release` + manual `install`)
  # because it resolves the native target itself — no per-arch build dirs to
  # track, unlike the tarball flow this replaced. `--root` points both
  # builds at a scratch prefix so the resulting binaries land at a known
  # `<root>/bin/<name>` path this step then copies into teleport_bin_dir.
  #
  # cli/ and daemon/ are two independent Cargo projects, not workspace
  # members (no root Cargo.toml in the repo) — each needs its own
  # `cargo install --path`.
  #
  # Web UI is built first and baked into teleportd via the `embedded-web`
  # cargo feature (docs/16-release-pipeline.md#embedding-the-web-ui —
  # rust-embed reads `../web/dist` at compile time), the same shape the
  # repo's own release workflow uses, so the installed binary is
  # self-contained — no `--web-dist` flag, no separate asset dir to keep in
  # sync with the binary. Requires node/npm on PATH (brew's `node` formula,
  # platforms/macos/packages.yml).
  - name: "Build and install teleportd (+ teleport CLI) from source"
    shell: |
      set -euo pipefail
      tmp=$(mktemp -d)
      trap 'rm -rf "$tmp"' EXIT
      git clone --depth 1 "{{ teleport_repo_url }}.git" "$tmp/src"
      commit=$(git -C "$tmp/src" rev-parse HEAD)
      ( cd "$tmp/src/web" && npm ci && npm run build )
      cargo install --locked --path "$tmp/src/daemon" --features embedded-web --bin teleportd --root "$tmp/out"
      cargo install --locked --path "$tmp/src/cli" --bin teleport --root "$tmp/out"
      install -m 0755 "$tmp/out/bin/teleportd" "{{ teleport_bin_dir | expanduser }}/teleportd"
      install -m 0755 "$tmp/out/bin/teleport" "{{ teleport_bin_dir | expanduser }}/teleport"
      printf '%s\n' "$commit" > "{{ teleport_bin_dir | expanduser }}/.teleportd.commit"
    unless: |
      set -euo pipefail
      latest=$(git ls-remote "{{ teleport_repo_url }}.git" refs/heads/main | cut -f1)
      test -x "{{ teleport_bin_dir | expanduser }}/teleportd" && \
        [ "$(cat "{{ teleport_bin_dir | expanduser }}/.teleportd.commit" 2>/dev/null)" = "$latest" ]
    register: teleport_install
    timeout: 20m
    tags: [teleport]

  # ───────────────────────── config ───────────────────────────────────────────

  # Registered because teleportd reads config.toml exactly once, at startup
  # (Config::load in daemon/src/config.rs). Without this the file could change
  # on disk and the running daemon would keep serving the old values until
  # something unrelated -- a new binary, a vanished job -- happened to bounce
  # it. A config change nothing acts on is not configuration, so this feeds
  # the bootout/bootstrap gate below.
  - name: "Deploy teleportd config.toml (tailnet origin/host allowlist)"
    template:
      src: ./templates/config.toml.j2
      dest: "{{ teleport_data_dir }}/config.toml"
      mode: '0644'
    register: teleport_config
    tags: [teleport]

  - name: "Deploy teleportd presets.toml (login-shell agent presets)"
    # teleportd writes this file itself on first run and then never touches it
    # again (presets.rs::load_or_create generates on absence only), so an
    # already-installed daemon would keep the pre-login_shell defaults forever.
    # Managing it here is what actually turns the flag on — and makes the
    # preset list a provisioned artifact rather than whatever first-run
    # happened to leave behind.
    template:
      src: ./templates/presets.toml.j2
      dest: "{{ teleport_data_dir }}/presets.toml"
      mode: '0644'
    tags: [teleport]

  # ─────────────────── autostart, macOS (LaunchAgent) ─────────────────────────

  - name: "Ensure ~/Library/LaunchAgents exists"
    file:
      path: ~/Library/LaunchAgents
      state: dir
    when: os == 'darwin'
    tags: [teleport]

  - name: "Deploy the teleportd LaunchAgent"
    template:
      src: ./templates/teleportd.plist.j2
      dest: "~/Library/LaunchAgents/{{ teleport_launch_agent_label }}.plist"
      mode: '0644'
    register: teleport_plist
    when: os == 'darwin'
    tags: [teleport]

  # `service: state: started` needs the job already bootstrapped — it
  # cannot load a plist that was never loaded (provision spec §6.6) — so
  # this has to run, and succeed, before "Enable + start" below whenever
  # teleportd isn't actually answering on its port, not just when the plist
  # changed. Testing here found a `service: state: restarted` (kickstart -k)
  # step used for "the binary was reinstalled, bounce the process" left the
  # job entirely missing from `launchctl print` seconds later, for reasons
  # that didn't reproduce cleanly — so a binary-only reinstall
  # (`teleport_install.changed`) now goes through the exact same
  # bootout+bootstrap this step already uses for plist changes, a path
  # that's held up under repeated testing, rather than trusting kickstart.
  #
  # Probing the port rather than `launchctl print` on purpose: a launchd
  # entry existing says nothing about whether the process behind it is
  # actually the one serving {{ teleport_port }} — the port-race this step's
  # own wait-loop guards against (below) produced exactly that split once
  # during testing. `teleport_loaded.rc != 0` catches that state, "vanished
  # between applies", and "never bootstrapped" all the same way.
  - name: "Check whether teleportd is reachable on its expected port"
    shell: nc -z -w 2 127.0.0.1 {{ teleport_port }}
    register: teleport_loaded
    changed_when: false
    failed_when: false
    when: os == 'darwin'
    tags: [teleport]

  # `|| true` on bootout because a first-ever install has nothing loaded yet.
  #
  # bootout tells launchd to drop the job immediately, but the old process
  # itself can take a beat to actually release its listening socket — seen
  # here: bootstrap ran right after bootout, the old teleportd hadn't closed
  # :7337 yet, and the new process fell back to teleportd's own ephemeral-port
  # behavior (docs/08-packaging.md#port-discovery — do not hardcode 7337) —
  # silently deaf to `tailscale serve`, which only ever proxies :{{ teleport_port }}.
  # Wait for the port to actually free up before bootstrapping; fail loudly
  # instead of bootstrapping onto a port nothing will proxy to.
  - name: "(Re)bootstrap the teleportd LaunchAgent"
    shell: |
      set -euo pipefail
      uid=$(id -u)
      label="{{ teleport_launch_agent_label }}"
      plist="{{ ('~/Library/LaunchAgents/' + teleport_launch_agent_label + '.plist') | expanduser }}"
      launchctl bootout "gui/$uid/$label" 2>/dev/null || true
      for _ in $(seq 1 20); do
        lsof -ti "tcp:{{ teleport_port }}" >/dev/null 2>&1 || break
        sleep 0.25
      done
      if lsof -ti "tcp:{{ teleport_port }}" >/dev/null 2>&1; then
        echo "error: 127.0.0.1:{{ teleport_port }} still held 5s after bootout — refusing to" \
             "bootstrap onto a fallback port tailscale serve won't proxy" >&2
        exit 1
      fi
      launchctl bootstrap "gui/$uid" "$plist"
    when: >-
      os == 'darwin' and
      (teleport_plist.changed or teleport_install.changed or
       teleport_config.changed or teleport_loaded.rc != 0)
    changed_when: true
    tags: [teleport]

  - name: "Enable + start teleportd"
    service:
      name: "{{ teleport_launch_agent_label }}"
      scope: user
      state: started
      enabled: true
    when: os == 'darwin'
    tags: [teleport]

  # ─────────────────── autostart, Linux (systemd user unit) ──────────────────
  #
  # Deliberately none of the bootout/port-wait machinery the launchd branch
  # above needs. That dance exists because launchd drops a job asynchronously:
  # the old teleportd could still hold :{{ teleport_port }} when the new one
  # starts, and teleportd then falls back to an ephemeral port that
  # `tailscale serve` never proxies -- running, reachable locally, invisible
  # to the tailnet. systemd restarts a unit synchronously, so the window does
  # not exist and the simple shape is also the correct one.
  #
  # Same pattern components/codefort already runs on mainpc: deploy the unit,
  # reload only when it changed, then declare it started and enabled.

  - name: "Ensure the user unit directory exists"
    file:
      path: ~/.config/systemd/user
      state: dir
      mode: '0755'
    when: os == 'linux'
    tags: [teleport]

  # Adopts mainpc's hand-written unit, which this replaces. That one carried
  # Restart=on-failure (crashes only) and a quoted ExecStart; see the template.
  - name: "Deploy the teleportd user unit"
    template:
      src: ./templates/teleportd.service.j2
      dest: ~/.config/systemd/user/teleportd.service
      mode: '0644'
    register: teleport_unit
    when: os == 'linux'
    tags: [teleport]

  - name: "Reload the user systemd manager"
    cmd: [systemctl, --user, daemon-reload]
    # `when` decides whether it runs; `changed_when` says what it did. A
    # reload that only runs after the unit changed did reload the manager.
    when: os == 'linux' and teleport_unit.changed
    changed_when: true
    tags: [teleport]

  - name: "Enable + start teleportd (linux)"
    service:
      name: teleportd.service
      scope: user
      state: started
      enabled: true
    when: os == 'linux'
    tags: [teleport]

  # Restart on unit change, a fresh binary, OR new config. `state: started` is
  # a state and will not bounce an already-running daemon, so without this an
  # adopted unit, a rebuilt teleportd, or an edited config.toml would keep
  # serving the old process. config.toml is read once at startup, so it
  # belongs in this gate for the same reason the macOS side carries it.
  - name: "Restart teleportd when its unit, binary or config changed"
    service:
      name: teleportd.service
      scope: user
      state: restarted
    when: >-
      os == 'linux' and
      (teleport_unit.changed or teleport_install.changed or
       teleport_config.changed)
    tags: [teleport]

  # ───────────────────────── phone/remote access (Tailscale Serve) ───────────

  - name: "Proxy teleportd to the tailnet via Tailscale Serve"
    # --bg persists the Serve config across tailscaled restarts and reboots
    # (docs/07-remote-access.md#default-tailscale-serve). It does not,
    # however, guarantee teleportd itself is running post-reboot on macOS —
    # that's the LaunchAgent's job, and macOS has no headless (logged-out)
    # equivalent yet (see the header comment).
    shell: tailscale serve --bg http://127.0.0.1:{{ teleport_port }}
    unless: tailscale serve status 2>/dev/null | grep -q '127.0.0.1:{{ teleport_port }}'
    tags: [teleport]

  # ───────────────────────── verify ──────────────────────────────────────────

  # Probes the port, not the service manager. A loaded LaunchAgent or an
  # active unit says the manager is happy; it does not say the process behind
  # it is the one answering on {{ teleport_port }}. teleportd silently falls
  # back to an ephemeral port when its own is taken, and `tailscale serve`
  # only ever proxies {{ teleport_port }} -- so "active" plus a wrong port is
  # a daemon that is running and unreachable. That is the failure worth
  # catching, and only the port can catch it.
  - name: "Verify teleportd is answering on its expected port"
    assert:
      command: |
        set -eu
        for _ in $(seq 1 20); do
          if nc -z -w 2 127.0.0.1 {{ teleport_port }} 2>/dev/null; then exit 0; fi
          sleep 0.5
        done
        echo "teleportd is not listening on 127.0.0.1:{{ teleport_port }}" >&2
        exit 1
    tags: [teleport, verify]
