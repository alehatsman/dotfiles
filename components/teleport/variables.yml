---
# Component-local defaults for teleport (alehatsman/teleport) — a local
# headless terminal/session daemon (teleportd) reached over Tailscale.
#
# NOTE: "override at the machine level via machines/<m>/vars.yml" does not
# actually work for values also set here — this file's vars_file step runs
# inside the component `import:`, after any machine-level vars_file, so it
# unconditionally clobbers an earlier machine override back to what's below
# (verified: setting teleport_tailnet_hostname in machines/mac/vars.yml made
# no difference to the rendered config.toml). mac and work_mac both import
# this component and currently share one hostname default — tracked as its
# own issue (dotfiles#15) rather than fixed here.

# Built from source, tracking main — teleport only ships a "-dev"
# prerelease today (github.com/alehatsman/teleport/releases), republished
# with different bytes on every merge, so there's no stable tagged release
# to pin a tarball to. The install step (index.yml) resolves main's HEAD
# commit itself and rebuilds only when that commit moves.
teleport_repo_url: "https://github.com/alehatsman/teleport"

teleport_bin_dir: "~/.local/bin"
teleport_port: "7337"
teleport_log_dir: "~/Library/Logs"
teleport_launch_agent_label: "com.alehatsman.teleportd"

# teleportd's own default data dir on macOS (directories::BaseDirs::data_local_dir,
# daemon/src/main.rs's resolve_data_dir) — not overridden via --data-dir, so
# this is where config.toml must be written for the daemon to pick it up.
teleport_data_dir: "~/Library/Application Support/teleport"

# teleport_tailnet_hostname moved to components/teleport/index.yml's props
# block (dotfiles#15) — it's genuinely per-machine, so it's set explicitly
# in each importing machine's `use: … / props:` block, not defaulted here.
