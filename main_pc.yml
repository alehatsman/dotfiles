---
# main_pc — Windows 11 desktop, WSL2 Ubuntu side.
#
# Apply:  provision apply ./main_pc.yml
# Plan:   provision plan  ./main_pc.yml
#
# NOPASSWD sudo is configured on this host, so no -K flag is needed.
# Windows host side: ./main_pc.host.yml, applied with provision.exe from an
# Administrator PowerShell.

- vars_file: ./shared/variables.yml
- vars_file: ./machines/main_pc/vars.yml
- import: ./machines/main_pc/index.yml
