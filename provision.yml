---
# Root dispatcher — run `provision apply provision.yml` from the repo root.
# Routes to the correct machine manifest based on the hostname fact.
#
# WSL strips underscores from hostnames (RFC 952), so main_pc → mainpc,
# mini_pc → minipc. mac and x1 match their computer_name directly.
#
# work_mac matches the uppercase MDM-assigned name, not a name of ours:
# NVIDIA's management owns that box's hostname (machines/work_mac/vars.yml).
# These comparisons are exact, so the case matters -- 'work-mac' here used
# to match nothing at all, and a dispatcher that matches nothing skips every
# import and still exits 0, reporting success while doing nothing.
#
# Alternate profile (mini_pc_server.yml) is
# intentionally excluded — invoke it explicitly by path.

- import: ./main_pc.yml
  when: hostname == 'mainpc'

- import: ./mini_pc.yml
  when: hostname == 'minipc'

- import: ./mac.yml
  when: hostname == 'mac'

- import: ./work_mac.yml
  when: hostname == 'GJ4VG9P1VJ'

- import: ./x1.yml
  when: hostname == 'x1'
