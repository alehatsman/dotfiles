---
# main_pc — Windows 11 desktop, provisioned via WSL2 Ubuntu.
#
# Two-step provisioning:
#   1. Windows host (from an Administrator PowerShell):
#        provision.exe apply platforms\windows\bootstrap.yml \
#                           -v shared/variables.yml -v machines/main_pc/vars.yml
#   2. Inside WSL Ubuntu, via the root entry (NOPASSWD sudo, no -K):
#        provision apply ./main_pc.yml
#      or via the daemon:
#        curl --unix-socket /run/user/$UID/mooncake/agentd.sock \
#             -d '{"plan_path":"<abs>/main_pc.yml",
#                  "base_dir":"<abs>"}' http://localhost/v1/runs
#
# vars.load chain mirrors main_pc.yml so the agentd path (which invokes
# this file directly) sees the same var context as a CLI apply. Order:
# shared defaults first, machine overrides second, inline identity block
# last so is_wsl/wsl_distro/wsl_ssh_port always win regardless of source.
# Refuse to run if the live hostname belongs to a different known machine
# (cross-provisioning guard, issue #3 — we've hit main_pc/x1 mixups before).
# Exclusion list, not a strict match: a genuinely fresh box's hostname is
# neither 'mainpc' nor any of these, so first-time bootstrap is never
# blocked — only a hostname already claimed by another machine trips it.
- name: Refuse to apply main_pc's plan on a different known machine
  assert:
    command: |
      h="{{ hostname }}"
      case "$h" in
        minipc|mac|work-mac|x1)
          echo "refusing: hostname is '$h', not main_pc — wrong machine?" >&2
          exit 1 ;;
      esac
  tags: [safety]

- vars_file: ../../shared/variables.yml
- vars_file: ./vars.yml

- vars:
    is_wsl: true
    wsl_distro: "Ubuntu-24.04"
    wsl_ssh_port: "2222"

- import: ../../shared/bootstrap.yml

- import: ../../platforms/windows/index.yml
  tags: [wsl, windows]

# Cross-platform components
# Palette must come first — every later component's templates read
# palette.* / editor.* from the variant selected by `palette_variant`.
- import: ../../components/palette/index.yml
  tags: [core, palette]

- import: ../../components/claude/index.yml
  tags: [core, claude]

- import: ../../components/codex/index.yml
  tags: [core, codex]

- import: ../../components/git/index.yml
  tags: [core, git]

- import: ../../components/languages/index.yml
  tags: [dev, languages]

- import: ../../components/usql/index.yml
  tags: [tools, usql]

- import: ../../components/clojure/index.yml
  tags: [dev, clojure, config]

- name: Use zsh component
  use: ../../components/zsh/index.yml
  tags: [core, shell]


- import: ../../components/tmux/index.yml
  tags: [tools, tmux]

- name: Use nvim component
  use: ../../components/nvim/index.yml
  props:
    use_win32yank: "true"
  tags: [editor, nvim]

# Private self-hosted git host. Builds from ~/projects/moongit and runs
# moongitd as a user systemd service (API + git + web UI on one port).
# This box is the main server.
- name: Use moongit component
  # No props: every remaining prop has a component default (dex_serve_port
  # was the only one this machine overrode — dotfiles#91).
  use: ../../components/moongit/index.yml
  tags: [tools, moongit]

# mooncake CI image only (mooncake-ci:latest = moongit-ci-dev + gomarkdoc).
# Imported after moongit so its base image exists; this box runs mooncake's
# server-side CI. mooncake itself isn't provisioned here. See mooncake#100.
- name: Use mooncake component
  use: ../../components/mooncake/index.yml
  tags: [tools, mooncake]

# provision CI image (provision-ci:latest = mooncake-ci + the provision
# binary). After mooncake, because it builds FROM that image: moongitd
# execs every CI step as `mooncake step`, so the base has to carry mooncake
# regardless. This box is the CI server.
- name: Use provision component
  use: ../../components/provision/index.yml
  tags: [tools, provision]

# Inbound fleet access. Gated on fleet_peer_enabled (false in ./vars.yml
# until dotfiles#2's authorized_keys reconciliation is done) — see
# components/fleet-peer/index.yml. Last, deliberately: it asserts on a
# live agentd, so it should fail after the rest of the machine is
# provisioned rather than before.
- import: ../../components/fleet-peer/index.yml
  tags: [wsl, fleet-peer]
