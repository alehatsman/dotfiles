---
# main_pc — Windows 11 desktop, provisioned via WSL2 Ubuntu.
#
# Two-step provisioning:
#   1. Windows host (from an Administrator PowerShell):
#        provision.exe apply platforms\windows\bootstrap.yml \
#                           -v shared/variables.yml -v machines/main_pc/vars.yml
#   2. Inside WSL Ubuntu, via the root entry (NOPASSWD sudo, no -K):
#        provision apply ./main_pc.yml
#
# vars_file lines come first because shared/guard.yml reads `computer_name`
# from them. Order: shared defaults, machine overrides, then the inline
# identity block last so is_wsl/wsl_distro/wsl_ssh_port win regardless of
# source.

- vars_file: ../../shared/variables.yml
- vars_file: ./vars.yml

- vars:
    is_wsl: true
    wsl_distro: "Ubuntu-24.04"
    wsl_ssh_port: "2222"

# Refuse to run if the live hostname belongs to a different known machine
# (issue #3 — we've hit main_pc/x1 mixups before). See shared/guard.yml.
- import: ../../shared/guard.yml

# SSH identity, passwordless sudo, systemd linger, provision capability check.
- import: ../../shared/bootstrap.yml

- import: ../../platforms/windows/index.yml
  tags: [wsl, windows]

# palette, claude, codex, git, cli, languages
- import: ../../shared/core.yml

# Recording tools for capturing a real `apply`/`plan` run as a README
# gif (dotfiles#93). After languages — agg installs via cargo.
- import: ../../components/asciinema/index.yml
  tags: [tools, asciinema]

# zsh, tmux, nvim
- import: ../../shared/shell.yml

# Headless terminal/session daemon, reached from the phone over Tailscale
# Serve (https://mainpc.tail37c478.ts.net). After shared/shell.yml because
# the build needs cargo from core's languages component, and node/npm from
# platforms/windows/packages.yml for the embedded web UI.
#
# This box was already running a hand-installed teleportd with a hand-written
# systemd unit -- working, but declared nowhere. This import adopts it; see
# docs/teleport-linux.md.
- name: Use teleport component
  use: ../../components/teleport/index.yml
  props:
    # From `tailscale status` on this box. Tailscale pins this at device
    # registration and it does not follow OS hostname renames, so it is
    # genuinely per-machine (dotfiles#15).
    teleport_tailnet_hostname: mainpc.tail37c478.ts.net
    # Safe only because the anchord import below exists on this box.
    # Flipping this without it gives a teleportd that starts healthy — the
    # anchor client connects lazily — and then fails every session it is
    # asked to create (anchor#7).
    teleport_use_anchor: true
  tags: [tools, teleport]

# anchord owns the PTYs teleportd drives, so teleportd can be restarted —
# shipped, in practice — without killing live agent sessions. Listed after
# teleport deliberately: config.toml above turns the flag on, and a teleportd
# that starts with use_anchor=true before anchord is installed finds nothing
# to connect to (anchor#7).
- name: Use anchord component
  use: ../../components/anchord/index.yml
  tags: [tools, anchord]

# Private self-hosted git host. Builds from ~/projects/codefort and runs
# codefortd as a user systemd service (API + git + web UI on one port).
# This box is the main server.
- name: Use codefort component
  # No props: every remaining prop has a component default.
  use: ../../components/codefort/index.yml
  tags: [tools, codefort]

# carscrape dev checkout. Collection moved to mini_pc (carscrape S5-8), so the
# hub, its Postgres, the RDW timer and the runner are declared stopped and
# disabled here: a boot must never start a second runner or hub. `hub` stays
# local so a hand-started dev runner can never post to the live hub on mini_pc.
- name: Use carscrape component
  use: ../../components/carscrape/index.yml
  props:
    dir: "{{ carscrape_dir }}"
    hub: "http://localhost:8000"
    hub_active: false
    runner_active: false
  tags: [tools, carscrape]

# mooncake + the provision CI-image build were removed with mooncake. This
# box's codefort-ci / codefort-ci-dev / provision-ci images are no longer
# built — codefort's own CI runner execs `mooncake step` inside them, which
# needs a fix in the codefort repo (out of scope here). See CLAUDE.md.

# Inbound fleet access. Gated on fleet_peer_enabled ("true" in ./vars.yml) —
# see components/fleet-peer/index.yml. On this WSL box only the
# authorized_keys half runs: the sshd half is darwin-gated, and Linux sshd
# here comes from platforms/windows/index.yml.
#
# Kept last. The live-agentd assert that originally forced this position went
# with mooncake (see CLAUDE.md), but rendering access control after the rest
# of the machine is provisioned is still the order we want.
- import: ../../components/fleet-peer/index.yml
  tags: [wsl, fleet-peer]
