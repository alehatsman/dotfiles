---
# main_pc-specific variables (Windows + WSL Ubuntu).
is_wsl: true
computer_name: mainpc
wsl_distro: "Ubuntu-24.04"
wsl_ssh_port: "2222"
# Mooncake agentd TCP ports.
#   wsl_agentd_port (7878)    — Linux daemon inside the Ubuntu VM.
#                               Mirrored networking exposes it on the
#                               Windows host's LAN IP. Needs BOTH a
#                               Windows Firewall rule AND a Hyper-V
#                               Firewall rule (see bootstrap.yml).
#   windows_agentd_port (7879) — Windows daemon on the host itself.
#                                Only needs the regular WinFW rule.
# Both daemons appear as separate peers in peers.toml for fleet apply.
wsl_agentd_port: "7878"
windows_agentd_port: "7879"

# moongit server (components/moongit, MOONGIT_ADDR=:8080). moongitd binds
# *:8080, so mirrored networking puts it on the Windows host's LAN IP —
# but the Hyper-V VM defaults to DefaultInboundAction=Block, so reaching
# it from another box needs BOTH a Windows Firewall rule AND a Hyper-V
# Firewall rule (see bootstrap.yml), same as wsl_ssh_port/wsl_agentd_port.
# Direct LAN access avoids the SSE-coalescing an `ssh -L 8080` tunnel adds.
wsl_moongit_port: "8080"

# ─── claude — host-specific system prompt ─────────────────────────────────
# main_pc is the fleet's coordination + intel hub: it runs the moongit
# server (components/moongit) and the dex embedding server (dex_role:
# server). Agents here are beta testers of that stack, so they get a slim
# host-specific ~/.claude/CLAUDE.md that mandates mgit issue coordination
# and dex-first code intel instead of the shared trooper prompt. Path is
# resolved relative to components/claude/.
# claude_system_prompt_src: "../../machines/main_pc/CLAUDE.md"

# ─── dex — semantic-search MCP helper ─────────────────────────────────────
# This box has the RTX 5090 — embedding + interactive ask host for the fleet.
# Overrides the shared default of `client`. First provision pulls CUDA +
# the embedding container; confirm `nvidia-smi` works inside WSL first.
dex_role: server

# qwen2.5-coder:14b (~9 G) — non-thinking coder for ask/generate synthesis.
# Demoted from Qwen3-Coder-30B-A3B (~19 G) to free VRAM for the expansion
# model (dex #252). Qwen3-gen coders only ship at 30B (no mid-size), and
# qwen3.x *thinking* models route their output to a reasoning channel that
# leaves `content` empty over the OpenAI-compat API — unusable here. So we
# stay on the non-thinking qwen2.5-coder line. History: 32B-Q4 → 30B-A3B-MoE → 14B.
dex_chat_model: "qwen2.5-coder:14b"

# Query-side expansion model (dex #252): one fast call per opt-in ask turns
# the question into BM25/symbol terms (+ optional HyDE passage). Non-thinking
# coder so the JSON lands in `content`. ~4.7 G; warm-pinned by dex-serve.service.j2.
# (The expansion call sends reasoning_effort=none defensively regardless.)
dex_expand_model: "qwen2.5-coder:7b"
dex_expand_mode: "full"

# qwen3-embedding:0.6b — same Qwen3 family, 6x smaller/faster (~0.4 G, competitive MTEB quality).
dex_embed_model: "qwen3-embedding:0.6b"

# VRAM budget on the 32 G card (keep_alive=-1, NUM_PARALLEL=1). Warm sizes
# include KV cache at 32k ctx, not just weights — these are measured, not
# weight-only estimates:
#   embed-0.6b      ~0.4 G  (qwen3-embedding:0.6b — same family, 6x faster)
#   chat-coder-14b  ~15 G   (qwen2.5-coder:14b Q4 — ~9 G weights + 32k KV)
#   reranker-4b     ~5.9 G  (vLLM Qwen3-Reranker-4B, gpu-mem-util 0.18, len 2048)
#   ──────────────────────
#   total          ~21.3 G  (~10.7 G headroom on 32 G card)
#
# NUM_PARALLEL=1 is load-bearing here: at 4 the chat model's KV alone balloons
# to ~35 G and spills to CPU. expand-coder-7b (~4.7 G, qwen2.5-coder:7b, dex
# #252) does NOT fit alongside the three above — with all pinned it would OOM,
# so it can only load if something is evicted first. The sequential pipeline
# (embed→rerank→ask) keeps them from all firing at once.
dex_ollama_keep_alive: "-1"

# Single parallel slot (override shared default of 4). dex on this box is a
# single-user sequential pipeline (embed→rerank→ask), and keep_alive=-1 pins
# every model — so NUM_PARALLEL=4 would reserve 4× the KV cache per pinned
# model (e.g. qwen2.5-coder:14b balloons from ~9 G weights to ~35 G loaded at
# 32k ctx × 4). The VRAM budget below assumes one slot.
dex_ollama_num_parallel: "1"

# GPU for the reranker: Qwen3-Reranker-4B needs GPU for 1–2s latency on 40
# candidates. vLLM reserves ~5.9 G (gpu-mem-util 0.18, max-model-len 2048) —
# see the budget above. server.yml runs vLLM when dex_rerank_style=chat-vllm.
dex_rerank_gpu: "1"

# Docker Desktop + WSL "mirrored" networking does NOT expose container ports on
# 127.0.0.1 (the loopback publish is unreachable from the host; only the eth0
# IP / docker0 gateway / host.docker.internal work). So publish the reranker on
# 0.0.0.0 and have dex reach it via host.docker.internal instead of 127.0.0.1.
# Defaults (127.0.0.1) stay correct for native-docker hosts and tunnel clients.
dex_rerank_publish_addr: "0.0.0.0"
dex_rerank_connect_host: "host.docker.internal"

# Long-lived project roots to keep auto-reindexed via dex-watch@.
# Adding a path here = enabled at next apply; removing it = disabled.
# Ad-hoc worktrees come and go through the zsh gwc/gwd helpers; only
# durable checkouts belong in this list.
# moongit is split into two dex roots: the Go module at repo root and the
# TS frontend at web/ (own .dex/config.toml, separate graph) — both watched
# + served (moongit #292 / dex #13).
dex_watch_paths: "/home/{{ username }}/dotfiles /home/{{ username }}/projects/mooncake /home/{{ username }}/projects/dex /home/{{ username }}/projects/moongit /home/{{ username }}/projects/moongit/web"
