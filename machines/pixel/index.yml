---
# pixel — Pixel 9a, GrapheneOS. Every step runs on the Mac and reaches the
# phone through adb; each is `unless`-gated, so a converged phone plans clean.
#
# Manual, once, in order (nothing below can do these):
#   1. Flash GrapheneOS from https://grapheneos.org/install/web and lock the
#      bootloader. First-boot wizard: leave "OEM unlocking" ticked (disables it).
#   2. Settings > About phone > tap Build number x7; Developer options >
#      USB debugging on; plug in, Allow this Mac.
#   3. Apps (GrapheneOS store) > Google Play services > Install. Sign in to
#      Play. The plan then opens each Play app's page; you tap Install.
#   4. After the first apply: open Termux once so it bootstraps, apply again.
#   5. Settings the last step checks (it lists each one that drifted):
#      Network & internet > VPN >
#      NordVPN gear > Always-on + Block connections without VPN; Hotspot >
#      "Turn off hotspot automatically" off, WPA3, long password.
#   6. Not checkable from adb: Network & internet > SIMs > Allow 2G off;
#      Security > duress PIN; SIM PIN.
#   7. Authenticator: restore the cloud backup, but add new accounts only on
#      the primary phone (one backup per Microsoft account, single writer).
#      Work accounts: add this phone as a 2nd device at aka.ms/mysecurityinfo.
#   8. Done: Developer options > USB debugging off.
#
# Roles (dotfiles#29): NordVPN always-on; cellular uplink for the routers --
# GrapheneOS can't send hotspot traffic through a VPN, so the router holds
# the VPN; backup authenticator.

- name: adb on the Mac
  pkg:
    name: android-platform-tools
    manager: brew
    cask: true
    state: present
  when: os == 'darwin'
  tags: [pixel, adb]

- name: Refuse unless exactly one authorized {{ pixel_model }} is attached
  assert:
    command: |
      set -eu
      [ "$(adb devices | grep -c 'device$')" = 1 ] || { echo "need exactly one authorized adb device" >&2; exit 1; }
      [ "$(adb shell getprop ro.product.model | tr -d '\r')" = "{{ pixel_model }}" ]
  tags: [pixel, safety]

# ─── APKs, pinned ─────────────────────────────────────────────────────────
- name: Fetch Unexpected Keyboard {{ unexpected_keyboard_version }}
  download:
    url: https://github.com/Julow/Unexpected-Keyboard/releases/download/{{ unexpected_keyboard_version }}/Unexpected-Keyboard-release.apk
    dest: ~/.cache/dotfiles/pixel/unexpected-keyboard-{{ unexpected_keyboard_version }}.apk
    sha256: "{{ unexpected_keyboard_sha256 }}"
  tags: [pixel, apk]

- name: Install Unexpected Keyboard
  shell: adb install -r "$HOME/.cache/dotfiles/pixel/unexpected-keyboard-{{ unexpected_keyboard_version }}.apk"
  unless: adb shell dumpsys package juloo.keyboard2 | grep -q 'versionName={{ unexpected_keyboard_version }}'
  tags: [pixel, apk]

- name: Fetch Termux {{ termux_version }}
  download:
    url: https://github.com/termux/termux-app/releases/download/v{{ termux_version }}/termux-app_v{{ termux_version }}+github-debug_arm64-v8a.apk
    dest: ~/.cache/dotfiles/pixel/termux-{{ termux_version }}-arm64.apk
    sha256: "{{ termux_sha256 }}"
  tags: [pixel, apk, termux]

- name: Install Termux
  shell: adb install -r "$HOME/.cache/dotfiles/pixel/termux-{{ termux_version }}-arm64.apk"
  unless: adb shell dumpsys package com.termux | grep -q 'versionName={{ termux_version }}'
  tags: [pixel, apk, termux]

# ─── System settings ──────────────────────────────────────────────────────
- name: Unexpected Keyboard as the default keyboard
  shell: |
    set -eu
    adb shell ime enable juloo.keyboard2/.Keyboard2
    adb shell ime set juloo.keyboard2/.Keyboard2
  unless: '[ "$(adb shell settings get secure default_input_method | tr -d "\r")" = juloo.keyboard2/.Keyboard2 ]'
  tags: [pixel, keyboard]

# Zero animations, 120 Hz ceiling (min left alone: idle drop saves battery),
# 300 ms long-press. One table drives both the apply and the check.
- name: Snappy UI
  shell: |
    set -eu
    while read -r ns key val; do adb shell -n settings put "$ns" "$key" "$val"; done <<'EOF'
    global window_animation_scale 0
    global transition_animation_scale 0
    global animator_duration_scale 0
    system peak_refresh_rate 120
    secure long_press_timeout 300
    EOF
  unless: |
    set -eu
    while read -r ns key val; do
      [ "$(adb shell -n settings get "$ns" "$key" | tr -d '\r')" = "$val" ] || exit 1
    done <<'EOF'
    global window_animation_scale 0
    global transition_animation_scale 0
    global animator_duration_scale 0
    system peak_refresh_rate 120
    secure long_press_timeout 300
    EOF
  tags: [pixel, ui]

# Display stays on while on the cable (owner's call, dotfiles#30): the
# phone never auto-locks there -- keep it somewhere physically trusted.
# 15 = AC|USB|wireless|dock. A battery held at 100% wears out --
# battery_charge_limit is GrapheneOS's Battery > Charging optimization (80%).
- name: Power and lock settings
  shell: |
    set -eu
    while read -r ns key val; do adb shell -n settings put "$ns" "$key" "$val"; done <<'EOF'
    global stay_on_while_plugged_in 15
    global battery_charge_limit 1
    secure lockscreen_scramble_pin_layout 1
    EOF
  unless: |
    set -eu
    while read -r ns key val; do
      [ "$(adb shell -n settings get "$ns" "$key" | tr -d '\r')" = "$val" ] || exit 1
    done <<'EOF'
    global stay_on_while_plugged_in 15
    global battery_charge_limit 1
    secure lockscreen_scramble_pin_layout 1
    EOF
  tags: [pixel, security]

# Late MFA pushes otherwise. A no-op until sandboxed Play is installed.
- name: Exempt Play services from battery optimization
  shell: |
    set -eu
    adb shell cmd appops set com.google.android.gms RUN_ANY_IN_BACKGROUND allow
    adb shell dumpsys deviceidle whitelist +com.google.android.gms
  unless: |
    ! adb shell pm path com.google.android.gms | grep -q . ||
    { adb shell dumpsys deviceidle whitelist | grep -q ',com.google.android.gms,' &&
      adb shell cmd appops get com.google.android.gms RUN_ANY_IN_BACKGROUND | grep -q allow; }
  tags: [pixel, play]

# Play can't be driven reliably from adb (lost confirm dialogs, stray
# Install buttons), so a human taps Install; this opens each missing app's
# page in turn and waits for it to land. Re-apply resumes where it stopped.
- name: Play Store apps (tap Install on each page that opens)
  shell: |
    set -eu
    adb shell pm path com.android.vending >/dev/null || { echo "install sandboxed Play first (manual step 3)" >&2; exit 1; }
    for id in {{ play_apps }}; do
      adb shell pm path "$id" >/dev/null 2>&1 && continue
      echo "waiting for Install tap: $id" >&2
      adb shell am start -a android.intent.action.VIEW -d "market://details?id=$id" -p com.android.vending >/dev/null
      t=0
      until adb shell pm path "$id" >/dev/null 2>&1; do
        sleep 3; t=$((t + 3))
        [ "$t" -lt 300 ] || { echo "not installed after 5m: $id" >&2; exit 1; }
      done
    done
  unless: |
    for id in {{ play_apps }}; do adb shell pm path "$id" >/dev/null 2>&1 || exit 1; done
  timeout: 30m
  tags: [pixel, play]

# ─── Termux ───────────────────────────────────────────────────────────────
- name: Termux (packages, dotfiles, zsh, SSH key)
  use: ../../components/termux/index.yml
  tags: [pixel, termux]

# ─── Checks ───────────────────────────────────────────────────────────────
# Set by hand in Settings (adb can read them, not reliably set them). Last,
# so everything above has applied before this fails. Lists every drift.
- name: Role settings set by hand (header step 5)
  assert:
    command: |
      bad=0
      drift() { echo "drift: $1" >&2; bad=1; }
      g() { adb shell -n settings get "$1" "$2" | tr -d '\r'; }
      r=$(g global settings_reboot_after_timeout)
      [ "$r" = null ] || [ "$r" = 64800000 ] || drift "auto-reboot is ${r}ms, want 18h (Security > Auto reboot)"
      [ "$(g secure always_on_vpn_app)" = com.nordvpn.android ] || drift "always-on VPN not NordVPN (Network & internet > VPN)"
      [ "$(g secure always_on_vpn_lockdown)" = 1 ] || drift "VPN lockdown off (VPN > NordVPN > Block connections without VPN)"
      adb shell -n dumpsys wifi | grep -q 'AutoShutdownEnabled = false' || drift "hotspot auto-off on (Hotspot > Turn off hotspot automatically)"
      exit $bad
  tags: [pixel, check]
