---
# mac-specific variables.
is_wsl: false
computer_name: mac

# ─── Fleet peer ───────────────────────────────────────────────────────────
# mac accepts inbound SSH from the fleet. Before dotfiles#2 this box was a
# leaf: it could reach main_pc-wsl, but nothing could reach it.
#
# Opening a workstation to inbound SSH is a real posture change, which is why
# the default in shared/variables.yml is false and this is an explicit opt-in.
# Only the keys in fleet_ssh_keys get in; password auth is untouched (macOS
# ships PasswordAuthentication yes — hardening that is manual, since it edits
# /etc/ssh/sshd_config).
fleet_peer_enabled: "true"
