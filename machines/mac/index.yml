---
# mac — macOS workstation. Homebrew + macOS defaults + dotfiles.

# Refuse to run if the live hostname belongs to a different known machine
# (cross-provisioning guard, issue #3). Exclusion list, not a strict match:
# a genuinely fresh box's hostname is neither 'mac' nor any of these, so
# first-time bootstrap (before "Set computer name" below has run) is never
# blocked — only a hostname already claimed by another machine trips it.
- name: Refuse to apply mac's plan on a different known machine
  assert:
    command:
      cmd: |
        h="{{ hostname }}"
        case "$h" in
          mainpc|minipc|work-mac|x1)
            echo "refusing: hostname is '$h', not mac — wrong machine?" >&2
            exit 1 ;;
        esac
  tags: [safety]

- vars.load: ../../shared/variables.yml
- vars.load: ./vars.yml

- vars:
    is_wsl: false

- import: ../../shared/bootstrap.yml

- import: ../../platforms/macos/index.yml
  tags: [macos]

- name: Install personal-mac casks
  pkg:
    manager: brew
    cask: true
    state: present
    names:
      - google-chrome
      - slack
      - veracrypt
  tags: [macos, packages]

- name: Set computer name
  shell: |
    set -euo pipefail
    scutil --set ComputerName "{{ computer_name }}"
    scutil --set LocalHostName "{{ computer_name }}"
    scutil --set HostName "{{ computer_name }}"
  as_user: root
  tags: [macos]

# Cross-platform components
# Palette must come first — every later component's templates read
# palette.* / editor.* from the variant selected by `palette_variant`.
- name: Use pallete component
  use: ../../components/palette/index.yml
  props:
    variant: "{{ palette_variant }}"
  tags: [core, palette]

- import: ../../components/claude/index.yml
  tags: [core, claude]

- import: ../../components/codex/index.yml
  tags: [core, codex]

- import: ../../components/git/index.yml
  tags: [core, git]

- import: ../../components/languages/index.yml
  tags: [dev, languages]

- import: ../../components/usql/index.yml
  tags: [tools, usql]

- import: ../../components/clojure/index.yml
  tags: [dev, clojure, config]

- name: Use zsh component
  use: ../../components/zsh/index.yml
  tags: [core, shell]


- import: ../../components/tmux/index.yml
  tags: [tools, tmux]

- name: Use nvim component
  use: ../../components/nvim/index.yml
  props:
    use_win32yank: "false"
  tags: [editor, nvim]

# Terminal
- import: ../../components/alacritty/index.yml
  tags: [macos, terminal, config]

# Inbound fleet access. Gated on fleet_peer_enabled (true in ./vars.yml) —
# see components/fleet-peer/index.yml and docs/macos-peer-setup.md.
# Last, deliberately: it asserts on a live sshd + agentd, so it should fail
# after the rest of the machine is provisioned rather than before.
- import: ../../components/fleet-peer/index.yml
  tags: [macos, fleet-peer]
