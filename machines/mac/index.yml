---
# mac — macOS workstation. Homebrew + macOS defaults + dotfiles.

# Refuse to run if the live hostname belongs to a different known machine
# (cross-provisioning guard, issue #3). Exclusion list, not a strict match:
# a genuinely fresh box's hostname is neither 'mac' nor any of these, so
# first-time bootstrap (before "Set computer name" below has run) is never
# blocked — only a hostname already claimed by another machine trips it.
- name: Refuse to apply mac's plan on a different known machine
  assert:
    command: |
      h="{{ hostname }}"
      case "$h" in
        mainpc|minipc|work-mac|x1)
          echo "refusing: hostname is '$h', not mac — wrong machine?" >&2
          exit 1 ;;
      esac
  tags: [safety]

- vars_file: ../../shared/variables.yml
- vars_file: ./vars.yml

- vars:
    is_wsl: false

- import: ../../shared/bootstrap.yml

- import: ../../platforms/macos/index.yml
  tags: [macos]

# Discord was installed by hand into /Applications; a plain cask install
# refuses an app that is already there. --adopt takes it over in place.
- name: Adopt the hand-installed Discord into brew
  shell: brew install --cask --adopt discord
  unless: brew list --cask discord >/dev/null 2>&1 || [ ! -d /Applications/Discord.app ]
  tags: [macos, packages, apps]

- name: Install personal-mac casks
  pkg:
    manager: brew
    cask: true
    state: present
    names:
      - google-chrome
      - slack
      - veracrypt
      - nordvpn
      - discord
      - claude-code
  tags: [macos, packages, apps]

# Installed by hand once, declared nowhere, used by no config (dotfiles#32).
# Absent rather than forgotten, so the next audit starts clean. ollama's
# models in ~/.ollama stay; brew does not touch them.
- name: Remove unused casks
  pkg:
    manager: brew
    cask: true
    state: absent
    names:
      - docker-desktop  # podman replaced it (platforms/macos/packages.yml)
  tags: [macos, packages, apps]

- name: Remove unused formulae
  pkg:
    manager: brew
    state: absent
    names:
      - ollama
      - autoenv
      - autojump
      - pyenv-virtualenv
      - watchman
      - xsv
      - boot-clj
      - lastpass-cli
      - terraform-inventory
      - hub
      - reattach-to-user-namespace
      - ios-webkit-debug-proxy
      - vim  # macOS ships /usr/bin/vim; nvim is the editor
  tags: [macos, packages, apps]

# Retired toolchains (dotfiles#34): Clojure, cloud/infra CLIs, databases.
# work_mac still declares them in its own plan. Before languages, so the
# clojure tools are gone before the JDK they depend on. Data dirs
# (~/.m2, ~/.clojure, ~/.config/gcloud, ...) stay.
- name: Remove retired formulae
  pkg:
    manager: brew
    state: absent
    names:
      - clojure
      - leiningen
      - clj-kondo
      - awscli
      - aws-iam-authenticator
      - packer
      - terraform
      - kubernetes-cli
      - dive
      - caddy
      - libpq
      - xclip  # X11 clipboard; macOS has pbcopy
  tags: [macos, packages, apps]

- name: Remove retired casks
  pkg:
    manager: brew
    cask: true
    state: absent
    names:
      - amazon-workspaces
      - gcloud-cli
      - pgadmin4
      - postman
      - kap
      - transmission
      - tunnelblick
      - xmind
  tags: [macos, packages, apps]

# usql came from `go install` (no brew formula); components/usql is retired
# here, work_mac still imports it.
- name: Remove usql
  file:
    path: ~/go/bin/usql
    state: absent
  tags: [macos, packages, apps]

- name: Untap retired brew taps
  shell: |
    set -euo pipefail
    for t in wata727/tflint borkdude/brew wagoodman/dive hashicorp/tap adoptopenjdk/openjdk; do
      if brew tap | grep -qx "$t"; then brew untap "$t"; fi
    done
  unless: "! brew tap | grep -qxE 'wata727/tflint|borkdude/brew|wagoodman/dive|hashicorp/tap|adoptopenjdk/openjdk'"
  tags: [macos, packages, apps]

- name: Set computer name
  shell: |
    set -euo pipefail
    scutil --set ComputerName "{{ computer_name }}"
    scutil --set LocalHostName "{{ computer_name }}"
    scutil --set HostName "{{ computer_name }}"
  # All three names, because the step sets all three and any one of them
  # can be right while another is not -- a machine renamed in System
  # Settings moves ComputerName and leaves HostName behind. A name that
  # was never set makes `scutil --get` exit 1 with "not set" on stderr,
  # which the comparison reads as "does not match" and runs the step.
  unless: |
    set -eu
    [ "$(scutil --get ComputerName 2>/dev/null)" = "{{ computer_name }}" ] &&
    [ "$(scutil --get LocalHostName 2>/dev/null)" = "{{ computer_name }}" ] &&
    [ "$(scutil --get HostName 2>/dev/null)" = "{{ computer_name }}" ]
  sudo: true
  tags: [macos]

# Cross-platform components
# Palette must come first — every later component's templates read
# palette.* / editor.* from the variant selected by `palette_variant`.
- import: ../../components/palette/index.yml
  tags: [core, palette]

- import: ../../components/claude/index.yml
  tags: [core, claude]

- import: ../../components/codex/index.yml
  tags: [core, codex]

- import: ../../components/git/index.yml
  tags: [core, git]

- import: ../../components/cli/index.yml
  tags: [core, cli]

- import: ../../components/languages/index.yml
  tags: [dev, languages]

- name: Use teleport component
  use: ../../components/teleport/index.yml
  props:
    # mac's tailnet name at last check (dotfiles#14/#15) — offline right
    # now, so unverified against a fresh `tailscale status --self`. Update
    # if teleportd starts rejecting the real Origin/Host on this box again.
    teleport_tailnet_hostname: mac.tail37c478.ts.net
  tags: [tools, teleport]

# Hourly one-way mirror of Google Drive documents/, library/, notes/ to iCloud Drive (dotfiles#41).
- import: ../../components/gdrive-mirror/index.yml
  tags: [tools, gdrive-mirror]

# The cf client (components/codefort-client) was retired; remove its binary.
- name: Remove retired cf client
  shell: rm -f ~/.local/bin/cf ~/.local/bin/cf.sha
  unless: "! test -e ~/.local/bin/cf"
  tags: [tools]

- name: Use zsh component
  use: ../../components/zsh/index.yml
  tags: [core, shell]


- import: ../../components/tmux/index.yml
  tags: [tools, tmux]

- name: Use nvim component
  use: ../../components/nvim/index.yml
  props:
    use_win32yank: "false"
  tags: [editor, nvim]

# Terminal
- import: ../../components/alacritty/index.yml
  tags: [macos, terminal, config]

# Inbound SSH access. Gated on fleet_peer_enabled (true in ./vars.yml) —
# see components/fleet-peer/index.yml. Last, deliberately: it asserts on a
# live sshd, so it should fail after the rest of the machine is provisioned
# rather than before.
- import: ../../components/fleet-peer/index.yml
  tags: [macos, fleet-peer]
