---
# work_mac — NVIDIA work macOS workstation.

# Refuse to run if the live hostname belongs to a different known machine
# (cross-provisioning guard, issue #3). Exclusion list, not a strict match:
# a genuinely fresh box's hostname is neither 'work-mac' nor any of these,
# so first-time bootstrap (before "Set computer name" below has run) is
# never blocked — only a hostname already claimed by another machine trips it.
- name: Refuse to apply work_mac's plan on a different known machine
  assert:
    command: |
      h="{{ hostname }}"
      case "$h" in
        mainpc|minipc|mac|x1)
          echo "refusing: hostname is '$h', not work_mac — wrong machine?" >&2
          exit 1 ;;
      esac
  tags: [safety]

- vars_file: ../../shared/variables.yml
- vars_file: ./vars.yml

- vars:
    is_wsl: false

- import: ../../shared/bootstrap.yml

- import: ../../platforms/macos/index.yml
  tags: [macos]

- name: Set computer name
  shell: |
    set -euo pipefail
    scutil --set ComputerName "{{ computer_name }}"
    scutil --set LocalHostName "{{ computer_name }}"
    scutil --set HostName "{{ computer_name }}"
  # All three names, because the step sets all three and any one of them
  # can be right while another is not -- a machine renamed in System
  # Settings moves ComputerName and leaves HostName behind. A name that
  # was never set makes `scutil --get` exit 1 with "not set" on stderr,
  # which the comparison reads as "does not match" and runs the step.
  unless: |
    set -eu
    [ "$(scutil --get ComputerName 2>/dev/null)" = "{{ computer_name }}" ] &&
    [ "$(scutil --get LocalHostName 2>/dev/null)" = "{{ computer_name }}" ] &&
    [ "$(scutil --get HostName 2>/dev/null)" = "{{ computer_name }}" ]
  sudo: true
  tags: [macos]

# Palette must come first — every later component's templates read
# palette.* / editor.* from the variant selected by `palette_variant`.
- import: ../../components/palette/index.yml
  tags: [core, palette]

- import: ../../components/claude/index.yml
  tags: [core, claude]

- import: ../../components/codex/index.yml
  tags: [core, codex]

- import: ../../components/git/index.yml
  tags: [core, git]

- import: ../../components/languages/index.yml
  tags: [dev, languages]

- import: ../../components/usql/index.yml
  tags: [tools, usql]

- name: Use zsh component
  use: ../../components/zsh/index.yml
  tags: [core, shell]

- import: ../../components/tmux/index.yml
  tags: [tools, tmux]

- name: Use nvim component
  use: ../../components/nvim/index.yml
  props:
    use_win32yank: "false"
  tags: [editor, nvim]

# Terminal
- import: ../../components/alacritty/index.yml
  tags: [macos, terminal, config]
