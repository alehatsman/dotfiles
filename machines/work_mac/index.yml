---
# work_mac — NVIDIA work macOS workstation.
#
# vars_file lines come first because shared/guard.yml reads `computer_name`
# from them. This box's hostname is MDM-assigned and uppercase; the guard
# lowercases both sides (machines/work_mac/vars.yml).

- vars_file: ../../shared/variables.yml
- vars_file: ./vars.yml

- vars:
    is_wsl: false

# Refuse to run if the live hostname belongs to a different known machine
# (issue #3). Parameterized — see shared/guard.yml.
- import: ../../shared/guard.yml

# SSH identity, passwordless sudo, provision capability check.
- import: ../../shared/bootstrap.yml

- import: ../../platforms/macos/index.yml
  tags: [macos]

# Work-only tools, moved out of platforms/macos when the personal mac
# retired them (dotfiles#34). Unchanged for this box; pruning it is a
# separate call.
#
# Homebrew 6.0 won't load formulae from a third-party tap unless it is
# trusted -- `brew tap` no longer implies trust -- and `brew trust` is
# idempotent, so it runs every time. HashiCorp pulled packer/terraform
# from homebrew-core; their tap is the only brew source for them.
- name: Tap and trust work brew taps
  shell: |
    set -euo pipefail
    for t in wata727/tflint borkdude/brew wagoodman/dive hashicorp/tap; do
      brew tap | grep -qx "$t" || brew tap "$t"
      brew trust "$t"
    done
  changed_when: false
  timeout: 5m
  tags: [macos, packages]

- name: Install work brew formulae
  pkg:
    manager: brew
    state: present
    names:
      - aws-iam-authenticator
      - awscli
      - caddy
      - libpq
      - hashicorp/tap/packer
      - hashicorp/tap/terraform
      - clojure
      - leiningen
      - clj-kondo
      - dive
      - kubernetes-cli
      - xclip
  timeout: 30m
  tags: [macos, packages]

- name: Install work brew casks
  pkg:
    manager: brew
    cask: true
    state: present
    names:
      - amazon-workspaces
      - gcloud-cli  # renamed upstream from google-cloud-sdk
      - kap
      - pgadmin4
      - postman
      - transmission
      - tunnelblick
      - xmind
  timeout: 30m
  tags: [macos, packages]

- name: Set computer name
  shell: |
    set -euo pipefail
    scutil --set ComputerName "{{ computer_name }}"
    scutil --set LocalHostName "{{ computer_name }}"
    scutil --set HostName "{{ computer_name }}"
  # All three names, because the step sets all three and any one of them
  # can be right while another is not -- a machine renamed in System
  # Settings moves ComputerName and leaves HostName behind. A name that
  # was never set makes `scutil --get` exit 1 with "not set" on stderr,
  # which the comparison reads as "does not match" and runs the step.
  unless: |
    set -eu
    [ "$(scutil --get ComputerName 2>/dev/null)" = "{{ computer_name }}" ] &&
    [ "$(scutil --get LocalHostName 2>/dev/null)" = "{{ computer_name }}" ] &&
    [ "$(scutil --get HostName 2>/dev/null)" = "{{ computer_name }}" ]
  sudo: true
  tags: [macos]

# palette, claude, codex, git, cli, languages
- import: ../../shared/core.yml

- import: ../../components/usql/index.yml
  tags: [tools, usql]

- name: Use teleport component
  use: ../../components/teleport/index.yml
  props:
    # This box's OS hostname (scutil ComputerName) reset to the default
    # "GJ4VG9P1VJ" at some point, so Tailscale re-registered it under this
    # name instead of "work-mac" (dotfiles#14/#15). Update this if the
    # hostname/tailnet registration is ever fixed to follow "work-mac" again.
    teleport_tailnet_hostname: gj4vg9p1vj.tail37c478.ts.net
  tags: [tools, teleport]

# anchord owns the PTYs teleportd drives, so teleportd can be restarted --
# shipped, in practice -- without killing live agent sessions. Listed after
# teleport deliberately: config.toml above turns the flag on, and a teleportd
# that starts with use_anchor=true before anchord is installed finds nothing
# to connect to (anchor#7).
- name: Use anchord component
  use: ../../components/anchord/index.yml
  tags: [tools, anchord]

# zsh, tmux, nvim
- import: ../../shared/shell.yml

# Terminal
- import: ../../components/alacritty/index.yml
  tags: [macos, terminal, config]
