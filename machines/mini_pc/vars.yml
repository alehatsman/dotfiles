---
# mini_pc-specific variables (Windows + WSL Ubuntu).
is_wsl: true
computer_name: minipc
wsl_distro: "Ubuntu-24.04"
wsl_ssh_port: "2222"

# nvim's win32yank clipboard bridge (shared/shell.yml passes this through as
# a component prop). WSL2-only, so the shared default is "false" and the two
# WSL boxes opt in here. Previously a literal at the nvim call site in this
# file's index.yml.
use_win32yank: "true"
# Mirrored, same value as the shared default (shared/variables.yml). Stated
# explicitly because the firewall rules in platforms/windows/bootstrap.yml
# only make sense under this mode: mirrored puts the guest's ports on the
# host NIC, which is why both a Windows and a Hyper-V rule are needed.
#
# dotfiles#16 once ran this box on NAT + netsh portproxy, because mirrored
# flapped the guest's LAN exposure. That workaround is gone: the repo has no
# portproxy steps at all, and the keepalive tasks in bootstrap.yml are not
# gated on networking mode. Under mirrored, host and guest share one network
# namespace -- a stray Windows-side listener on a guest port collides with it.
wsl_networking_mode: "mirrored"
# codefort server port. mini_pc isn't the codefort host (main_pc is), but
# the shared platforms/windows/bootstrap.yml opens this port uniformly on
# every Windows box, so the var must be defined or the firewall step fails
# rendering "{{ wsl_codefort_port }}". codefortd binds *:8080 inside WSL.
wsl_codefort_port: "8080"

# Host-side winget packages on top of the shared list (shared/variables.yml).
windows_winget_packages_extra: [NordSecurity.NordVPN]

# Server box — never sleep on AC. Disables standby + hibernate so WSL and
# its ssh daemon stay reachable 24/7.
windows_prevent_sleep: true

# components/fleet-peer: render ~/.ssh/authorized_keys from the declared
# fleet_ssh_keys list, so the rest of the fleet can SSH in. Explicit opt-in,
# never a side effect of importing a platform. The sshd half of the component
# is darwin-gated; Linux sshd in this WSL guest already comes from
# platforms/windows/index.yml, so only authorized_keys fires here.
fleet_peer_enabled: "true"
