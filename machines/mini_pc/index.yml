---
# mini_pc — second Windows 11 box, provisioned via WSL2 Ubuntu.
# Same structure as main_pc; only vars values differ.
#
# vars_file lines come first because shared/guard.yml reads `computer_name`
# from them. Order of the rest is load-bearing: platform packages before the
# components that call them, core before shell (shared/core.yml explains the
# split), access control last.

- vars_file: ../../shared/variables.yml
- vars_file: ./vars.yml

- vars:
    is_wsl: true
    wsl_distro: "Ubuntu-24.04"
    wsl_ssh_port: "2222"

# Refuse to run if the live hostname belongs to a different known machine
# (issue #3). Parameterized — see shared/guard.yml.
- import: ../../shared/guard.yml

# SSH identity, passwordless sudo, systemd linger, provision capability check.
- import: ../../shared/bootstrap.yml

- import: ../../platforms/windows/index.yml
  tags: [wsl, windows]

# palette, claude, codex, git, cli, languages
- import: ../../shared/core.yml

# zsh, tmux, nvim
- import: ../../shared/shell.yml

# Headless terminal/session daemon, reached from the phone over Tailscale
# Serve (https://minipc.tail37c478.ts.net). After shared/shell.yml because
# the build needs cargo from core's languages component, and node/npm from
# platforms/windows/packages.yml for the embedded web UI.
#
# Unlike mainpc this box had no teleportd at all, so the first apply builds
# it from source -- slow once, then stamped by commit.
- name: Use teleport component
  use: ../../components/teleport/index.yml
  props:
    # From `tailscale status` on this box (dotfiles#15).
    teleport_tailnet_hostname: minipc.tail37c478.ts.net
    # Safe only because the anchord import below exists on this box.
    # Flipping this without it gives a teleportd that starts healthy — the
    # anchor client connects lazily — and then fails every session it is
    # asked to create (anchor#7).
    teleport_use_anchor: true
  tags: [tools, teleport]

# anchord owns the PTYs teleportd drives, so teleportd can be restarted —
# shipped, in practice — without killing live agent sessions. Listed after
# teleport deliberately: config.toml above turns the flag on, and a teleportd
# that starts with use_anchor=true before anchord is installed finds nothing
# to connect to (anchor#7).
- name: Use anchord component
  use: ../../components/anchord/index.yml
  tags: [tools, anchord]

# carscrape's dashboard (the hub runs here since carscrape S5-8) on the
# tailnet over HTTPS: *.ts.net is HSTS-preloaded, so browsers refuse plain
# http://minipc.tail37c478.ts.net:8000. 443 belongs to teleportd, so 8443.
# --bg persists across tailscaled restarts. dotfiles#46.
- name: Serve the carscrape dashboard on the tailnet (https :8443)
  shell: tailscale serve --bg --https=8443 http://127.0.0.1:8000
  unless: tailscale serve status 2>/dev/null | grep -q '127.0.0.1:8000'
  tags: [tools, carscrape]

# carscrape hub box (since carscrape S5-8): hub, Postgres, RDW timer and runner
# all active. The runner posts to the local hub; Telegram digest links use the
# tailnet HTTPS URL served above. Telegram stays off until the user says go
# (carscrape S2-20). These props replace the hand-run `--prop`s of the S5-8
# cutover (carscrape S5-3).
- name: Use carscrape component
  use: ../../components/carscrape/index.yml
  props:
    dir: "{{ carscrape_dir }}"
    hub: "http://localhost:8000"
    public_url: "https://minipc.tail37c478.ts.net:8443"
    headless: true
    tg_enabled: false
    hub_active: true
    runner_active: true
  tags: [tools, carscrape]

# Inbound fleet access. Gated on fleet_peer_enabled ("true" in ./vars.yml) —
# see components/fleet-peer/index.yml. Last, deliberately, mirroring main_pc:
# it should fail after the rest of the machine is provisioned, not before.
- import: ../../components/fleet-peer/index.yml
  tags: [wsl, fleet-peer]
