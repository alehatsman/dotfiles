---
# mini_pc — second Windows 11 box, provisioned via WSL2 Ubuntu.
# Same structure as main_pc; only vars values differ.

# Refuse to run if the live hostname belongs to a different known machine
# (cross-provisioning guard, issue #3). Exclusion list, not a strict match:
# a genuinely fresh box's hostname is neither 'minipc' nor any of these, so
# first-time bootstrap is never blocked — only a hostname already claimed
# by another machine trips it. Covers mini_pc.yml and mini_pc_server.yml
# alike, since both import this file.
- name: Refuse to apply mini_pc's plan on a different known machine
  assert:
    command: |
      h="{{ hostname }}"
      case "$h" in
        mainpc|mac|work-mac|x1)
          echo "refusing: hostname is '$h', not mini_pc — wrong machine?" >&2
          exit 1 ;;
      esac
  tags: [safety]

- vars_file: ../../shared/variables.yml
- vars_file: ./vars.yml

- vars:
    is_wsl: true
    wsl_distro: "Ubuntu-24.04"
    wsl_ssh_port: "2222"

- import: ../../shared/bootstrap.yml

- import: ../../platforms/windows/index.yml
  tags: [wsl, windows]

# Cross-platform components
# Palette must come first — every later component's templates read
# palette.* / editor.* from the variant selected by `palette_variant`.
- import: ../../components/palette/index.yml
  tags: [core, palette]

- import: ../../components/claude/index.yml
  tags: [core, claude]

- import: ../../components/codex/index.yml
  tags: [core, codex]

- import: ../../components/git/index.yml
  tags: [core, git]

- import: ../../components/languages/index.yml
  tags: [dev, languages]

- import: ../../components/usql/index.yml
  tags: [tools, usql]

- import: ../../components/clojure/index.yml
  tags: [dev, clojure, config]

- name: Use zsh component
  use: ../../components/zsh/index.yml
  tags: [core, shell]

- import: ../../components/tmux/index.yml
  tags: [tools, tmux]

- name: Use nvim component
  use: ../../components/nvim/index.yml
  props:
    use_win32yank: "true"
  tags: [editor, nvim]
