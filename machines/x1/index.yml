---
# x1 — Arch laptop, Hyprland.
#
# vars_file lines come first because shared/guard.yml reads `computer_name`
# from them.

- vars_file: ../../shared/variables.yml
- vars_file: ./vars.yml

- vars:
    is_wsl: false

# Refuse to run if the live hostname belongs to a different known machine
# (issue #3). Parameterized — see shared/guard.yml.
- import: ../../shared/guard.yml

# SSH identity, passwordless sudo, systemd linger, provision capability check.
- import: ../../shared/bootstrap.yml

- import: ../../platforms/arch/index.yml
  tags: [arch, system, packages]

- name: Set computer name
  shell: hostnamectl set-hostname "{{ computer_name }}"
  # `set-hostname` with no qualifier writes the static hostname, so the
  # static hostname is what to read back. An unset one prints the empty
  # string and runs the step.
  unless: '[ "$(hostnamectl --static 2>/dev/null)" = "{{ computer_name }}" ]'
  sudo: true
  tags: [system]

# x1-specific tuning (TLP, RAPL, iGPU freq cap, HDA, i915 cmdline)
- import: ./thermal.yml
  tags: [thermal]

# palette, claude, codex, git, cli, languages
- import: ../../shared/core.yml

# zsh, tmux, nvim
- import: ../../shared/shell.yml

# Desktop — Hyprland install + config (component is now self-contained).
- import: ../../components/hyprland/index.yml
  tags: [gui, hyprland]
