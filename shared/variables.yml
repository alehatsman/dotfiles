---
# Cross-machine identity. Per-machine vars live in vars/<machine>.yml and
# are layered on top via a second `-v` flag.
#
#   provision apply <machine>.yml --ask-sudo-pass
#
# The current OS username is exposed by provision as {{ username }} — no
# need to set it here.
FULLNAME: "Aleh Atsman"
EMAIL: aleh.atsman@gmail.com
use_win32yank: false

# The shared CLI tool set (components/cli, dotfiles#35): binaries every dev
# machine must resolve, because the shared configs call them. Installed per
# package manager by components/cli; the pixel installs them via termux_pkgs.
cli_bins: [fzf, rg, fd, bat, lsd, delta, zoxide, direnv, jq, just, gh, htop, tree, lazygit, age]

# Java JDK (components/languages). Off for the personal fleet, which
# retired Java with Clojure (dotfiles#34): "false" declares the JDK absent.
java_enabled: "false"

# WSL2 networking mode for Windows hosts (platforms/windows). Default
# "mirrored" (guest ports on the host NIC directly). Override per-machine to
# "nat" to use an internal IP + netsh portproxy + a persistent-session
# keepalive — more robust LAN reachability where mirrored flaps (dotfiles #16).
wsl_networking_mode: "mirrored"

# Ubuntu release codename, used as the apt suite for third-party repos that
# publish per-release (pkgs.tailscale.com, hashicorp). The whole fleet's WSL
# guests are Ubuntu-24.04; override per-machine if one moves ahead.
ubuntu_codename: "noble"

# podman machine VM size on macOS (platforms/macos/packages.yml). podman's own
# default is 2 GiB, which OOM-kills the linker on Rust builds in containers
# (dotfiles#17). Override per-machine in machines/<m>/vars.yml.
podman_machine_memory_mib: "8192"
podman_machine_cpus: "6"

# Disable Windows sleep and hibernate on AC power (server/always-on boxes).
# Set true per-machine in machines/<m>/vars.yml. Default false (laptops keep
# their power policy).
windows_prevent_sleep: false
# AC sleep timeout in minutes for non-server boxes (windows_prevent_sleep: false).
windows_sleep_timeout_ac: 30

# ─── claude — global system prompt (~/.claude/CLAUDE.md) ──────────────────
# Source file the claude component deploys as the user-global system prompt.
# Path is resolved relative to components/claude/. Default is the shared
# hacker-trooper prompt; machines override per-host in machines/<m>/vars.yml
# (main_pc points this at its own cf-coordination variant).
claude_system_prompt_src: "./CLAUDE.md"

# ─── Color palette ──────────────────────────────────────────────────────────
# Selects which Monokai variant gets loaded by components/palette/index.yml.
# Every templated config across this repo (alacritty, waybar, wofi, dunst,
# hyprlock, hyprland, tmux, zsh fzf, vim) reads palette.* / editor.* from
# the chosen variant. Override per-machine in machines/<m>/vars.yml.
#   monokai_dark   — canonical Sublime ST2 Monokai (default)
#   monokai_light  — Sublime Monokai Light companion variant
palette_variant: monokai_dark

# ─── Fleet inbound SSH ──────────────────────────────────────────────────────
# The fleet's SSH *public* keys — the declared source of truth for which
# machines may open an inbound connection to a box that runs the fleet-peer
# component. Rendered to ~/.ssh/authorized_keys (0600); see
# components/fleet-peer/index.yml.
#
# Before this list existed every authorized_keys in the fleet was
# hand-maintained and no key was recorded in git except x1's, hardcoded in
# prose in docs/windows-ssh-setup.md — so a new inbound peer could not be
# provisioned reproducibly. See dotfiles#2.
#
# Public keys only. Nothing secret belongs in this repo.
#
# Grant = add an entry + apply. Revoke = delete the entry + apply; the
# render is authoritative, so a removed key is gone from the box on the
# next run rather than lingering until someone remembers to edit it.
fleet_ssh_keys:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMGss5QZDXkBE9WVH1VZLKG5aXH9edCJWUUASJsBBkNS alehatsman@x1"
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM5OzxDgC3g+RJoGmaGg8I0BTjxgJ5M7pvpOc9+E4hfY aleh@DESKTOP-R809R54"
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIClzS70tcJPT2CewdKbHkIB6TfNT+1UyhQokNT0PeKZE aleh.atsman@gmail.com"
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJJDqY94pJ6XXbjNOvY3BZu73DTH1L0c71+zU8Q8sNhK alehatsman@MacBook-Pro.home"
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIdOX6HWM6NHsXd2Bu2TSlJcy7Ue/p56dgpm3W1whzHv pixel-termux"
# TODO(dotfiles#2): mini_pc was offline when this list was collected and
# work_mac was never queried. Append their id_ed25519.pub and re-apply on
# every peer — until then neither can reach a fleet-peer machine.

# Outbound: ~/.ssh/config Host entries (components/ssh). Rendered only where
# ssh_config_managed is "true" -- the other machines still carry a
# hand-written config nobody has reconciled yet. The pixel always gets it.
# mac and pixel9 are NordVPN Meshnet names (dotfiles#36): the phone's
# always-on lockdown VPN keeps it off the tailnet.
# work-mac is tailnet-only (no Nord there). Tailnet hosts are dialed with
# `tailscale nc`, through tailscaled itself: on the mac, Nord Meshnet's
# 100.64.0.0/10 route captures tailnet IPs, and the brew tailscaled has no
# MagicDNS. Where ssh_tailnet_relay_enabled is "true" (the pixel, off the
# tailnet), `tailscale nc` runs on the `tailnet_relay` host, which sits on
# both networks.
ssh_hosts:
  - {name: main_pc-wsl, hostname: 192.168.1.68, port: 2222, user: aleh}
  - {name: mac, hostname: mac.nord, user: alehatsman}
  - {name: pixel9, hostname: pixel9.nord, port: 8022}
  - {name: work-mac, hostname: gj4vg9p1vj, user: aatsman, tailnet_relay: mac}
ssh_config_managed: "false"
ssh_tailnet_relay_enabled: "false"

# Whether this machine accepts inbound fleet SSH. Default false: opening a
# workstation to inbound SSH is opt-in, never a side effect of importing a
# platform. Machines that should be reachable set this true in
# machines/<m>/vars.yml.
fleet_peer_enabled: "false"
